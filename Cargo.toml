[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/shared",
    "crates/live-settings",
    "crates/telemetry",
    "crates/monokulo",
    "crates/mock-woocommerce",
    "crates/engine-test-support",
    "crates/e2e-harness",
    "crates/cli-wallet",
    "crates/snp-attest",
    "crates/key-custody",
    "crates/key-custody-cli",
    "crates/wallet-setup",
    "xtask",
]

# One version for every crate: a release tag (`v{version}`) names the
# monokulo, engine and key-custody-cli builds together, and CI refuses a tag
# that doesn't match. Monokulo builds its key-custody-cli download links from
# this version and `repository`, so an older instance links to the CLI built
# with it.
[workspace.package]
version = "0.1.0"
repository = "https://github.com/OceanEilonwy/monokulo"

# Every crate takes these (`[lints] workspace = true`). Clippy's default lints
# are errors, so `cargo clippy` fails locally exactly as it does in CI (which
# also runs it with `-D warnings`, for the compiler's own warnings).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
# Set by `cargo +nightly llvm-cov`, which leaves test code out of reports.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

# Password hashing (Argon2id) is deliberately slow; unoptimised, as in debug
# and test builds, one hash takes about a second, and most HTTP tests sign
# users up and in. Optimising just these dependencies keeps our own code
# unoptimised for debugging and coverage while tests run several times faster.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# The same for Monero output scanning (curve arithmetic and hashing): the
# scanner's fault-sweep tests scan the same payment thousands of times.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.monero]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.tiny-keccak]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
# RandomX (its C++ is built at this level too): block proof-of-work tests
# hash and mine real blocks.
[profile.dev.package.randomx-rs]
opt-level = 3
# TLS setup: every HTTP client a test builds loads and parses the platform's
# root certificates.
[profile.dev.package.rustls-webpki]
opt-level = 3
[profile.dev.package.rustls-pki-types]
opt-level = 3
[profile.dev.package.rustls-native-certs]
opt-level = 3
[profile.dev.package.untrusted]
opt-level = 3
