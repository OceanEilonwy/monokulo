[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/shared",
    "crates/engine-protocol",
    "crates/sqlite",
    "crates/credentials",
    "crates/dns-client",
    "crates/service-runtime",
    "crates/rate-limit",
    "crates/live-settings",
    "crates/telemetry",
    "crates/monokulo",
    "crates/mock-woocommerce",
    "crates/engine-test-support",
    "crates/e2e-harness",
    "crates/cli-wallet",
    "crates/snp-attest",
    "crates/key-custody",
    "crates/key-custody-cli",
    "crates/wallet-setup",
    "crates/short-id",
    "crates/static-assets",
    "crates/bakery",
    "crates/ui",
    "crates/ui-macros",
    "crates/api-macros",
    "xtask",
]

# One version for every crate: a release tag (`v{version}`) names the
# monokulo, engine and key-custody-cli builds together, and CI refuses a tag
# that doesn't match. Monokulo builds its key-custody-cli download links from
# this version and `repository`, so an older instance links to the CLI built
# with it.
[workspace.package]
version = "0.1.0"
repository = "https://github.com/OceanEilonwy/monokulo"

# Every crate takes these (`[lints] workspace = true`). Clippy's default lints
# are errors, so `cargo clippy` fails locally exactly as it does in CI (which
# also runs it with `-D warnings`, for the compiler's own warnings).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
# Set by `cargo +nightly llvm-cov`, which leaves test code out of reports.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

# Every dependency is optimised, even in dev and test builds; the workspace's
# own crates stay unoptimised for debugging (CI optimises them too, through
# CARGO_PROFILE_DEV_OPT_LEVEL in .github/actions/setup-rust; coverage alone
# builds them unoptimised there, so instrumented lines map to source).
# Tests spend most of their time in dependencies: SQLite, password hashing
# (Argon2id, about a second a hash unoptimised), Monero output scanning
# (curve arithmetic and hashing), RandomX proof of work (its C++ is built at
# this level too), the TLS root certificates every HTTP client loads and
# image decoding and encoding (unoptimised, the 552 screenshots of
# `cargo xtask pages build`'s gallery take minutes). A dependency is rebuilt
# only when Cargo.lock changes, and CI caches the build.
[profile.dev.package."*"]
opt-level = 3
