<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monokulo Docs Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one app bar; under it a left rail that is the whole map of the
   section, the reading column, and a right column that holds whatever the
   reader needs beside the words (the page's headings in Docs; the request,
   the response and the console in the API). Tokens are Monokulo's own
   (crates/ui/web/tokens.css), copied so the mockup stands alone. */
:root{
  --ink:#1a1917;--paper:#f4f1ea;--paper-raised:#fff;--surface-sunken:#efeae0;
  --line:#dcd5c7;--line-strong:#8c8577;--muted:#5a564c;
  --accent:#ff6600;--accent-hover:#e85d00;--accent-ink:#111;--accent-text:#b34700;
  --error:#b00020;--success:#1a7f37;--warning:#7d5e00;--blue:#0072b2;
  --logo-facet-mid:#ff6600;--logo-facet-warm:#e85d00;--logo-facet-deep:#c24e00;--logo-glint:#fff3e8;
  --tint-success:color-mix(in srgb,var(--success) 14%,var(--paper-raised));
  --tint-error:color-mix(in srgb,var(--error) 14%,var(--paper-raised));
  --tint-warning:color-mix(in srgb,var(--warning) 14%,var(--paper-raised));
  --tint-neutral:color-mix(in srgb,var(--muted) 12%,var(--paper-raised));
  --tint-highlight:color-mix(in srgb,var(--accent) 20%,var(--paper-raised));
  --tint-hover:color-mix(in srgb,var(--accent) 6%,var(--paper-raised));
  --scrim:color-mix(in srgb,var(--ink) 55%,transparent);
  --popup-shadow:color-mix(in srgb,var(--ink) 18%,transparent);
  --font-ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --space-xs:4px;--space-sm:8px;--space-md:12px;--space-lg:16px;--space-xl:24px;--space-2xl:32px;--space-3xl:48px;
  --radius-sm:5px;--radius-md:9px;--radius-lg:16px;
  --bar-h:58px;--rail-w:268px;--toc-w:220px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#d4d4d4;--paper:#1e1e1e;--paper-raised:#2a2a2a;--surface-sunken:#333;--line:#3d3d3d;--line-strong:#7a7a7a;--muted:#9d9d9d;
  --accent-hover:#ff7a1f;--accent-text:#ff8a3d;--error:#ff6b6b;--success:#4cc27a;--warning:#e0a83d;--blue:#5cb3ff;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#d4d4d4;--paper:#1e1e1e;--paper-raised:#2a2a2a;--surface-sunken:#333;--line:#3d3d3d;--line-strong:#7a7a7a;--muted:#9d9d9d;
  --accent-hover:#ff7a1f;--accent-text:#ff8a3d;--error:#ff6b6b;--success:#4cc27a;--warning:#e0a83d;--blue:#5cb3ff;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar-h) + var(--space-xl))}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.6 var(--font-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper-raised)}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
code{font-family:var(--font-mono);font-size:.86em;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.05em .35em;overflow-wrap:anywhere}
pre{margin:0;overflow-x:auto;font:13px/1.6 var(--font-mono)}
pre code{border:0;padding:0;background:none;font-size:inherit;overflow-wrap:normal}
button{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ---- the app bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--bar-h);background:var(--paper-raised);border-bottom:2px solid var(--accent);
  display:flex;align-items:center;gap:var(--space-lg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:var(--space-sm);font-weight:800;text-decoration:none;flex:none}
.brand svg{width:28px;height:28px}
.brand .sub{color:var(--muted);font-weight:700;padding-left:var(--space-sm);border-left:1px solid var(--line)}
.bar nav{display:flex;gap:2px;margin-left:var(--space-lg)}
.bar nav a{padding:6px 10px;border-radius:var(--radius-sm);text-decoration:none;font-weight:700;font-size:15px;color:var(--muted)}
.bar nav a:hover{background:var(--surface-sunken);color:var(--ink)}
.bar nav a[aria-current="page"]{color:var(--ink);background:var(--surface-sunken)}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:var(--space-sm);min-width:240px;padding:6px 8px 6px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--paper);color:var(--muted);cursor:pointer;font-size:14px;font-weight:600}
.search-btn:hover{border-color:var(--ink)}
.search-btn kbd,.kbd{margin-left:auto;font:600 12px var(--font-mono);padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper-raised);color:var(--muted)}
.bar .ext{display:flex;gap:var(--space-md);font-size:14px;font-weight:700}
.bar .ext a{color:var(--muted);text-decoration:none}
.bar .ext a:hover{color:var(--ink)}
.menu-btn{display:none;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--paper-raised);cursor:pointer;font-weight:700;font-size:14px}

/* ---- the shell: rail, content ---- */
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:calc(100vh - var(--bar-h))}
.rail{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar-h));overflow-y:auto;border-right:1px solid var(--line);
  padding:var(--space-xl) var(--space-md) var(--space-3xl) max(16px,env(safe-area-inset-left,0px));scrollbar-width:thin}
.rail h4{margin:var(--space-xl) var(--space-sm) var(--space-xs);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rail h4:first-child{margin-top:0}
.rail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.rail a{display:flex;align-items:center;gap:var(--space-sm);padding:5px var(--space-sm);border-radius:var(--radius-sm);text-decoration:none;font-size:14.5px;font-weight:600;color:var(--muted);line-height:1.35}
.rail a:hover{background:var(--surface-sunken);color:var(--ink)}
.rail a[aria-current="true"]{background:var(--tint-hover);color:var(--ink);font-weight:800;box-shadow:inset 0 0 0 1px var(--line)}
.rail .sub a{padding-left:var(--space-lg);font-size:13.5px}
.rail .grp>button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:5px var(--space-sm);border:0;background:none;border-radius:var(--radius-sm);font-size:14.5px;font-weight:700;cursor:pointer;text-align:left}
.rail .grp>button:hover{background:var(--surface-sunken)}
.rail .grp>button svg{transition:transform .15s;color:var(--muted)}
.rail .grp[data-open="false"]>button svg{transform:rotate(-90deg)}
.rail .grp[data-open="false"]>ul{display:none}
.rail .ext-link::after{content:"↗";margin-left:auto;font-size:12px;color:var(--muted)}
.scrim{display:none}

/* ---- docs ---- */
.docs{display:grid;grid-template-columns:minmax(0,1fr) var(--toc-w);gap:var(--space-3xl);padding:var(--space-2xl) max(16px,env(safe-area-inset-right,0px)) 96px var(--space-3xl);max-width:1180px}
.crumbs{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:var(--space-sm);display:flex;gap:6px}
.crumbs span+span::before{content:"/";margin-right:6px;color:var(--line-strong)}
.prose{max-width:72ch;min-width:0}
.prose h1{font-size:clamp(28px,4vw,38px);margin-bottom:var(--space-md)}
.prose h2{font-size:1.4rem;margin:var(--space-3xl) 0 var(--space-sm);padding-top:var(--space-lg);border-top:1px solid var(--line)}
.prose h3{font-size:1.05rem;margin:var(--space-xl) 0 var(--space-xs)}
.prose p,.prose pre,.prose .tbl,.prose blockquote,.prose ul,.prose ol{margin:var(--space-lg) 0}
.prose ol,.prose ul{padding-left:1.4em}
.prose li{margin:var(--space-xs) 0}
.prose pre{padding:var(--space-md) var(--space-lg);background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius-md)}
.prose blockquote{padding:var(--space-md) var(--space-lg);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-sunken)}
.prose blockquote p{margin:0}
.prose table{width:100%;border-collapse:collapse;font-size:14px}
.prose th,.prose td{text-align:left;vertical-align:top;padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--line)}
.prose thead th{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prose .tbl,.prose table{display:block;overflow-x:auto;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-md)}
.prose pre.diff{padding:0;white-space:pre}
.prose pre.diff span{display:block;padding:0 var(--space-lg)}
.prose pre.diff .file{color:var(--muted);border-bottom:1px solid var(--line)}
.prose pre.diff .add{background:var(--tint-success)}
.prose pre.diff .ctx{color:var(--muted)}
.lead{font-size:18px;color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);margin-top:var(--space-3xl)}
.pager a{display:flex;flex-direction:column;gap:2px;padding:var(--space-md) var(--space-lg);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper-raised);text-decoration:none;font-weight:800}
.pager a:hover{border-color:var(--line-strong);color:var(--ink)}
.pager small{font-size:12px;font-weight:700;color:var(--muted)}
.pager .next{text-align:right;grid-column:2}
.toc{position:sticky;top:calc(var(--bar-h) + var(--space-2xl));align-self:start;font-size:13.5px}
.toc h4{margin:0 0 var(--space-sm);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.toc a{display:block;padding:3px 0 3px var(--space-md);margin-left:-1px;text-decoration:none;color:var(--muted);font-weight:600;border-left:1px solid transparent}
.toc a:hover{color:var(--ink)}
.toc a[aria-current="true"]{color:var(--ink);font-weight:800;border-left-color:var(--ink)}
.toc .edit{display:block;margin-top:var(--space-xl);color:var(--muted);font-weight:700;font-size:13px}

/* ---- API ---- */
.api{min-width:0}
.sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3xl);padding:var(--space-3xl) max(16px,env(safe-area-inset-right,0px)) var(--space-3xl) var(--space-3xl);border-bottom:1px solid var(--line);max-width:1500px}
.sec>.side{position:sticky;top:calc(var(--bar-h) + var(--space-xl));align-self:start;display:flex;flex-direction:column;gap:var(--space-lg);min-width:0}
.sec .prose{max-width:62ch}
.sec.res-head{padding-bottom:var(--space-xl);border-bottom:0;background:var(--surface-sunken)}
.res-head h2{font-size:clamp(24px,3vw,30px);display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-md)}
.res-head h2 code{font-size:15px;font-weight:600}
.res-head .prose{margin-top:var(--space-md)}
.res-head .prose p:first-child{font-size:17px}
.ops-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper-raised);overflow:hidden;font-size:14px}
.ops-list a{display:flex;gap:var(--space-md);align-items:center;padding:var(--space-sm) var(--space-md);text-decoration:none;border-top:1px solid var(--line)}
.ops-list a:first-child{border-top:0}
.ops-list a:hover{background:var(--tint-hover);color:var(--ink)}
.ops-list .p{font-family:var(--font-mono);font-size:13px;overflow-wrap:anywhere}
.op h3{font-size:22px}
.endpoint{display:flex;align-items:center;gap:var(--space-sm);margin:var(--space-md) 0 var(--space-lg);padding:6px 6px 6px var(--space-sm);background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-md);max-width:100%}
.endpoint .p{font-family:var(--font-mono);font-size:14px;overflow-wrap:anywhere;flex:1;min-width:0}
.endpoint .p b{color:var(--accent-text);font-weight:600}
.m{flex:none;display:inline-block;min-width:3.4em;text-align:center;font:800 10.5px/1 var(--font-mono);letter-spacing:.04em;padding:4px 5px;border-radius:4px;border:1px solid var(--line-strong);background:var(--tint-neutral);color:var(--ink)}
.m.POST{background:var(--tint-highlight);border-color:var(--accent-text)}
.m.DELETE{background:var(--tint-error);border-color:var(--error)}
.rail .m{min-width:3.1em;font-size:9.5px;padding:3px 4px}
.keys{display:flex;flex-wrap:wrap;gap:var(--space-xs);align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.key{display:inline-flex;gap:5px;align-items:center;padding:2px 9px;border:1px solid var(--line);border-radius:999px;background:var(--paper-raised);color:var(--ink);font-size:12.5px}
.key code{border:0;background:none;padding:0;font-weight:700}
.block-title{margin:var(--space-2xl) 0 var(--space-sm);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fields{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.fields li{padding:var(--space-md) 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fields .fh{display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:baseline}
.fields .fn{font:700 14px var(--font-mono)}
.fields .ft{font-size:13px;color:var(--muted);font-weight:600}
.fields .req{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--warning)}
.fields .fd{font-size:14.5px;color:var(--muted)}
.fields .fd p{margin:0}
.prose .fields,.prose .resp{padding:0;margin:0}.prose .fields li,.prose .resp li{margin:0}
.prose td code{white-space:nowrap}
.resp{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--paper-raised)}
.resp li{border-top:1px solid var(--line)}
.resp li:first-child{border-top:0}
.resp button{display:grid;grid-template-columns:auto 1fr;gap:var(--space-md);width:100%;padding:var(--space-sm) var(--space-md);border:0;background:none;text-align:left;cursor:pointer;font-size:14px}
.resp button:hover,.resp button[aria-pressed="true"]{background:var(--tint-hover)}
.resp .slugs{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}
.resp .slugs code{font-size:11.5px}
.st{font:800 12px/1 var(--font-mono);padding:4px 7px;border-radius:4px;border:1px solid var(--line-strong);background:var(--tint-neutral);align-self:start}
.st.ok{background:var(--tint-success);border-color:var(--success)}
.st.c4{background:var(--tint-warning);border-color:var(--warning)}
.st.c5{background:var(--tint-error);border-color:var(--error)}

/* the panels beside an operation */
.panel{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper-raised);overflow:hidden;min-width:0}
.panel-h{display:flex;align-items:center;gap:var(--space-sm);padding:6px 6px 6px var(--space-md);border-bottom:1px solid var(--line);background:var(--surface-sunken);min-height:42px;flex-wrap:wrap}
.panel-h .t{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-raised);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;padding:3px 9px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--tint-highlight);color:var(--ink)}
.icon-btn{border:1px solid var(--line-strong);background:var(--paper-raised);border-radius:var(--radius-sm);padding:3px 9px;font-size:12.5px;font-weight:700;cursor:pointer}
.icon-btn:hover{border-color:var(--ink);background:var(--surface-sunken)}
.panel pre{padding:var(--space-md);max-height:440px;overflow:auto}
.panel .note{padding:var(--space-sm) var(--space-md);font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.panel .variants{padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--line);display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700}
.j-k{color:var(--accent-text)}.j-s{color:var(--success)}.j-n{color:var(--blue)}.j-b{color:var(--warning)}.j-c{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-md);border:1px solid var(--line-strong);background:var(--paper-raised);font-weight:800;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink);background:var(--surface-sunken);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* the console */
.console{padding:var(--space-md);display:flex;flex-direction:column;gap:var(--space-md)}
.console label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:800;color:var(--muted)}
.console label .hint{font-weight:600}
.console input,.console textarea,.conn input{font:13px var(--font-mono);padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper-raised);color:var(--ink);width:100%;min-width:0}
.console textarea{min-height:150px;resize:vertical;line-height:1.5}
.console .row{display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap}
.console .warn{font-size:13px;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-sm);background:var(--tint-warning);border:1px solid color-mix(in srgb,var(--warning) 45%,var(--line))}
.live-meta{display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper-raised);font-size:12px;font-weight:800;color:var(--ink)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}
.pill.rec{background:var(--tint-neutral)}

/* the connection box in the API rail */
.conn{margin:0 0 var(--space-lg);padding:var(--space-md);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper-raised);display:flex;flex-direction:column;gap:var(--space-sm)}
.conn .h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.conn label{font-size:12px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.conn .keyrow{display:flex;gap:4px}
.conn small{font-size:11.5px;color:var(--muted);line-height:1.4}
.conn .state{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.dot.ok{background:var(--success)}.dot.bad{background:var(--error)}

/* problems table */
.ptable{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
.ptable td,.ptable th{padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ptable th{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---- search ---- */
.palette{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.palette .box{width:min(640px,100%);background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 18px 48px var(--popup-shadow);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.palette input{border:0;border-bottom:1px solid var(--line);padding:var(--space-lg);font:600 17px var(--font-ui);background:none;color:var(--ink);outline:none}
.palette ul{list-style:none;margin:0;padding:var(--space-sm);overflow:auto}
.palette li a{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-md);border-radius:var(--radius-sm);text-decoration:none;font-size:14.5px;font-weight:600}
.palette li a[aria-selected="true"]{background:var(--tint-highlight)}
.palette .kind{margin-left:auto;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:none}
.palette .empty{padding:var(--space-xl);text-align:center;color:var(--muted)}
.palette .foot{display:flex;gap:var(--space-lg);padding:var(--space-sm) var(--space-lg);border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600}

.mockbar{display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center;padding:var(--space-sm) max(16px,env(safe-area-inset-right,0px)) var(--space-sm) max(16px,env(safe-area-inset-left,0px));background:var(--tint-highlight);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.mockbar b{font-weight:800}

/* ---- narrower screens ---- */
@media (max-width:1240px){
  .docs{grid-template-columns:minmax(0,1fr);padding-left:var(--space-2xl)}
  .toc{display:none}
  .sec{grid-template-columns:minmax(0,1fr);gap:var(--space-xl);padding-left:var(--space-2xl)}
  .sec>.side{position:static}
}
@media (max-width:1000px){.bar nav,.bar .ext{display:none}.search-btn{min-width:0}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .rail{position:fixed;z-index:40;left:0;top:0;bottom:0;height:auto;width:min(320px,86vw);background:var(--paper);transform:translateX(-100%);transition:transform .2s;padding-top:calc(var(--space-xl) + env(safe-area-inset-top,0px))}
  body[data-menu="open"] .rail{transform:none}
  body[data-menu="open"] .scrim{display:block;position:fixed;inset:0;z-index:35;background:var(--scrim)}
  .docs,.sec{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search-btn span{display:none}
  .search-btn kbd{display:none}
  .brand .sub{display:none}
}
