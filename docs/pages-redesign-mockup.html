function renderSide(o) {
  const side = main.querySelector(`[data-side="${o.id}"]`);
  if (side) side.innerHTML = sideHtml(o);
}

async function send(o, form) {
  const st = state[o.id];
  $$("[data-param]", form).forEach(i => st.params[i.dataset.param] = i.value.trim());
  $$("[data-query]", form).forEach(i => st.query[i.dataset.query] = i.value.trim());
  const ta = $("[data-body]", form);
  if (ta) {
    st.bodyText = ta.value;
    try { st.bodyObj = JSON.parse(ta.value); } catch (e) { ta.setCustomValidity("This isn't valid JSON: " + e.message); ta.reportValidity(); ta.addEventListener("input", () => ta.setCustomValidity(""), { once: true }); return; }
  }
  const qs = new URLSearchParams(Object.entries(st.query).filter(([, v]) => v)).toString();
  const url = conn.base.replace(/\/$/, "") + fillPath(o, st.params) + (qs ? "?" + qs : "");
  const sse = o.responses.some(r => r.contentType === "text/event-stream");
  const headers = { Accept: sse ? "text/event-stream" : "application/prs.hal-forms+json, application/problem+json" };
  if (conn.key) headers.Authorization = "Bearer " + conn.key;
  if (ta) headers["Content-Type"] = "application/json";
  st.abort?.abort();
  const ctl = st.abort = new AbortController();
  st.live = { pending: true, stream: sse, text: "" };
  renderSide(o);
  const t0 = performance.now();
  try {
    const res = await fetch(url, { method: o.method, headers, body: ta ? ta.value : undefined, signal: ctl.signal, credentials: "omit" });
    const base = { status: res.status, headers: [...res.headers], ms: Math.round(performance.now() - t0) };
    if (sse && res.ok && res.body) {
      const reader = res.body.getReader(), dec = new TextDecoder();
      st.live = { ...base, pending: true, stream: true, text: "" };
      renderSide(o);
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        st.live.text += dec.decode(value, { stream: true });
        const pre = main.querySelector(`[data-side="${o.id}"] .panel:last-child pre code`);
        if (pre) pre.innerHTML = json(st.live.text);
      }
      st.live = { ...base, text: st.live.text };
    } else {
      const text = await res.text();
      let parsed = null; try { parsed = JSON.parse(text); } catch {}
      st.live = { ...base, text, parsed, problem: parsed?.type?.startsWith("http") ? parsed.type : null };
    }
  } catch (e) {
    if (e.name === "AbortError") { st.live = { ...(st.live || {}), pending: false, status: st.live?.status ?? "—", headers: st.live?.headers ?? [], ms: Math.round(performance.now() - t0) }; }
    else st.live = { error: e.message };
  }
  renderSide(o);
}

          <div class="crumbs"><span>Errors</span></div>
          <h2 style="font-size:28px;border:0;margin-top:0;padding:0">Problems</h2>
          <p>Every error is <code>application/problem+json</code>. Its <code>type</code> is the problem's page; <code>detail</code> says what went wrong this time.</p>
          <div style="overflow-x:auto"><table class="ptable"><thead><tr><th>Status</th><th>Type</th><th>Title</th></tr></thead><tbody>
          ${MK.problems.map(p => `<tr><td><span class="st ${stClass(String(p.status))}">${p.status}</span></td><td><a href="https://docs.monokulo.com/problems/${esc(p.slug)}/"><code>${esc(p.slug)}</code></a></td><td>${esc(p.title)}</td></tr>`).join("")}
          </tbody></table></div>
        </div>
      </section>
    </div>`;
    allOps.forEach(renderSide);
    wireApi();
  }
  railCurrent(anchor || "api");
  const el = document.getElementById(anchor || "api");
  if (el && anchor) el.scrollIntoView(); else window.scrollTo(0, 0);
}

function railCurrent(id) {
  $$(".rail a[aria-current]").forEach(a => a.removeAttribute("aria-current"));
  const cur = $(`.rail a[href="#${CSS.escape(id)}"]`);
  if (!cur) return;
  cur.setAttribute("aria-current", "true");
  const r = cur.getBoundingClientRect(), rr = rail.getBoundingClientRect();
  if (r.top < rr.top || r.bottom > rr.bottom) cur.scrollIntoView({ block: "nearest" });
}

function wireApi() {
  const base = $("#conn-base"), key = $("#conn-key");
  const refresh = () => allOps.forEach(o => { if (!state[o.id].trying && !state[o.id].live) renderSide(o); });
  base.addEventListener("change", () => { conn.base = base.value.trim() || MK.server; store.set("base", conn.base); refresh(); });
  key.addEventListener("change", () => { conn.key = key.value.trim(); store.set("key", conn.key); refresh(); });
  $("#conn-show").addEventListener("click", e => { const on = key.type === "password"; key.type = on ? "text" : "password"; e.target.setAttribute("aria-pressed", on); e.target.textContent = on ? "Hide" : "Show"; });
  $("#conn-check").addEventListener("click", async () => {
    const s = $("#conn-state");
    s.innerHTML = '<span class="dot"></span><span>checking…</span>';
    try {
      const res = await fetch(conn.base.replace(/\/$/, "") + "/api/v1", { headers: conn.key ? { Authorization: "Bearer " + conn.key, Accept: "application/prs.hal-forms+json" } : {}, credentials: "omit" });
      const body = await res.json().catch(() => null);
      const forms = body?._templates ? Object.keys(body._templates).length : 0;
      s.innerHTML = res.ok ? `<span class="dot ok"></span><span>found, ${forms} form${forms === 1 ? "" : "s"}</span>` : `<span class="dot bad"></span><span>${res.status} ${esc(body?.title || "")}</span>`;
    } catch { s.innerHTML = '<span class="dot bad"></span><span>can\'t reach it</span>'; }
  });
  rail.addEventListener("click", e => {
    const b = e.target.closest(".grp>button");
    if (b) { const g = b.parentElement, open = g.dataset.open !== "true"; g.dataset.open = open; b.setAttribute("aria-expanded", open); }
  });
  const ids = ["api", ...MK.apiIntro.toc.map(t => t.id), ...allOps.map(o => o.id), "problems"];
  spy(null, ids.map(id => document.getElementById(id)).filter(Boolean), id => railCurrent(id));
}

main.addEventListener("click", async e => {
  const t = e.target;
  const sec = t.closest("[data-op]");
  const o = sec && allOps.find(x => x.id === sec.dataset.op);
  const st = o && state[o.id];
  const copy = async (text, btn) => { try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1200); } catch { btn.textContent = "Select and copy"; } };
  if (t.closest("[data-copy]")) return copy(conn.base.replace(/\/$/, "") + t.closest("[data-copy]").dataset.copy, t);
  if (t.closest("[data-jump]")) { const id = t.dataset.jump; location.hash = id; state[id].trying = true; renderSide(allOps.find(x => x.id === id)); return; }
  if (!o) return;
  if (t.closest("[data-copy-snippet]")) return copy(snippet(o, st.lang, st), t);
  if (t.closest("[data-lang]")) { st.lang = t.dataset.lang; renderSide(o); }
  else if (t.closest("[data-variant]")) { st.variant = t.dataset.variant; renderSide(o); }
  else if (t.closest("[data-resp]")) { st.resp = +t.closest("[data-resp]").dataset.resp; st.variant = null; st.live = null; $$("[data-resp]", sec).forEach(b => b.setAttribute("aria-pressed", b.dataset.resp == st.resp)); renderSide(o); }
  else if (t.closest("[data-try]")) { st.trying = true; renderSide(o); main.querySelector(`[data-side="${o.id}"] input, [data-side="${o.id}"] textarea, [data-side="${o.id}"] [type=submit]`)?.focus(); }
  else if (t.closest("[data-cancel]")) { st.trying = false; st.abort?.abort(); renderSide(o); }
  else if (t.closest("[data-clear]")) { st.live = null; renderSide(o); }
  else if (t.closest("[data-stop]")) { st.abort?.abort(); }
});
main.addEventListener("submit", e => {
  const form = e.target.closest("[data-form]"); if (!form) return;
  e.preventDefault();
  const o = allOps.find(x => x.id === form.closest("[data-op]").dataset.op);
  send(o, form);
});

/* ---------- scroll spy ---------- */
let observer;
function spy(links, targets, onCurrent) {
  observer?.disconnect();
  const visible = new Map();
  observer = new IntersectionObserver(entries => {
    entries.forEach(en => en.isIntersecting ? visible.set(en.target.id, en.boundingClientRect.top) : visible.delete(en.target.id));
    const order = targets.map(t => t.id);
    const id = order.find(i => visible.has(i));
    if (!id) return;
    if (onCurrent) onCurrent(id);
    else links?.forEach(a => a.getAttribute("href") === "#" + id ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"));
  }, { rootMargin: `-${70}px 0px -60% 0px` });
  targets.forEach(t => t && observer.observe(t));
}

/* ---------- routing ---------- */
function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || "guide";
  if (MK.docs.some(d => d.id === id)) return showDoc(id);
  const here = main.querySelector(`[id="${CSS.escape(id)}"]`);
  if (here && view === "docs") return here.scrollIntoView();
  if (id === "api" || id === "problems" || id.startsWith("res-") || allOps.some(o => o.id === id) || MK.apiIntro.toc.some(t => t.id === id)) return showApi(id === "api" ? null : id);
  if (here) return here.scrollIntoView();
  showDoc("guide");
}
window.addEventListener("hashchange", route);

/* ---------- menu ---------- */
$("#menu-btn").addEventListener("click", () => { const open = document.body.dataset.menu !== "open"; document.body.dataset.menu = open ? "open" : "closed"; $("#menu-btn").setAttribute("aria-expanded", open); });
$("#scrim").addEventListener("click", () => { document.body.dataset.menu = "closed"; });
rail.addEventListener("click", e => { if (e.target.closest("a")) document.body.dataset.menu = "closed"; });

/* ---------- search ---------- */
const index = [
  ...MK.docs.map(d => ({ href: "#" + d.id, text: d.label, sub: d.title, kind: "Guide" })),
  ...MK.docs.flatMap(d => d.toc.map(t => ({ href: "#" + d.id, anchor: t.id, text: t.text, sub: d.label, kind: "Section" }))),
  { href: "#api", text: "HTTP API", sub: "Introduction", kind: "API" },
  ...MK.apiIntro.toc.map(t => ({ href: "#" + t.id, text: t.text, sub: "HTTP API", kind: "API" })),
  ...allOps.map(o => ({ href: "#" + o.id, text: o.summary.replace(/\.$/, ""), sub: `${o.method} ${o.path}`, kind: "Endpoint", m: o.method })),
  ...MK.problems.map(p => ({ href: "#problems", text: p.slug, sub: `${p.status} · ${p.title}`, kind: "Problem" })),
];
const pal = $("#palette"), q = $("#q"), results = $("#results");
let sel = 0, hits = [];
function openSearch() { pal.hidden = false; q.value = ""; draw(); q.focus(); }
function closeSearch() { pal.hidden = true; $("#search-btn").focus(); }
function draw() {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  hits = index.filter(i => words.every(w => (i.text + " " + i.sub + " " + i.kind).toLowerCase().includes(w))).slice(0, 12);
  sel = Math.min(sel, Math.max(hits.length - 1, 0));
  results.innerHTML = hits.length ? hits.map((h, i) => `<li><a href="${h.href}" data-i="${i}" role="option" aria-selected="${i === sel}">${h.m ? `<span class="m ${h.m}">${h.m}</span>` : ""}<span><b>${esc(h.text)}</b><br><span style="color:var(--muted);font-size:13px">${esc(h.sub)}</span></span><span class="kind">${h.kind}</span></a></li>`).join("") : `<li class="empty">Nothing matches "${esc(q.value)}".</li>`;
}
function go(h) { closeSearch(); if (location.hash === h.href) route(); else location.hash = h.href.slice(1); if (h.anchor) setTimeout(() => document.getElementById(h.anchor)?.scrollIntoView(), 30); }
$("#search-btn").addEventListener("click", openSearch);
q.addEventListener("input", () => { sel = 0; draw(); });
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, hits.length - 1); draw(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[sel]) { e.preventDefault(); go(hits[sel]); }
});
results.addEventListener("click", e => { const a = e.target.closest("a[data-i]"); if (a) { e.preventDefault(); go(hits[+a.dataset.i]); } });
pal.addEventListener("click", e => { if (e.target === pal) closeSearch(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !pal.hidden) closeSearch();
  else if ((e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) && pal.hidden && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
});

route();
})();
</script>
</body>
