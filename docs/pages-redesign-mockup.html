<script>window.MK = {"server":"https://www.monokulo.com","docs":[{"id":"guide","label":"Key steps","group":"Start here","title":"Add Monokulo to your site","html":"<p>Your page asks Monokulo for an order, the customer pays in the checkout\nMonokulo shows, and your server hears that it's paid before it ships\nanything.<\/p>\n<h2 id=\"key-steps\">Key steps<\/h2>\n<ol>\n<li><strong>Make a store<\/strong> in Monokulo: <em>Add a store<\/em>. Give it a name and your\nwebsite's address (any page on the site works). Note its\npublic key (<code>pk_…<\/code>) on the store's page.<\/li>\n<li><strong>Add the script tag<\/strong> to your checkout page, from your Monokulo's own\naddress:\n<code>&lt;script src=\"https://pay.example/static/monokulo-client.js\"&gt;&lt;/script&gt;<\/code>.<\/li>\n<li><strong>Create an order<\/strong> when the customer checks out:\n<code>Monokulo.createOrder({ publicKey, amount, currency, merchantOrderId, description })<\/code>.\n<code>description<\/code> is optional: what the order is for, shown to the customer\non the checkout. A server can make the order itself instead, with the\nstore's secret key.<\/li>\n<li><strong>Show the checkout<\/strong>: <code>Monokulo.mount(\"#pay\", order, { onPaid })<\/code> puts\nMonokulo's payment page in yours.<\/li>\n<li><strong>Handle the paid webhook<\/strong> on your server: <code>order.paid<\/code>, signed, with\nyour own order id in <code>merchant_order_id<\/code>. Ship on this, never on the\nbrowser's word. See <a href=\"#webhooks\">Webhooks<\/a> and\n<a href=\"#paid\">When is an order really paid?<\/a><\/li>\n<li><strong>Verify your domain<\/strong> with a DNS record, in the store's settings, so\nonly your site can show the checkout. Subdomains (<code>pay.shop.example<\/code>)\nare covered too.<\/li>\n<li><strong>Test on stagenet<\/strong> with free test coins and a stagenet wallet.<\/li>\n<li><strong>Go live<\/strong>: change the store to your mainnet wallet and make one small\nreal payment.<\/li>\n<\/ol>\n<p><code>pay.example<\/code> stands for your Monokulo's public address throughout; <code>pk_…<\/code>\nfor your store's public key.<\/p>\n<h2 id=\"read-next\">Read next<\/h2>\n<ul>\n<li><a href=\"#walkthrough-geomart\">Walkthrough: Geomart<\/a>: the steps above, one at a\ntime, on a small shop that sells shapes.<\/li>\n<li><a href=\"#js-library\">JS library<\/a>: everything <code>monokulo-client.js<\/code> does.<\/li>\n<li><a href=\"#paid\">When is an order really paid?<\/a><\/li>\n<li><a href=\"#webhooks\">Webhooks<\/a>: every field, the signature, retries.<\/li>\n<li><a href=\"#api\">HTTP API<\/a>: <code>/api/v1<\/code>, for a server, a shop plugin or an app.<\/li>\n<\/ul>","toc":[{"id":"key-steps","text":"Key steps"},{"id":"read-next","text":"Read next"}]},{"id":"walkthrough-geomart","label":"Walkthrough: Geomart","group":"Start here","title":"Walkthrough: take Monero at Geomart","html":"<p>Geomart is a pretend shop that sells shapes: triangles, squares, circles,\nhexagons. It's one HTML file with a catalogue, a cart and a checkout page,\nand a fake API in the same file standing in for a shop's server. It has no\nway to pay. In six steps it will.<\/p>\n<p><strong>Source:<\/strong> <a href=\"https://github.com/OceanEilonwy/monokulo/blob/main/examples/geomart/index.html\"><code>examples/geomart/index.html<\/code><\/a>\nin the repo, and the finished shop beside it,\n<a href=\"https://github.com/OceanEilonwy/monokulo/blob/main/examples/geomart/done.html\"><code>examples/geomart/done.html<\/code><\/a>.\n<strong>Try it:<\/strong> <a href=\"https://docs.monokulo.com/geomart/\">before<\/a> and <a href=\"https://docs.monokulo.com/geomart/done.html\">after<\/a>, or open the\nfiles straight from disk.<\/p>\n<h3 id=\"step-1\">Step 1 · Make a store for Geomart<\/h3>\n<p>In Monokulo: <em>Add a store<\/em>. Name it <strong>Geomart<\/strong>, with the website\n<code>geomart.example<\/code>, and take payments into a <strong>stagenet<\/strong> wallet for\nnow (under <em>More options<\/em> when you add the wallet). Copy the public key from\nthe store's page.<\/p>\n<h3 id=\"step-2\">Step 2 · Add the library<\/h3><pre class=\"diff\"><span class=\"file\">examples/geomart/index.html<\/span><span class=\"ctx\">   &lt;/main&gt;<\/span><span class=\"add\">+  &lt;script src=&quot;https://pay.example/static/monokulo-client.js&quot;&gt;&lt;/script&gt;<\/span><span class=\"ctx\">   &lt;script&gt;<\/span><\/pre>\n<p>Load it with a plain <code>&lt;script src&gt;<\/code>, not a module or a bundle: it finds\nMonokulo's address from its own URL.<\/p>\n<h3 id=\"step-3\">Step 3 · Create an order at checkout<\/h3><pre class=\"diff\"><span class=\"file\">examples/geomart/index.html · checkout()<\/span><span class=\"ctx\">   async function checkout() {<\/span><span class=\"ctx\">     const receipt = await fakeApi.placeOrder(cart);   // Geomart's own order id<\/span><span class=\"add\">+    const order = await Monokulo.createOrder({<\/span><span class=\"add\">+      publicKey: &quot;pk_3f9a…c21e&quot;,<\/span><span class=\"add\">+      amount: receipt.total,          // &quot;13.50&quot;<\/span><span class=\"add\">+      currency: &quot;EUR&quot;,<\/span><span class=\"add\">+      merchantOrderId: receipt.id,    // &quot;gm-1042&quot;, for step 5<\/span><span class=\"add\">+      description: `Geomart order ${receipt.id}`,<\/span><span class=\"add\">+    });<\/span><\/pre>\n<p><code>merchantOrderId<\/code> is Geomart's own order id. The webhook in step 5 carries\nit back as <code>merchant_order_id<\/code>, so the shop finds its order without keeping\nMonokulo's. The shopper sees <strong>Geomart<\/strong>, then \"Geomart order gm-1042\" and\nthe reference at the top of the checkout, so they know what they're paying\nfor.<\/p>\n<h3 id=\"step-4\">Step 4 · Show the checkout<\/h3><pre class=\"diff\"><span class=\"file\">examples/geomart/index.html · checkout()<\/span><span class=\"ctx\">     showPage(&quot;checkout&quot;);<\/span><span class=\"add\">+    Monokulo.mount(&quot;#pay&quot;, order, {<\/span><span class=\"add\">+      theme: &quot;light&quot;,<\/span><span class=\"add\">+      onStatusChange: (status) =&gt; setBanner(status),<\/span><span class=\"add\">+      onPaid: () =&gt; showPage(&quot;thanks&quot;),          // a nicety only: see step 5<\/span><span class=\"add\">+      onExpired: () =&gt; showPage(&quot;cart&quot;),<\/span><span class=\"add\">+    });<\/span><\/pre><h3 id=\"step-5\">Step 5 · Mark it paid from the webhook<\/h3>\n<p>A browser callback can be faked, so the shop's server decides. In\nMonokulo, the store's settings, <em>Webhooks<\/em>: add\n<code>https://geomart.example/hooks/monokulo<\/code> and keep the signing secret.\nGeomart's fake API shows the handler a real server needs:<\/p>\n<pre class=\"diff\"><span class=\"file\">examples/geomart/index.html · fakeApi (stands in for your server)<\/span><span class=\"add\">+  // POST /hooks/monokulo   X-Monokulo-Signature: t=…,v1=…<\/span><span class=\"add\">+  // body: {&quot;api_version&quot;:2,&quot;event_id&quot;:&quot;evt_…&quot;,&quot;event&quot;:&quot;order.paid&quot;,<\/span><span class=\"add\">+  //        &quot;order_id&quot;:&quot;…&quot;,&quot;status&quot;:&quot;paid&quot;,&quot;merchant_order_id&quot;:&quot;gm-1042&quot;,<\/span><span class=\"add\">+  //        &quot;amount&quot;:&quot;13.50&quot;,&quot;currency&quot;:&quot;EUR&quot;,…}<\/span><span class=\"add\">+  async onMonokuloWebhook(headers, body) {<\/span><span class=\"add\">+    if (!(await signatureOk(headers[&quot;x-monokulo-signature&quot;], body, WEBHOOK_SECRET))) return 400;<\/span><span class=\"add\">+    const event = JSON.parse(body);<\/span><span class=\"add\">+    if (seen.has(event.event_id)) return 200;          // deliveries can repeat<\/span><span class=\"add\">+    seen.add(event.event_id);<\/span><span class=\"add\">+    if (event.event === &quot;order.paid&quot;) this.markPaid(event.merchant_order_id);<\/span><span class=\"add\">+    return 200;<\/span><span class=\"add\">+  },<\/span><\/pre>\n<p>The signature is HMAC-SHA256 of <code>\"&lt;t&gt;.&lt;body&gt;\"<\/code> with the signing secret;\naccept it only within five minutes of <code>t<\/code>. The handler finds Geomart's\norder by <code>merchant_order_id<\/code>, the id it passed in step 3. The body also\ncarries the price as Geomart set it (<code>amount<\/code>, <code>currency<\/code>), what the\ncustomer paid in XMR, the exchange rate and the store: every field is on\n<a href=\"#webhooks\">Webhooks<\/a>. If a delivery fails, Monokulo tries again for\nabout two hours; the store's settings, <em>Webhooks<\/em>, show each one.<\/p>\n<blockquote>\n<p><strong>No server? (Geomart is one HTML file.)<\/strong> A webhook needs somewhere to\narrive, and <code>onPaid<\/code> runs in the customer's browser, so it can be faked. A\nstatic shop shows \"Thanks\" from <code>onPaid<\/code> and confirms each order in the\nMonokulo dashboard (or wherever it already handles fulfilment) before\nsending anything. A shop with a backend points the webhook at it, as\nabove. See <a href=\"#paid\">When is an order really paid?<\/a><\/p>\n<\/blockquote>\n<h3 id=\"step-6\">Step 6 · Verify, test, go live<\/h3>\n<p>Verify <code>geomart.example<\/code> (a DNS TXT record, in the store's settings), buy a\ntriangle with stagenet coins, watch the webhook arrive, then change the\nstore's wallet to a mainnet one.<\/p>","toc":[]},{"id":"js-library","label":"JS library","group":"Take payments","title":"JS library","html":"<p><code>&lt;script src=\"https://www.monokulo.com/static/monokulo-client.js\"&gt;&lt;/script&gt;<\/code> adds\none global, <code>window.Monokulo<\/code>, with two functions. No build step, no\ndependencies. Monokulo's address is taken from the script's own URL, less\nits <code>/static/monokulo-client.js<\/code> (so a Monokulo served under a path keeps\nit), unless you pass it as <code>monokulo<\/code>.<\/p>\n<h2 id=\"monokulo-createorder-params-promise-order\">Monokulo.createOrder(params) → Promise&lt;Order&gt;<\/h2><div class=\"tbl\"><table><thead><tr><th>Param<\/th><th>Type<\/th><th>What it is<\/th><\/tr><\/thead><tbody>\n<tr><td><code>publicKey<\/code><\/td><td>string, required<\/td><td>The store's <code>pk_…<\/code>.<\/td><\/tr>\n<tr><td><code>amount<\/code><\/td><td>number or string, required<\/td><td>The price, in <code>currency<\/code>: up to 12 decimals, trailing zeros not counted (<code>\"12.50000000\"<\/code> is fine). A string keeps it exact.<\/td><\/tr>\n<tr><td><code>currency<\/code><\/td><td>string, required<\/td><td><code>\"XMR\"<\/code>, or a currency the store's exchange rate provider prices (<code>\"EUR\"<\/code>).<\/td><\/tr>\n<tr><td><code>merchantOrderId<\/code><\/td><td>string, optional<\/td><td>Your own order or cart id, kept with the order and shown on its page in the dashboard.<\/td><\/tr>\n<tr><td><code>description<\/code><\/td><td>string, optional<\/td><td>What the order is for, shown to the payer under your store's name. Up to 140 characters, plain text. Anyone with the payment link can read it.<\/td><\/tr>\n<tr><td><code>showMerchantOrderId<\/code><\/td><td>boolean, optional, default true<\/td><td>Set false to keep <code>merchantOrderId<\/code> off the checkout; it still shows in the dashboard and in webhooks.<\/td><\/tr>\n<tr><td><code>monokulo<\/code><\/td><td>string, optional<\/td><td>Monokulo's address (<code>https://pay.example.com<\/code>, or <code>https://example.com/monokulo<\/code> under a path), if it can't be read from the script tag. The library finds the API and the checkout under it.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p>Resolves to <code>{ orderId, address, xmrAmountPiconero, amount, currency, merchantOrderId, description, expiresAt, monokulo, publicKey, checkoutUrl, orderUrl }<\/code>, <code>monokulo<\/code> being the\naddress the order was made at. It posts to <a href=\"#api\">the API<\/a>'s <code>create-order<\/code> form with the public key\n(<code>Authorization: Bearer pk_…<\/code>). Rejects with an <code>Error<\/code>\ncarrying the problem's <code>detail<\/code>. If Monokulo asks a busy visitor for a proof of\nwork, the library solves it and tries again by itself.<\/p>\n<h2 id=\"monokulo-mount-target-orderorid-options-iframe-destroy\">Monokulo.mount(target, orderOrId, options?) → { iframe, destroy() }<\/h2>\n<p><code>target<\/code> is a selector or an element; its content is replaced by the\ncheckout's iframe. <code>orderOrId<\/code> is the object from <code>createOrder<\/code>, or an order\nid (then pass <code>monokulo<\/code>, and <code>publicKey<\/code> for the polling fallback, in\n<code>options<\/code>, say after a reload).\nMounting the same element again replaces the old checkout; <code>destroy()<\/code>\nremoves it and stops listening.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Option<\/th><th>Type<\/th><th>What it does<\/th><\/tr><\/thead><tbody>\n<tr><td><code>onStatusChange<\/code><\/td><td><code>(status, data) =&gt; void<\/code><\/td><td>Each new status, from the order's live updates (server-sent events, polling as a fallback).<\/td><\/tr>\n<tr><td><code>onPaid<\/code><\/td><td><code>(data) =&gt; void<\/code><\/td><td>The status became <code>paid<\/code> or <code>overpaid<\/code>. A hint for the page: trust the webhook.<\/td><\/tr>\n<tr><td><code>onExpired<\/code><\/td><td><code>(data) =&gt; void<\/code><\/td><td>The status became <code>expired<\/code>.<\/td><\/tr>\n<tr><td><code>theme<\/code><\/td><td><code>\"light\"<\/code> or <code>\"dark\"<\/code><\/td><td>Pins the checkout's theme; left out, it follows the customer's device.<\/td><\/tr>\n<tr><td><code>refund<\/code><\/td><td><code>false<\/code><\/td><td>Hides the refund-address form.<\/td><\/tr>\n<tr><td><code>width<\/code>, <code>height<\/code><\/td><td>CSS length<\/td><td>The iframe's size (420px × 900px unless set).<\/td><\/tr>\n<tr><td><code>monokulo<\/code>, <code>publicKey<\/code><\/td><td>string<\/td><td>Only when mounting a bare order id; <code>publicKey<\/code> lets it poll the order where server-sent events can't be used.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p>Status values: <code>pending<\/code>, <code>unconfirmed<\/code>, <code>confirming<\/code>, <code>partial<\/code>, <code>paid<\/code>,\n<code>overpaid<\/code>, <code>expired<\/code>, <code>cancelled<\/code> (the merchant cancelled it before anything\nwas paid; only the POS cancels, its own orders). Updates stop at <code>paid<\/code>,\n<code>overpaid<\/code>, <code>expired<\/code> or <code>cancelled<\/code>.<\/p>\n<h2 id=\"shops-on-tor\">Shops on Tor<\/h2>\n<p>On a page served from a <code>.onion<\/code> address, the library makes the order,\nframes the checkout and follows it on Monokulo's own onion address, so the\ncustomer never leaves Tor. It finds that address once, from the API's entry\n(<code>mk:onion-api<\/code>, see <a href=\"#tor\">Tor<\/a>); load the script from the onion\naddress instead\n(<code>&lt;script src=\"http://….onion/static/monokulo-client.js\"&gt;<\/code>) and it needn't\nlook. <code>monokulo<\/code> and <code>checkoutUrl<\/code> are then onion addresses. A Monokulo with\nno onion address has nowhere else to send them, so its web address is used.<\/p>\n<h2 id=\"when-is-an-order-really-paid\">When is an order really paid?<\/h2>\n<ul>\n<li><strong>In the page<\/strong> (<code>onPaid<\/code>, <code>onStatusChange<\/code>): for the customer's\nexperience only. It runs in their browser, so it can be faked.<\/li>\n<li><strong>On your server<\/strong>: the signed <code>order.paid<\/code> webhook. See\n<a href=\"#paid\">When is an order really paid?<\/a><\/li>\n<li><strong>No server<\/strong>: confirm the order in the Monokulo dashboard before you\nsend anything.<\/li>\n<\/ul>","toc":[{"id":"monokulo-createorder-params-promise-order","text":"Monokulo.createOrder(params) → Promise&lt;Order&gt;"},{"id":"monokulo-mount-target-orderorid-options-iframe-destroy","text":"Monokulo.mount(target, orderOrId, options?) → { iframe, destroy() }"},{"id":"shops-on-tor","text":"Shops on Tor"},{"id":"when-is-an-order-really-paid","text":"When is an order really paid?"}]},{"id":"paid","label":"When is it paid?","group":"Take payments","title":"When is an order really paid?","html":"<p>Three places hear about a payment. Only two of them can be trusted with\nshipping.<\/p>\n<h2 id=\"in-the-page-a-nicety\">In the page: a nicety<\/h2>\n<p><code>onPaid<\/code> and <code>onStatusChange<\/code> (<a href=\"#js-library\">JS library<\/a>) run in the\ncustomer's browser. Use them to say thanks or move to a \"Thanks\" page. Never\nship on them: anyone can call <code>onPaid<\/code> from their browser's console.<\/p>\n<h2 id=\"on-your-server-the-signed-webhook\">On your server: the signed webhook<\/h2>\n<p>In the store's settings, under <em>Webhooks<\/em>, add your server's address. Monokulo\nthen sends a signed <code>POST<\/code> for every change of an order's status\n(<code>order.confirming<\/code>, <code>order.paid<\/code>, <code>order.expired<\/code>, …) with a JSON body:<\/p>\n<pre><code class=\"language-json\">{\n  \"api_version\": 2,\n  \"event_id\": \"evt_4be2d07a85c113e9\",\n  \"event\": \"order.paid\",\n  \"created_at\": 1760020320,\n  \"order_id\": \"order_5f01c9a7d2e14b88a3e0f9c6d1e21b07\",\n  \"status\": \"paid\",\n  \"merchant_order_id\": \"gm-1042\",\n  \"amount\": \"12.50\",\n  \"currency\": \"EUR\",\n  \"xmr_amount\": \"0.081245310000\",\n  \"fx_source\": \"coingecko\",\n  \"fx_rate\": \"153.84615385\",\n  \"store\": { \"id\": \"917701c2-15c7-4bcb-bbc8-72d9ab28e785\", \"name\": \"Bakery\" }\n}\n<\/code><\/pre>\n<ul>\n<li><code>merchant_order_id<\/code> is your own order id, when you passed one to\n<code>createOrder<\/code> (<code>merchantOrderId<\/code>): find your order by it. <code>order_id<\/code> is\nMonokulo's.<\/li>\n<li>A double-spend later gets its own <code>order.double_spend_detected<\/code> event (and\n<code>order.double_spend_reversed<\/code> if it was wrong), each with the <code>txid<\/code>.<\/li>\n<li>Every field, and the retries, are on <a href=\"#webhooks\">Webhooks<\/a>.<\/li>\n<\/ul>\n<p>Before trusting a delivery:<\/p>\n<ol>\n<li><strong>Check <code>X-Monokulo-Signature<\/code><\/strong>: <code>t=&lt;unix seconds&gt;,v1=&lt;hex&gt;<\/code>, where the\nhex is HMAC-SHA256 of <code>\"&lt;t&gt;.&lt;body&gt;\"<\/code> keyed by the webhook's signing\nsecret. Compare in constant time, over the exact bytes received.<\/li>\n<li><strong>Refuse an old one<\/strong>: <code>t<\/code> more than five minutes from your clock.<\/li>\n<li><strong>Ignore an <code>event_id<\/code> you've seen<\/strong>: a delivery whose answer was lost is\nsent again, byte for byte.<\/li>\n<li><strong>Then ship<\/strong> on <code>order.paid<\/code> (or <code>order.overpaid<\/code>).<\/li>\n<\/ol>\n<p>Answer with any <code>2xx<\/code> once it's handled; anything else is retried with\ngrowing gaps for about two hours, then given up on. The store's settings,\nunder <em>Webhooks<\/em>, show each delivery and can send one again.<\/p>\n<h2 id=\"no-server-the-dashboard\">No server: the dashboard<\/h2>\n<p>A shop with no server of its own (a static page, like\n<a href=\"#walkthrough-geomart\">Geomart<\/a>) has nowhere for a webhook to arrive. It\nshows \"Thanks\" from <code>onPaid<\/code> and confirms each order in the Monokulo\ndashboard, on the store's page, before it sends anything.<\/p>","toc":[{"id":"in-the-page-a-nicety","text":"In the page: a nicety"},{"id":"on-your-server-the-signed-webhook","text":"On your server: the signed webhook"},{"id":"no-server-the-dashboard","text":"No server: the dashboard"}]},{"id":"webhooks","label":"Webhooks","group":"Take payments","title":"Webhooks","html":"<p>A webhook tells your server when one of the store's orders changes: it's\npaid, it's confirming, it expired, it was cancelled, a payment to it was\ndouble-spent. Ship on <code>order.paid<\/code> (see\n<a href=\"#paid\">When is an order really paid?<\/a>).<\/p>\n<h2 id=\"add-one\">Add one<\/h2>\n<p>In Monokulo, the store's settings, <em>Webhooks<\/em>: <em>Add a webhook<\/em> with your\nserver's address, and any headers of your own you want sent with every\ndelivery (an API key for your endpoint, say). Monokulo shows the webhook's\nsigning secret once, there and then: keep it on your server. Lost it?\nDelete the webhook and add a new one.<\/p>\n<p>A shop plugin adds its own webhook when it connects, and disconnecting\nit deletes it.<\/p>\n<p><strong>A new webhook gets only the events that happen from the moment it's\nadded.<\/strong> Nothing from before is sent to it: no earlier status changes, not\neven for orders still open.<\/p>\n<p>There is no switching a webhook off. To stop one, delete it; to start\nagain, add it again (with a new signing secret).<\/p>\n<h2 id=\"what-arrives\">What arrives<\/h2>\n<p>A <code>POST<\/code> with <code>Content-Type: application/json<\/code> and these headers:<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Header<\/th><th><\/th><\/tr><\/thead><tbody>\n<tr><td><code>X-Monokulo-Signature<\/code><\/td><td><code>t=&lt;unix seconds&gt;,v1=&lt;hex&gt;<\/code>: see <a href=\"#check-it\">Check it<\/a>.<\/td><\/tr>\n<tr><td><code>X-Monokulo-Event<\/code><\/td><td>The event, as in the body.<\/td><\/tr>\n<tr><td><code>X-Monokulo-Event-Id<\/code><\/td><td>The event's id, as in the body.<\/td><\/tr>\n<tr><td><code>traceparent<\/code><\/td><td>For tracing; ignore it if you don't trace.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p>plus the headers you added. The body:<\/p>\n<pre><code class=\"language-json\">{\n  \"api_version\": 2,\n  \"event_id\": \"evt_4be2d07a85c113e9\",\n  \"event\": \"order.paid\",\n  \"created_at\": 1760020320,\n  \"order_id\": \"order_5f01c9a7d2e14b88a3e0f9c6d1e21b07\",\n  \"status\": \"paid\",\n  \"merchant_order_id\": \"gm-1042\",\n  \"description\": \"Two sourdough loaves\",\n  \"amount\": \"12.50\",\n  \"currency\": \"EUR\",\n  \"xmr_amount\": \"0.081245310000\",\n  \"fx_source\": \"coingecko\",\n  \"fx_rate\": \"153.84615385\",\n  \"store\": { \"id\": \"917701c2-15c7-4bcb-bbc8-72d9ab28e785\", \"name\": \"Bakery\" },\n  \"_links\": {\n    \"curies\": [{ \"name\": \"mk\", \"href\": \"https://docs.monokulo.com/rels/{rel}\", \"templated\": true }],\n    \"mk:order\": { \"href\": \"https://www.monokulo.com/api/v1/orders/order_5f01c9a7d2e14b88a3e0f9c6d1e21b07\", \"title\": \"One order: what to pay, where, and how far the payment has got.\" },\n    \"mk:dashboard-order\": { \"href\": \"https://www.monokulo.com/stores/917701c2-15c7-4bcb-bbc8-72d9ab28e785/orders/order_5f01c9a7d2e14b88a3e0f9c6d1e21b07\", \"title\": \"The order's page on the merchant's dashboard: …\", \"type\": \"text/html\" },\n    \"mk:checkout\": { \"href\": \"https://www.monokulo.com/checkout/order_5f01c9a7d2e14b88a3e0f9c6d1e21b07\", \"title\": \"The page the payer pays on: …\", \"type\": \"text/html\" }\n  }\n}\n<\/code><\/pre>\n<div class=\"tbl\"><table><thead><tr><th>Field<\/th><th>What it is<\/th><\/tr><\/thead><tbody>\n<tr><td><code>api_version<\/code><\/td><td><code>2<\/code>.<\/td><\/tr>\n<tr><td><code>event_id<\/code><\/td><td>The event's id. The same on every retry of it: dedupe on this.<\/td><\/tr>\n<tr><td><code>event<\/code><\/td><td><code>order.&lt;status&gt;<\/code> when the order's status changes (<code>order.unconfirmed<\/code>, <code>order.confirming<\/code>, <code>order.paid<\/code>, <code>order.partial<\/code>, <code>order.overpaid<\/code>, <code>order.expired<\/code>, <code>order.cancelled<\/code>); <code>order.double_spend_detected<\/code> when a payment to it was double-spent; <code>order.double_spend_reversed<\/code> when that turned out to be wrong. (<code>webhook.test<\/code> is a <a href=\"#test-it\">test<\/a>, with a body of its own.)<\/td><\/tr>\n<tr><td><code>created_at<\/code><\/td><td>When the event happened, in Unix seconds.<\/td><\/tr>\n<tr><td><code>order_id<\/code><\/td><td>Monokulo's id for the order: <code>createOrder<\/code> gave it to your page as <code>orderId<\/code>.<\/td><\/tr>\n<tr><td><code>status<\/code><\/td><td>The order's new status. On <code>order.&lt;status&gt;<\/code> events only.<\/td><\/tr>\n<tr><td><code>txid<\/code><\/td><td>The transaction concerned. On the two double-spend events only.<\/td><\/tr>\n<tr><td><code>merchant_order_id<\/code><\/td><td>Your own order id, when you passed one (<code>merchantOrderId<\/code>). Sent even when the checkout doesn't show it (<code>showMerchantOrderId: false<\/code>).<\/td><\/tr>\n<tr><td><code>description<\/code><\/td><td>What the order is for, when you gave it one (<code>description<\/code>). Not the store's payment description.<\/td><\/tr>\n<tr><td><code>amount<\/code>, <code>currency<\/code><\/td><td>The price as you set it, fiat or XMR: the decimal string you sent, exactly (<code>12.50000000<\/code> stays <code>12.50000000<\/code>).<\/td><\/tr>\n<tr><td><code>xmr_amount<\/code><\/td><td>What the customer was asked to pay, in XMR with 12 decimals.<\/td><\/tr>\n<tr><td><code>fx_source<\/code>, <code>fx_rate<\/code><\/td><td>Who priced the order and the rate used: 1 XMR in <code>currency<\/code>, a decimal string with up to 8 decimals. Not there for orders priced in XMR.<\/td><\/tr>\n<tr><td><code>store<\/code><\/td><td>The store: <code>{ \"id\", \"name\" }<\/code>.<\/td><\/tr>\n<tr><td><code>_links<\/code><\/td><td>The order, as the API links it, on Monokulo's web address: <a href=\"https://docs.monokulo.com/rels/order/\"><code>mk:order<\/code><\/a> (the order in the API: read it with the store's secret key), <a href=\"https://docs.monokulo.com/rels/dashboard-order/\"><code>mk:dashboard-order<\/code><\/a> (its page for the merchant: link your admin's order view here) and <a href=\"https://docs.monokulo.com/rels/checkout/\"><code>mk:checkout<\/code><\/a> (the payer's page), plus <a href=\"https://docs.monokulo.com/rels/onion-checkout/\"><code>mk:onion-checkout<\/code><\/a> while Monokulo has an onion address. Absolute URLs, since a webhook has no request to resolve a path against; on every event, <code>order.cancelled<\/code> included. Take them from the latest webhook rather than keeping them from when the order was made.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p>A field with no value is left out, never sent as <code>null<\/code>, as in the\n<a href=\"#api\">API<\/a>'s bodies.<\/p>\n<p><code>order.cancelled<\/code> means the merchant cancelled the order before anything\nwas paid to it (today only the POS cancels, and only its own orders). It\ntakes no payment from then on, like an expired order. Money sent to it\nanyway is still recorded: a little leaves it cancelled, with what arrived in\nits <code>amount_received_piconero<\/code>; enough to pay it makes it paid, and\n<code>order.paid<\/code> follows, as for an expired order paid late.<\/p>\n<h2 id=\"check-it\">Check it<\/h2>\n<p>Before trusting a delivery:<\/p>\n<ol>\n<li><strong>Check <code>X-Monokulo-Signature<\/code><\/strong>: <code>t=&lt;unix seconds&gt;,v1=&lt;hex&gt;<\/code>, where the\nhex is HMAC-SHA256 of <code>\"&lt;t&gt;.&lt;body&gt;\"<\/code> keyed by the webhook's signing\nsecret. Compute it over the exact bytes received, before parsing them,\nand compare in constant time.<\/li>\n<li><strong>Refuse an old one<\/strong>: <code>t<\/code> more than five minutes from your clock.<\/li>\n<li><strong>Ignore an <code>event_id<\/code> you've seen<\/strong>: a delivery whose answer was lost is\nsent again, byte for byte, under a fresh signature.<\/li>\n<\/ol>\n<p><a href=\"#walkthrough-geomart\">Geomart's handler<\/a> shows all three in a few\nlines of JavaScript.<\/p>\n<h2 id=\"answer-it\">Answer it<\/h2>\n<p>Answer with any <code>2xx<\/code> once it's handled, within 5 seconds (the defaults\nare under <a href=\"#settings\">Settings<\/a>). Anything else, or no answer, is tried\nagain: up to 8 attempts, waiting 1, 2, 4, 8, 16, 32\nand 64 minutes between them, so the last is about 2 hours after the first.\nThen Monokulo gives up on it.<\/p>\n<p>Each order's events are sent one at a time, oldest first: the next waits\nuntil the one before is delivered or given up on.<\/p>\n<h2 id=\"test-it\">Test it<\/h2>\n<p><em>Send a test webhook<\/em>, on each webhook in the store's settings, sends it\na <code>webhook.test<\/code> delivery now and shows what your server answered: in\nplace, or back on the settings page without JavaScript. A shop plugin\nsends one with the API's <code>send-test-webhook<\/code> form (see\n<a href=\"#plugins\">Shop plugins<\/a>), which answers\nthe same. Up to 6 a minute for a store.<\/p>\n<p>It's a delivery like any other: the same headers, signed the same way,\nlisted among the webhook's deliveries (marked <em>test<\/em>) and tried again on\nthe same schedule if your server doesn't answer <code>2xx<\/code>. Only its body is\ndifferent. It names the store and the webhook, and has no order:<\/p>\n<pre><code class=\"language-json\">{\n  \"api_version\": 2,\n  \"event_id\": \"evt_9c41d2b7e05a3f18\",\n  \"event\": \"webhook.test\",\n  \"created_at\": 1760020392,\n  \"store\": { \"id\": \"917701c2-15c7-4bcb-bbc8-72d9ab28e785\", \"name\": \"Bakery\" },\n  \"webhook\": { \"id\": \"wh_3f0c2a9e5b7d41c6a8e2f1d0b9c7a6e5\" },\n  \"_links\": {\n    \"curies\": [{ \"name\": \"mk\", \"href\": \"https://docs.monokulo.com/rels/{rel}\", \"templated\": true }],\n    \"mk:store\": { \"href\": \"https://www.monokulo.com/api/v1/store\", \"title\": \"The store the key belongs to, and where its payments go.\" }\n  }\n}\n<\/code><\/pre>\n<div class=\"tbl\"><table><thead><tr><th>Field<\/th><th>What it is<\/th><\/tr><\/thead><tbody>\n<tr><td><code>api_version<\/code>, <code>event_id<\/code>, <code>created_at<\/code>, <code>store<\/code><\/td><td>As on every event.<\/td><\/tr>\n<tr><td><code>event<\/code><\/td><td><code>webhook.test<\/code>.<\/td><\/tr>\n<tr><td><code>webhook<\/code><\/td><td>The webhook it was sent to: <code>{ \"id\" }<\/code>.<\/td><\/tr>\n<tr><td><code>_links<\/code><\/td><td><a href=\"https://docs.monokulo.com/rels/store/\"><code>mk:store<\/code><\/a>: the store in the API, on Monokulo's web address.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p>Check it as you check any delivery (signature, age, <code>event_id<\/code>), then\nanswer <code>2xx<\/code> and change nothing: there's no <code>order_id<\/code>, no <code>status<\/code>,\nnothing to act on. A receiver that does nothing with events it doesn't\nknow already handles it, as long as it still answers <code>2xx<\/code>; one that\nanswers <code>4xx<\/code> to an unknown event shows as a failed test, and the test is\ntried again like any failed delivery.<\/p>\n<h2 id=\"see-how-it-s-doing\">See how it's doing<\/h2>\n<p>The store's settings, <em>Webhooks<\/em>, show each webhook with one line on how\nit's doing: delivering, retrying (and when it tries next), or gave up. Under\nit are its deliveries, newest first, 20 at a time, open by themselves when\none is retrying or gave up. <em>Older →<\/em> and <em>← Newer<\/em> page through them (in\nplace, or as the page <em>All deliveries for this webhook<\/em> without\nJavaScript).<\/p>\n<p>Deliveries don't stay forever: one that arrived is deleted after 30 days,\none that gave up after 90 (<code>webhooks.keep_delivered_days<\/code>,\n<code>webhooks.keep_given_up_days<\/code>). Deliveries still being tried are kept.<\/p>\n<ul>\n<li><em>Details<\/em> on a delivery shows its attempts, the request sent (the\nsignature header, never the secret; your own headers' values masked) and\nthe start of your server's last answer.<\/li>\n<li><em>Send again<\/em> (the circular arrow) on a delivery that gave up sends it again now; <em>Retry failed<\/em>\ndoes it for all of a webhook's.<\/li>\n<li><em>Send a test webhook<\/em> sends it a <code>webhook.test<\/code> now (<a href=\"#test-it\">Test it<\/a>).<\/li>\n<li><em>Delete<\/em> removes the webhook and its deliveries, once you confirm.<\/li>\n<\/ul>\n<h2 id=\"settings\">Settings<\/h2>\n<p>Whoever runs your Monokulo sets these on its admin settings page\n(<em>Payments<\/em>, <em>Webhooks<\/em>) or in its options file:<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Setting<\/th><th>Default<\/th><th><\/th><\/tr><\/thead><tbody>\n<tr><td><code>webhooks.max_attempts<\/code><\/td><td>8<\/td><td>Attempts per delivery before giving up.<\/td><\/tr>\n<tr><td><code>webhooks.delivery_timeout_ms<\/code><\/td><td>5000<\/td><td>How long your server has to answer each one.<\/td><\/tr>\n<tr><td><code>webhooks.keep_delivered_days<\/code><\/td><td>30<\/td><td>Days a delivery that arrived stays in the list.<\/td><\/tr>\n<tr><td><code>webhooks.keep_given_up_days<\/code><\/td><td>90<\/td><td>Days a delivery that gave up stays in the list, where it can still be sent again.<\/td><\/tr>\n<tr><td><code>webhooks.allow_private_urls<\/code><\/td><td>false<\/td><td>Webhooks are never sent to private or loopback addresses (<code>localhost<\/code>, <code>192.168.…<\/code>) unless this is on. Only for testing on your own network.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","toc":[{"id":"add-one","text":"Add one"},{"id":"what-arrives","text":"What arrives"},{"id":"check-it","text":"Check it"},{"id":"answer-it","text":"Answer it"},{"id":"test-it","text":"Test it"},{"id":"see-how-it-s-doing","text":"See how it's doing"},{"id":"settings","text":"Settings"}]},{"id":"plugins","label":"Shop plugins","group":"Connect","title":"Shop plugins","html":"<p>A shop plugin takes Monero in a shop platform's own checkout. You install\nit in the shop, not in Monokulo, and connect it with one button. Monokulo\nkeeps no list of plugins: any plugin that follows the steps on this page\nworks with any Monokulo.<\/p>\n<h2 id=\"plugins\">Plugins<\/h2><div class=\"tbl\"><table><thead><tr><th>Shop<\/th><th>Plugin<\/th><\/tr><\/thead><tbody>\n<tr><td>WooCommerce<\/td><td><a href=\"https://github.com/OceanEilonwy/monokulo-woocommerce\">monokulo-woocommerce<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p>Each plugin's own repository says how to install it and what it needs.<\/p>\n<h2 id=\"writing-a-plugin\">Writing a plugin<\/h2>\n<p>A plugin does five things. Everything else about its shop platform stays\nin the plugin.<\/p>\n<h3 id=\"1-connect\">1. Connect<\/h3>\n<p>Send the merchant's browser to:<\/p>\n<pre><code>GET {monokulo}/plugins/connect/{slug}?site_url=…&amp;return_url=…&amp;nonce=…&amp;name=…\n<\/code><\/pre>\n<ul>\n<li><code>slug<\/code> names your plugin: a lowercase letter, then 1 to 31 lowercase\nletters, digits or hyphens (<code>prestashop<\/code>, <code>open-cart<\/code>). Anything else is\nnot found.<\/li>\n<li><code>site_url<\/code> is the shop's address. Monokulo finds the merchant's store by\nits host, or sets one up for it. One host is one store.<\/li>\n<li><code>return_url<\/code> is where Monokulo sends the browser back. It must be on the\nsame host as <code>site_url<\/code>, over https (plain http only for <code>localhost<\/code> or a\n<code>.onion<\/code> address).<\/li>\n<li><code>nonce<\/code> is yours: keep it, and check it when the browser comes back.<\/li>\n<li><code>name<\/code> is optional: what Monokulo calls your plugin on its pages\n(\"Connect your PrestaShop shop\"), up to 40 characters. Without it,\nMonokulo shows the slug.<\/li>\n<\/ul>\n<p>The merchant signs in and confirms, and the browser comes back to\n<code>return_url<\/code> with <code>token<\/code> and <code>nonce<\/code> added. Check the nonce, then, from your\nserver, within 10 minutes:<\/p>\n<pre><code>POST {monokulo}/plugins/connect/{slug}/finish\nMonokulo-Client: {slug}/{your version}\nContent-Type: application/json\n\n{ \"token\": \"…\", \"webhook_url\": \"https://shop.example/your-receiver\", \"name\": \"PrestaShop\" }\n<\/code><\/pre>\n<p>It answers once per token:<\/p>\n<pre><code class=\"language-json\">{\n  \"public_key\": \"pk_…\",\n  \"secret_token\": \"sk_…\",\n  \"api\": \"/api/v1\",\n  \"onion_api\": \"http://2gzy…wid.onion/api/v1\",\n  \"webhook_signing_secret\": \"whsec_…\"\n}\n<\/code><\/pre>\n<p><code>onion_api<\/code> is there only while the Monokulo has an onion address, and\n<code>webhook_signing_secret<\/code> only when you sent a <code>webhook_url<\/code>. Keep them all. <code>secret_token<\/code> is the store's key for your server, in\n<code>Authorization: Bearer<\/code> on the <a href=\"#api\">HTTP API<\/a>; <code>public_key<\/code> is for the\nshop's pages, if they embed the checkout with the <a href=\"#js-library\">JS library<\/a>.\n<code>api<\/code> is the API's entry, a path (<code>/api/v1<\/code>, or <code>/monokulo/api/v1<\/code> for a\nMonokulo served <a href=\"#under-a-path\">under a path<\/a>): resolve it against\nthe address you called <code>/finish<\/code> at, and keep the result.<\/p>\n<p>Every error is <code>application/problem+json<\/code>; show its <code>detail<\/code>. Its <code>type<\/code>\nis one of these:<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Problem<\/th><th>Status<\/th><th>What to do<\/th><\/tr><\/thead><tbody>\n<tr><td><a href=\"https://docs.monokulo.com/problems/invalid-connect-code/\"><code>invalid-connect-code<\/code><\/a><\/td><td>401<\/td><td>The token is unknown, used or expired: start connecting again.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/no-public-address/\"><code>no-public-address<\/code><\/a><\/td><td>503<\/td><td>The Monokulo's admin hasn't set its address yet. The token isn't spent: try again later.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/invalid-request/\"><code>invalid-request<\/code><\/a><\/td><td>400<\/td><td>The body isn't what <code>/finish<\/code> takes, or <code>webhook_url<\/code> isn't an http(s) URL. The token isn't spent: fix it and send it again.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/unsupported-media-type/\"><code>unsupported-media-type<\/code><\/a><\/td><td>415<\/td><td>Send <code>Content-Type: application/json<\/code>.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/too-large/\"><code>too-large<\/code><\/a><\/td><td>413<\/td><td>The body is too large.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/not-found/\"><code>not-found<\/code><\/a><\/td><td>404<\/td><td><code>slug<\/code> isn't a slug.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/rate-limited/\"><code>rate-limited<\/code><\/a><\/td><td>429<\/td><td>Wait <code>retry_after<\/code> seconds.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/internal/\"><code>internal<\/code><\/a><\/td><td>500<\/td><td>Something failed on the Monokulo after the token was spent: start again.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div><h3 id=\"2-create-an-order\">2. Create an order<\/h3>\n<p>The entry (<code>GET {api}<\/code> with the key) lists what it may do. Keep it as its\n<code>Cache-Control<\/code> says and read it again when it expires or a form from it is\nrefused with <code>401<\/code>, <code>404<\/code> or <code>405<\/code> (see <a href=\"#find-your-way\">Find your way<\/a>),\nso making an order is one request. Its <code>create-order<\/code> form is:<\/p>\n<pre><code>POST {monokulo}/api/v1/orders\nAuthorization: Bearer {secret_token}\nMonokulo-Client: {slug}/{your version}\nContent-Type: application/json\n\n{\n  \"amount\": \"12.50\",\n  \"currency\": \"EUR\",\n  \"merchant_order_id\": \"1042\",\n  \"show_merchant_order_id\": true,\n  \"description\": \"Order #1042: Blue mug + 2 more\",\n  \"idempotency_key\": \"ps:1042:12.50:EUR\"\n}\n<\/code><\/pre>\n<p>It answers <code>201 Created<\/code> with the order and its <code>Location<\/code>. Monokulo prices\nfiat in XMR itself. <code>amount<\/code> is a decimal string with up to 12 decimals in\nany currency, and trailing zeros don't count, so a shop that pads its prices\n(<code>12.50000000<\/code>) can send them as they are. Webhooks give <code>amount<\/code> back\nexactly as you sent it. A retry with the same <code>idempotency_key<\/code> gets the same\norder. While your plugin is the store's connected one, orders it makes this\nway show as yours on the dashboard. A refused order is\n<code>application/problem+json<\/code>: its <code>detail<\/code> says why, and its <code>type<\/code> links to\nthe problem's page. Two are worth retrying rather than showing the\ncustomer as final: <a href=\"https://docs.monokulo.com/problems/rates-unavailable/\"><code>rates-unavailable<\/code><\/a>\n(503: the exchange-rate providers are down or rate limiting Monokulo and it\nhas no recent rate for the currency) and\n<a href=\"https://docs.monokulo.com/problems/engine-unavailable/\"><code>engine-unavailable<\/code><\/a> (503: the payment\nengine is busy). Nothing was made; wait <code>retry_after<\/code> seconds (also in\n<code>Retry-After<\/code>) when given, and send the same request with the same\n<code>idempotency_key<\/code>. A currency Monokulo can't price is final instead:\n<a href=\"https://docs.monokulo.com/problems/invalid-amount/\"><code>invalid-amount<\/code><\/a> (400), for a code that\nisn't a currency (refused before any rate provider is asked), a real one\nnone of the store's rate providers quotes, or any order of a store whose\nbase currency none of them quotes. Tell the merchant; retrying won't help.\n<code>rates-unavailable<\/code> is only for a currency they do quote but can't right\nnow.<\/p>\n<h3 id=\"3-send-the-customer-to-pay\">3. Send the customer to pay<\/h3>\n<p>To the order's <code>mk:checkout<\/code> link (<code>/checkout/{order_id}<\/code>, resolved against\nthe address you call Monokulo at), or show that page in an iframe on yours.<\/p>\n<p>A customer browsing the shop's own <code>.onion<\/code> address must stay on Tor: send\nthem to the order's <code>mk:onion-checkout<\/code> instead, an absolute URL on\nMonokulo's onion address, never to <code>mk:checkout<\/code> resolved against the web\naddress you called. Tell them apart by the host their request came to. If\nthe order has no <code>mk:onion-checkout<\/code>, the Monokulo has no onion address;\nsay so to the merchant rather than sending a Tor customer to the web.\nThe <a href=\"#js-library\">JS library<\/a> can mount it too. Read the order again with\nits <code>self<\/code> link (<code>GET /api/v1/orders/{order_id}<\/code>), or follow its changes on\n<code>mk:order-events<\/code>; but mark the shop's order paid from the webhook.<\/p>\n<p>On the shop's own order page, link the merchant to the order in Monokulo\nwith its <a href=\"https://docs.monokulo.com/rels/dashboard-order/\"><code>mk:dashboard-order<\/code><\/a> link: its page on\nthe merchant's dashboard. Take it from the webhooks: every one carries it,\nabsolute, in its <code>_links<\/code> (with <code>mk:order<\/code> and <code>mk:checkout<\/code>), on every\nevent, <code>order.cancelled<\/code> included. Show the one the order's latest webhook\ncarried, replacing any you had, rather than one kept from when the order\nwas made, and never build it. Before the order's first webhook there's\nnothing to show yet; the order <code>create-order<\/code> answered with has it too,\nfor your secret key only (a path: resolve it like the others), if you\nwant the link that early.<\/p>\n<h3 id=\"4-take-webhooks\">4. Take webhooks<\/h3>\n<p>Monokulo posts each change to <code>webhook_url<\/code>, signed. <a href=\"#webhooks\">Webhooks<\/a>\nhas the body and how to check it. Mark the shop's order paid on\n<code>order.paid<\/code> and <code>order.overpaid<\/code>; never undo a payment on your own.\n<code>order.expired<\/code> and <code>order.cancelled<\/code> both mean the order takes no payment\nany more; an order your plugin made is never cancelled (only the POS\ncancels, its own orders), but a receiver that sees <code>order.cancelled<\/code> should\ntreat it as it treats <code>order.expired<\/code>.<\/p>\n<p><code>webhook.test<\/code> is a <a href=\"#webhooks\">test delivery<\/a>: the merchant\npressed <em>Send a test webhook<\/em>, or your plugin sent the form below. Verify\nit like any other, answer <code>2xx<\/code>, and change nothing: it has no order. If\nyou like, keep when the last one arrived (its <code>created_at<\/code>) and show it in\nyour settings as \"Last test webhook received\", so the shop's admin can see\ndeliveries reach the shop.<\/p>\n<h3 id=\"5-forward-your-errors-optional\">5. Forward your errors (optional)<\/h3>\n<p>Follow the entry's <code>send-logs<\/code> form; your <code>sk_<\/code> key is the only one offered\nit:<\/p>\n<pre><code>POST /api/v1/logs\nAuthorization: Bearer {secret_token}\nMonokulo-Client: {slug}/{your version}\nContent-Type: application/json\n\n{ \"entries\": [ { \"level\": \"error\", \"message\": \"…\", \"trace_id\": \"…\" } ] }\n<\/code><\/pre>\n<p>Kept only when the store turned on client logs (otherwise a <code>403<\/code>\n<code>logs-off<\/code> problem). Levels are PSR-3's (<code>error<\/code>, <code>warning<\/code>, …); at most 20\nentries a time.<\/p>\n<h3 id=\"6-test-the-connection-optional\">6. Test the connection (optional)<\/h3>\n<p>Follow the entry's <code>send-test-webhook<\/code> form, also offered to your <code>sk_<\/code>\nkey only, for a \"Test connection\" button: Monokulo sends your webhook a\nsigned <code>webhook.test<\/code> and answers once your receiver has answered.<\/p>\n<pre><code>POST /api/v1/webhook-tests\nAuthorization: Bearer {secret_token}\nMonokulo-Client: {slug}/{your version}\nContent-Type: application/json\n\n{}\n<\/code><\/pre>\n<pre><code class=\"language-json\">{\n  \"webhook_id\": \"wh_3f0c2a9e5b7d41c6a8e2f1d0b9c7a6e5\",\n  \"event_id\": \"evt_9c41d2b7e05a3f18\",\n  \"delivered\": true,\n  \"status\": 200,\n  \"duration_ms\": 12,\n  \"response\": \"HTTP/1.1 200 OK\\ncontent-type: text/plain; charset=utf-8\\n\\nok\",\n  \"_links\": { \"self\": { \"href\": \"/api/v1/webhook-tests\" }, \"mk:store\": { \"href\": \"/api/v1/store\" } }\n}\n<\/code><\/pre>\n<p><code>{}<\/code> tests the webhook your plugin registered when it connected; name\nanother of the store's with <code>webhook_id<\/code>. It's <code>200<\/code> whatever your\nreceiver said: <code>delivered<\/code> is whether it answered <code>2xx<\/code>; otherwise <code>status<\/code>\n(left out when nothing answered) and <code>error<\/code> say why, and\n<code>next_attempt_at<\/code> when Monokulo tries again. Monokulo can't see whether\nyour receiver checked the signature; a receiver that answers <code>2xx<\/code> only\nafter checking it makes <code>delivered<\/code> mean it did, and the <code>event_id<\/code> it\nreceived should be the one answered here. Up to 6 a minute for a store,\nthen <code>429<\/code> <code>rate-limited<\/code> with <code>retry_after<\/code>.<\/p>\n<h2 id=\"test-your-receiver\">Test your receiver<\/h2>\n<p><a href=\"https://docs.monokulo.com/webhook-vectors.json\">webhook-vectors.json<\/a> holds one signed delivery for\neach event, and deliveries a receiver must refuse. Monokulo's own tests\nbuild it from the code that sends real webhooks and check real deliveries\nagainst it, so a receiver that passes on it handles what Monokulo sends.<\/p>\n<p>Then test it end to end: a smoke test that connects your plugin to a\nMonokulo sends the <code>send-test-webhook<\/code> form and checks that <code>delivered<\/code>\nis <code>true<\/code> and that your receiver recorded that <code>event_id<\/code> and changed no\norder. It needs no Monero node and no payment.<\/p>","toc":[{"id":"plugins","text":"Plugins"},{"id":"writing-a-plugin","text":"Writing a plugin"},{"id":"test-your-receiver","text":"Test your receiver"}]},{"id":"apps","label":"Connected apps","group":"Connect","title":"Connected apps","html":"<p>A connected app is a device that takes payments for one store with a key\nof its own: a till app beside a point of sale, say. A store has any number\nof them, each disconnected on its own. Monokulo keeps no list of apps: any\napp that follows this page works with any Monokulo.<\/p>\n<p>An app differs from a <a href=\"#plugins\">shop plugin<\/a>: a store has one plugin,\nwhich connects from the shop and is found by the shop's address; apps\nconnect from the store's dashboard and have no shop.<\/p>\n<p>Once connected, an app uses the <a href=\"#api\">HTTP API<\/a> with its own key.<\/p>\n<h2 id=\"1-connect\">1. Connect<\/h2>\n<p>The merchant opens the store's settings, <strong>Connections › Apps › Connect an\napp<\/strong>, and Monokulo shows a code: a QR code of a link, and the same link to\ncopy.<\/p>\n<pre><code>https://www.monokulo.com/apps/connect#token=ct_…\n<\/code><\/pre>\n<p>Read it with your app's scanner, or let the merchant paste it. The token is\nin the <code>#<\/code> part, which a browser never sends to a server. It works once,\nfor 10 minutes. Redeem it at the link's address:<\/p>\n<pre><code>POST https://www.monokulo.com/apps/connect\nMonokulo-Client: {slug}/{your version}\nContent-Type: application/json\n\n{ \"token\": \"ct_…\", \"slug\": \"till-app\", \"name\": \"Till App\",\n  \"device_name\": \"Pixel 8\", \"platform\": \"android\" }\n<\/code><\/pre>\n<ul>\n<li><code>slug<\/code> names your app, with a plugin's rules: a lowercase letter, then 1\nto 31 lowercase letters, digits or hyphens.<\/li>\n<li><code>name<\/code>, <code>device_name<\/code> and <code>platform<\/code> are optional. <code>name<\/code> is what the\ndashboard calls your app; <code>device_name<\/code> is used when the merchant gave\nthe device none.<\/li>\n<\/ul>\n<p>It answers once per token:<\/p>\n<pre><code class=\"language-json\">{ \"app_key\": \"ak_…\", \"api\": \"/api/v1\", \"onion_api\": \"http://2gzy…wid.onion/api/v1\" }\n<\/code><\/pre>\n<p>Keep <code>app_key<\/code> somewhere safe on the device: it isn't shown again. <code>api<\/code> is\nthe API's entry, a path (<code>/api/v1<\/code>, or <code>/monokulo/api/v1<\/code> for a Monokulo\nserved <a href=\"#under-a-path\">under a path<\/a>): resolve it against the\naddress you connected at (an app that connected over the onion address\nstays on it). <code>onion_api<\/code> is\nthere only while the Monokulo has an onion address: the same entry on it,\nfor an app that can reach Monokulo over Tor (see <a href=\"#tor\">Tor<\/a>).<\/p>\n<p>Every error is <code>application/problem+json<\/code>; show its <code>detail<\/code>. Its <code>type<\/code>\nis one of these:<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Problem<\/th><th>Status<\/th><th>What to do<\/th><\/tr><\/thead><tbody>\n<tr><td><a href=\"https://docs.monokulo.com/problems/invalid-connect-code/\"><code>invalid-connect-code<\/code><\/a><\/td><td>401<\/td><td>The code is unknown, used or expired: ask the merchant for a new one.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/no-public-address/\"><code>no-public-address<\/code><\/a><\/td><td>503<\/td><td>The Monokulo's admin hasn't set its address yet. The code isn't spent: try again later.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/invalid-request/\"><code>invalid-request<\/code><\/a><\/td><td>400<\/td><td>The body isn't what this takes, or <code>slug<\/code> isn't a slug.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/unsupported-media-type/\"><code>unsupported-media-type<\/code><\/a><\/td><td>415<\/td><td>Send <code>Content-Type: application/json<\/code>.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/too-large/\"><code>too-large<\/code><\/a><\/td><td>413<\/td><td>The body is too large.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/rate-limited/\"><code>rate-limited<\/code><\/a><\/td><td>429<\/td><td>Wait <code>retry_after<\/code> seconds.<\/td><\/tr>\n<tr><td><a href=\"https://docs.monokulo.com/problems/internal/\"><code>internal<\/code><\/a><\/td><td>500<\/td><td>Something failed on the Monokulo: try again later.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div><h2 id=\"2-find-your-way\">2. Find your way<\/h2>\n<p>Every request carries the key:<\/p>\n<pre><code>GET https://www.monokulo.com/api/v1\nAuthorization: Bearer {app_key}\nMonokulo-Client: {slug}/{your version}\n<\/code><\/pre>\n<p>The entry links to the store (<code>mk:store<\/code>: its name, base currency and the\nwallet its payments go to, with the full address), its orders, its events,\nand your app's own connection (<code>mk:app<\/code>), and carries the forms your key may\nuse (<code>create-order<\/code>, <code>disconnect<\/code>). Follow the links rather than building\npaths: they're relative, so resolve them against the URL you used. Keep the\nentry as its <code>Cache-Control<\/code> says, and read it again when it expires or a\nlink from it answers <code>401<\/code>, <code>404<\/code> or <code>405<\/code> (see\n<a href=\"#find-your-way\">Find your way<\/a>). Read the store (<code>mk:store<\/code>) each\ntime you show it; the merchant can rename it or move it to another wallet.<\/p>\n<h2 id=\"3-make-orders\">3. Make orders<\/h2>\n<p>The <code>create-order<\/code> form:<\/p>\n<pre><code>POST https://www.monokulo.com/api/v1/orders\nAuthorization: Bearer {app_key}\nMonokulo-Client: {slug}/{your version}\nContent-Type: application/json\n\n{ \"amount\": \"24.50\", \"currency\": \"USD\", \"merchant_order_id\": \"#1042\",\n  \"idempotency_key\": \"till:payment-9f2c\" }\n<\/code><\/pre>\n<p>It answers <code>201 Created<\/code> with the order and its <code>Location<\/code>. The order is\nthe app's on the dashboard, with the device's name. Two devices that send the\nsame <code>idempotency_key<\/code> get the same order. Anyone with the payment link can\nread an order's <code>description<\/code>, so leave it out if what was bought is\nprivate.<\/p>\n<h2 id=\"4-follow-them\">4. Follow them<\/h2>\n<pre><code>GET https://www.monokulo.com/api/v1/events\nAuthorization: Bearer {app_key}\n<\/code><\/pre>\n<p>Server-sent events for every order the store's apps make: <code>ready<\/code> first,\nthen <code>sale.waiting<\/code>, <code>sale.seen<\/code>, <code>sale.confirming<\/code>, <code>sale.paid<\/code>,\n<code>sale.partial<\/code>, <code>sale.expired<\/code> and <code>sale.double_spend<\/code>, each with JSON data\nthat links its order (<code>mk:order<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"event\": \"sale.paid\", \"order_id\": \"order_9f3c…\", \"amount\": \"24.50\", \"currency\": \"USD\",\n  \"address\": \"8…\", \"xmr_amount_piconero\": 141900000000,\n  \"merchant_order_id\": \"#1042\", \"expires_at\": 1761312000,\n  \"device_name\": \"Front counter\", \"at\": 1761310260,\n  \"_links\": {\n    \"mk:order\": { \"href\": \"/api/v1/orders/order_9f3c…\", \"title\": \"One order: what to pay, where, and how far the payment has got.\" },\n    \"curies\": [{ \"name\": \"mk\", \"href\": \"https://docs.monokulo.com/rels/{rel}\", \"templated\": true }]\n  } }\n<\/code><\/pre>\n<p>There's no <code>sale.cancelled<\/code>: only the POS cancels an order, and only its\nown, so an app's order never is.<\/p>\n<p>A comment arrives every 25 s. After <code>lagged<\/code>, or a reconnect, read the\norders you're showing again: follow each one's <code>mk:order<\/code> link (or the\norder's own <code>self<\/code>), or follow one order's own stream (<code>mk:order-events<\/code>).\nNever build an order's URL from its id.<\/p>\n<h2 id=\"5-disconnect\">5. Disconnect<\/h2>\n<p>The <code>disconnect<\/code> form on your app's connection:<\/p>\n<pre><code>DELETE https://www.monokulo.com/api/v1/app\nAuthorization: Bearer {app_key}\n<\/code><\/pre>\n<p>The key stops working at once, and its event stream ends. The merchant can\ndo the same from the dashboard. Orders the app made stay, and can still be\npaid.<\/p>","toc":[{"id":"1-connect","text":"1. Connect"},{"id":"2-find-your-way","text":"2. Find your way"},{"id":"3-make-orders","text":"3. Make orders"},{"id":"4-follow-them","text":"4. Follow them"},{"id":"5-disconnect","text":"5. Disconnect"}]}],"apiIntro":{"title":"HTTP API","html":"<p>Monokulo's HTTP API lets a shop's server, a shop plugin, a connected app\nor a page with the <a href=\"#js-library\">JS library<\/a> make orders and follow\nthem: <code>/api/v1<\/code> on your Monokulo's own address. The\n<a href=\"https://docs.monokulo.com/reference/\">reference<\/a> lists every resource, and the\n<a href=\"https://docs.monokulo.com/v1/openapi.json\">OpenAPI document<\/a> has the same for tools.<\/p>\n<h2 id=\"keys\">Keys<\/h2>\n<p>Every request names its store with a key, <code>Authorization: Bearer &lt;key&gt;<\/code>;\nno URL has the store in it.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Key<\/th><th>Who has it<\/th><th>What it may do<\/th><\/tr><\/thead><tbody>\n<tr><td><code>sk_…<\/code><\/td><td>The shop's server: the store's secret key, which a <a href=\"#plugins\">plugin<\/a> gets when it connects.<\/td><td>Everything about the store's orders and events, send a plugin's logs, and send the store's webhooks a test delivery (<code>send-test-webhook<\/code>, see <a href=\"#webhooks\">Webhooks<\/a>).<\/td><\/tr>\n<tr><td><code>ak_…<\/code><\/td><td>A <a href=\"#apps\">connected app<\/a>: its own key, made when it connects.<\/td><td>The same as the secret key, and read or disconnect its own connection.<\/td><\/tr>\n<tr><td><code>pk_…<\/code><\/td><td>A browser page: the store's public key. It proves nothing.<\/td><td>Make an order and read it. A store that takes orders only from its verified websites refuses one from anywhere else.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<p><code>GET /api/v1<\/code> takes no key, so a client can check it found a Monokulo. A\nroute that needs a key answers <code>401<\/code> without one, and <code>403<\/code> with one that\nmay not use it. A key this Monokulo doesn't know (mistyped, replaced, or a\ndisconnected app's) is <code>401<\/code> on every route, the entry included: never the\nentry as if no key had been sent.<\/p>\n<h2 id=\"find-your-way\">Find your way<\/h2>\n<p>Start at the entry, <code>GET /api/v1<\/code>, with your key. It links everything your\nkey may read and carries every form it may use, so creating an order is the\n<code>create-order<\/code> form's <code>target<\/code>, not a path you build.<\/p>\n<p>The entry can be kept: it answers <code>Cache-Control: private, max-age=3600<\/code>,\n<code>Vary: Authorization<\/code> and an <code>ETag<\/code>.<\/p>\n<ul>\n<li>Keep it for as long as <code>max-age<\/code> says, per key, and use its links and\nforms from your copy: making an order is then one request.<\/li>\n<li>When it has expired, ask again with <code>If-None-Match: &lt;its ETag&gt;<\/code>. While it\nis the same you get <code>304 Not Modified<\/code> with no body, and keep your copy\nfor another <code>max-age<\/code>.<\/li>\n<li>Read it again at once when something you followed from it answers <code>401<\/code>,\n<code>404<\/code> or <code>405<\/code>: your key changed, or the API moved on.<\/li>\n<\/ul>\n<p>Everything else (the store, orders, events) is <code>Cache-Control: no-store<\/code>:\nread it each time.<\/p>\n<h2 id=\"follow-links-use-forms\">Follow links, use forms<\/h2>\n<p>Resources are HAL-FORMS (<code>application/prs.hal-forms+json<\/code>). Each has\n<code>_links<\/code>, where to go next, and <code>_templates<\/code>, the forms its key may use\nthere: a form's <code>method<\/code>, <code>target<\/code> and <code>properties<\/code> say what to send, with\neach field's rules.<\/p>\n<pre><code class=\"language-json\">{\n  \"_links\": {\n    \"self\": { \"href\": \"/api/v1\" },\n    \"mk:orders\": { \"href\": \"/api/v1/orders\", \"title\": \"The store's orders, newest first, a page at a time.\" },\n    \"curies\": [{ \"name\": \"mk\", \"href\": \"https://docs.monokulo.com/rels/{rel}\", \"templated\": true }]\n  },\n  \"_templates\": {\n    \"create-order\": { \"method\": \"POST\", \"target\": \"/api/v1/orders\", \"contentType\": \"application/json\", \"properties\": [ … ] }\n  }\n}\n<\/code><\/pre>\n<ul>\n<li>A link or form the key may not use is left out, so a client finds out\nwhat its key does by reading the entry.<\/li>\n<li>A field with no value is left out, never sent as <code>null<\/code> (an order not\ncancelled has no <code>cancelled_at<\/code>), the same in every body and every\n<a href=\"#webhooks\">webhook<\/a>. In the OpenAPI document such a field isn't\nrequired, and no schema allows <code>null<\/code>; in a request, leave out a field\nyou have no value for.<\/li>\n<li>Links are paths on Monokulo's own host. Resolve them against the URL you\ncalled: a client that came in over the onion address stays on it.<\/li>\n<li>Onion links are the exception: see <a href=\"#tor\">Tor<\/a>.<\/li>\n<li>Monokulo's own relations are written <code>mk:&lt;name&gt;<\/code>; the <code>mk<\/code> curie points at\neach one's page, <a href=\"https://docs.monokulo.com/reference/\"><code>/rels/{name}/<\/code><\/a>.<\/li>\n<li>Making something answers <code>201 Created<\/code> with its <code>Location<\/code>.<\/li>\n<li>An order links its payer's page, <code>mk:checkout<\/code>, and, for the store's\nsecret key only, its page on the merchant's dashboard,\n<a href=\"https://docs.monokulo.com/rels/dashboard-order/\"><code>mk:dashboard-order<\/code><\/a>: show that one to the\nmerchant (\"View in Monokulo\") rather than building its URL.<\/li>\n<\/ul>\n<h3 id=\"under-a-path\">Under a path<\/h3>\n<p>A Monokulo behind a reverse proxy can be served under a path,\n<code>https://example.com/monokulo/<\/code>, the proxy passing\n<code>https://example.com/monokulo/api/v1<\/code> on as <code>/api/v1<\/code>. Its admin then sets\n<code>public_uri<\/code> to <code>https://example.com/monokulo<\/code>, and every link, form\n<code>target<\/code> and <code>Location<\/code> the API gives starts with <code>/monokulo<\/code>, as does the\n<code>api<\/code> the plugin and app handshakes give. Resolved against the host you\ncalled, they reach Monokulo; build nothing from <code>/api/v1<\/code> yourself. Onion\nlinks have no such path: tor reaches Monokulo directly. Monokulo's own\npages, the dashboard, the POS and the checkout, work under the path too:\ntheir links, forms, redirects, scripts, live updates and session cookie\nall stay under it.<\/p>\n<h2 id=\"amounts\">Amounts<\/h2>\n<p>An amount is a decimal string in its currency, with up to 12 decimals in\nany currency (XMR's own precision). Trailing zeros don't count:\n<code>12.50000000<\/code> is <code>12.50<\/code>. Monokulo keeps the amount as you sent it and\ngives it back unchanged; its pages show it with the currency's usual\ndecimals.<\/p>\n<h2 id=\"tor\">Tor<\/h2>\n<p>While a Monokulo has an onion address (Tor inside it, or an external tor),\nits responses also carry absolute links to the same things on that address,\nwhichever address you called. Without one they're absent.<\/p>\n<ul>\n<li>Every order (made, read, listed, or sent on its event stream) has\n<a href=\"https://docs.monokulo.com/rels/onion-checkout/\"><code>mk:onion-checkout<\/code><\/a>: its checkout page on the\nonion address.<\/li>\n<li>The entry, <code>GET /api/v1<\/code>, has <a href=\"https://docs.monokulo.com/rels/onion-api/\"><code>mk:onion-api<\/code><\/a>: the\nentry on the onion address. Everything you follow from there is relative,\nso you stay on Tor.<\/li>\n<li>The plugin and app handshakes give the same URL as <code>onion_api<\/code>.<\/li>\n<\/ul>\n<pre><code class=\"language-json\">{\n  \"order_id\": \"order_9f3c…\",\n  \"_links\": {\n    \"self\": { \"href\": \"/api/v1/orders/order_9f3c…\" },\n    \"mk:checkout\": { \"href\": \"/checkout/order_9f3c…\", \"type\": \"text/html\" },\n    \"mk:onion-checkout\": { \"href\": \"http://2gzy…wid.onion/checkout/order_9f3c…\", \"type\": \"text/html\" }\n  }\n}\n<\/code><\/pre>\n<p>Anyone on Tor must be sent to the onion links, never to a link resolved\nagainst the web address: a shop server that calls Monokulo over the web\naddress but serves a customer on the shop's own <code>.onion<\/code> sends them to\n<code>mk:onion-checkout<\/code>. Nothing Monokulo serves over its onion address points\nat its web address.<\/p>\n<h2 id=\"errors\">Errors<\/h2>\n<p>An error is <code>application/problem+json<\/code> (RFC 9457), in the API and on every\nother route a machine calls (the plugin and app handshakes, the point of\nsale, the checkout's own scripts); only pages for people answer with HTML:<\/p>\n<pre><code class=\"language-json\">{\n  \"type\": \"https://docs.monokulo.com/problems/invalid-amount\",\n  \"title\": \"The order can't be priced\",\n  \"status\": 400,\n  \"detail\": \"unknown currency: NOPE\"\n}\n<\/code><\/pre>\n<p><code>type<\/code> is the problem's page, which says what it means and what to do;\n<code>detail<\/code> says what went wrong this time. Every problem is listed in the\n<a href=\"https://docs.monokulo.com/reference/\">reference<\/a>. A busy browser (a request with the public key, or\nno key) may be asked to solve a small proof of work (<code>challenge-required<\/code>);\nthe JS library does it by itself. A server never is: a request with the\nstore's secret key or an app's key, both handshakes and every log report\nare only ever rate limited (<code>rate-limited<\/code>, with <code>Retry-After<\/code>). Sending\na test webhook (<code>send-test-webhook<\/code>) has a limit of its own, 6 a minute\nfor a store, answered the same way.<\/p>\n<p>A <code>503<\/code> is worth retrying: <code>rates-unavailable<\/code> (no exchange rate for the\norder's currency right now: the rate providers are down or rate limiting\nMonokulo, and it has no recent enough rate of its own), <code>engine-unavailable<\/code>\n(the payment engine is busy), <code>store-unavailable<\/code> (the store's settings\ncan't be read for a moment). <code>rates-unavailable<\/code> carries <code>retry_after<\/code> and\n<code>Retry-After<\/code> when a provider said how long to wait; Monokulo keeps pricing\nfrom its last rate for a while when a provider fails, so\n<code>rates-unavailable<\/code> means there's genuinely no usable rate.<\/p>\n<p>A currency Monokulo can't price is final, not worth retrying: making an\norder (<code>POST /api/v1/orders<\/code>) in it is <code>400<\/code>\n<a href=\"https://docs.monokulo.com/problems/invalid-amount/\"><code>invalid-amount<\/code><\/a>, whose <code>detail<\/code> says which.\nA code that isn't a currency Monokulo knows (<code>NOPE<\/code>) is refused before any\nrate provider is asked (<code>unknown currency<\/code>); a real currency none of the\nstore's rate providers quotes is refused once they've said so\n(<code>unsupported currency<\/code>); and so is any order of a store whose own base\ncurrency none of them quotes, since its confirmations are decided in that\ncurrency. <code>rates-unavailable<\/code> is only ever for a currency the store's\nproviders do quote but can't right now. An order in XMR needs no rate.<\/p>\n<p>Every route lists, in the <a href=\"https://docs.monokulo.com/reference/\">reference<\/a> and the <a href=\"https://docs.monokulo.com/v1/openapi.json\">OpenAPI\ndocument<\/a>, each problem it may answer, by status, with an\nexample of each.<\/p>\n<h2 id=\"event-streams\">Event streams<\/h2>\n<p><code>mk:events<\/code> (the store's sales, for a secret or app key) and\n<code>mk:order-events<\/code> (one order) are server-sent events\n(<code>text/event-stream<\/code>): each event an <code>event:<\/code> line with its name and a\n<code>data:<\/code> line, mostly JSON, and a comment now and then while nothing\nhappens. A sale event links its order, so you follow the link rather than\nbuild the order's URL:<\/p>\n<pre><code class=\"language-json\">{\n  \"event\": \"sale.paid\",\n  \"order_id\": \"order_9f3c…\",\n  \"amount\": \"24.50\",\n  \"currency\": \"USD\",\n  \"_links\": {\n    \"mk:order\": { \"href\": \"/api/v1/orders/order_9f3c…\", \"title\": \"One order: what to pay, where, and how far the payment has got.\" },\n    \"curies\": [{ \"name\": \"mk\", \"href\": \"https://docs.monokulo.com/rels/{rel}\", \"templated\": true }]\n  }\n}\n<\/code><\/pre>\n<p>Each stream's page in the <a href=\"https://docs.monokulo.com/reference/\">reference<\/a> lists its events and\ntheir data; the OpenAPI document has them as <code>x-events<\/code> on the\n<code>text/event-stream<\/code> answer (OpenAPI 3.1 has no schema for a stream's\nevents), with a recorded stream as its example.<\/p>\n<h2 id=\"the-openapi-document\">The OpenAPI document<\/h2>\n<p>Every Monokulo serves its <a href=\"https://docs.monokulo.com/v1/openapi.json\">OpenAPI 3.1 document<\/a> at\n<code>/api/v1/openapi.json<\/code> (the entry's <code>service-desc<\/code>). It has every route,\nwho may call it, what it takes and answers, every problem it may answer\n(with its status and headers); the pages the API links\n(<code>text/html<\/code>); the plugin and app handshakes with every problem they\nanswer; and each stream's events. The copy on this site also has examples,\nreal exchanges recorded against a test engine: the entry and the store as\neach key sees them, with and without an onion address, orders, streams,\nand every problem of every route.<\/p>\n<p>To generate a client at a pinned Monokulo commit, write the same document\nfrom its source:<\/p>\n<pre><code>git clone https://github.com/OceanEilonwy/monokulo &amp;&amp; cd monokulo\ncargo xtask api openapi --out openapi.json\n<\/code><\/pre>\n<p>It needs Rust only: <code>rustup<\/code> installs the toolchain the repository names\n(<code>rust-toolchain.toml<\/code>: nightly, with the WebAssembly target) by itself.\nIt builds monokulo's library and one example, no tests and no browser\ncode, so neither Node nor <code>npm ci<\/code> is needed. The example records the\nexchanges against an in-process test engine, checks each against the\ndocument, and writes it with them as examples.<\/p>\n<p>The document is the same, byte for byte, each time it's written from\nthe same commit, on any machine, so a plugin can copy its examples into\nits own tests and compare them exactly. Ids, keys and addresses are\nstand-ins (<code>order_000…01<\/code>, <code>sk_000…01<\/code>), every time is\n2026-01-01T00:00:00Z (<code>1767225600<\/code>; an order's <code>expires_at<\/code> keeps how\nlong it runs), a rate limit's <code>retry_after<\/code> is the one a client gets on\nthat second (<code>120<\/code> in the <code>rate-limited<\/code> examples), and a challenge's\nrandom nonce and signature are zeros.<\/p>\n<h2 id=\"versions\">Versions<\/h2>\n<p><code>/api/v1<\/code> changes only by adding: new links, forms, fields and problems.\nA client that follows links and ignores what it doesn't know keeps\nworking. Anything that would break one becomes <code>/api/v2<\/code>, beside it.<\/p>","toc":[{"id":"keys","text":"Keys"},{"id":"find-your-way","text":"Find your way"},{"id":"follow-links-use-forms","text":"Follow links, use forms"},{"id":"amounts","text":"Amounts"},{"id":"tor","text":"Tor"},{"id":"errors","text":"Errors"},{"id":"event-streams","text":"Event streams"},{"id":"the-openapi-document","text":"The OpenAPI document"},{"id":"versions","text":"Versions"}]},"groups":[{"tag":"root","description":"The API's entry: where to go from here.\n\nLinks to the store, its orders and its events (and, for a connected\napp, the app itself), the forms the key may use (a shop's server also\ngets the ones for sending its warnings and errors and for sending one\nof the store's webhooks a test delivery), and the API's\ndescription. A link or form the key may not use is left out, so a\nclient can find out what its key does by reading this. While this\nMonokulo has an onion address, `mk:onion-api` says where the same entry\nis on it.","ops":[{"id":"root-get","method":"GET","path":"/api/v1","summary":"Read the entry. Open without a key, so a client can check it found a Monokulo API; with one, it shows what that key may do, and a key this Monokulo doesn't know is refused (`401`), like everywhere in the API.","description":"Read the entry. Open without a key, so a client can check it found a\nMonokulo API; with one, it shows what that key may do, and a key this\nMonokulo doesn't know is refused (`401`), like everywhere in the API.\n\nA client keeps it for an hour (`Cache-Control: private, max-age=3600`,\n`Vary: Authorization`), and after that asks again with its `ETag` in\n`If-None-Match`, which answers `304 Not Modified` while it's the same.\nIt reads it again sooner when a link or form from it is refused with\n`401`, `404` or `405`.","keys":["pk","sk","ak"],"anyone":true,"session":false,"params":[{"name":"If-None-Match","in":"header","required":false,"type":"string","description":"The `ETag` of the copy the client holds: `304 Not Modified` while it's current."}],"body":null,"responses":[{"status":"200","description":"OK","contentType":"application/prs.hal-forms+json","examples":[{"name":"ak","summary":"With a connected app's key (ak_)","value":{"_links":{"curies":[{"href":"https://docs.monokulo.com/rels/{rel}","name":"mk","templated":true}],"mk:app":{"href":"/api/v1/app","title":"The connected app the key belongs to."},"mk:events":{"href":"/api/v1/events","title":"The store's sale events, as server-sent events: one stream for the orders its connected apps make.","type":"text/event-stream"},"mk:orders":{"href":"/api/v1/orders","title":"The store's orders, newest first, a page at a time."},"mk:store":{"href":"/api/v1/store","title":"The store the key belongs to, and where its payments go."},"self":{"href":"/api/v1"},"service-desc":{"href":"/api/v1/openapi.json","title":"The API's OpenAPI 3.1 document.","type":"application/openapi+json"},"service-doc":{"href":"https://docs.monokulo.com/api/","type":"text/html"}},"_templates":{"create-order":{"contentType":"application/json","method":"POST","properties":[{"maxLength":40,"name":"amount","placeholder":"12.50","prompt":"The price, in `currency`.","regex":"^[0-9]+(\\.[0-9]{1,12}0*)?$","required":true,"type":"text"},{"name":"currency","placeholder":"EUR","prompt":"The currency of `amount`.","regex":"^[A-Za-z0-9]{2,10}$","required":true,"type":"text"},{"maxLength":140,"minLength":1,"name":"description","placeholder":"Order #1042: Blue mug + 2 more","prompt":"What the order is for, shown to the payer under the store's name.\nWithout one t <script>
(() => {
const MK = window.MK;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k) { try { return sessionStorage.getItem("mk-" + k) || ""; } catch { return ""; } },
  set(k, v) { try { sessionStorage.setItem("mk-" + k, v); } catch {} },
};

/* A little Markdown, enough for the API's doc comments. */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}">${t}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(text) {
  return String(text || "").trim().split(/\n\s*\n/).map(b => {
    const lines = b.split("\n");
    if (lines.every(l => /^\s*[-*] /.test(l) || /^\s{2,}\S/.test(l))) {
      const items = []; lines.forEach(l => /^\s*[-*] /.test(l) ? items.push(l.replace(/^\s*[-*] /, "")) : items[items.length - 1] += " " + l.trim());
      return "<ul>" + items.map(i => `<li>${inline(i)}</li>`).join("") + "</ul>";
    }
    return `<p>${inline(lines.join(" "))}</p>`;
  }).join("");
}

function json(v) {

  if (typeof v === "string" && !/^\s*[{[]/.test(v)) return esc(s).replace(/^(event:.*)$/gm, '<span class="j-k">$1</span>').replace(/^(:.*)$/gm, '<span class="j-c">$1</span>');

}

/* Which of an operation's keys the snippets and recorded examples show. */
function preferredKey(o) {
  const mine = keyKind(conn.key);
  if (mine && o.keys.includes(mine)) return mine;
  return ["sk", "ak", "pk"].find(k => o.keys.includes(k)) || null;
}
function fillPath(o, values = {}) {
  return o.path.replace(/\{([^}]+)\}/g, (_, n) => values[n] || (n === "order_id" ? "order_00000000000000000000000000000001" : `{${n}}`));
}
function snippet(o, lang, st) {
  const base = conn.base.replace(/\/$/, "");
  const k = preferredKey(o);
  const key = conn.key ? conn.key.slice(0, 3) + "…" : k ? KEYS[k][0] + "…" : "";
  const url = base + fillPath(o, st.params);
  const body = o.body ? JSON.stringify(st.bodyObj ?? o.body.example ?? {}, null, 2) : null;
  const sse = o.responses.some(r => r.contentType === "text/event-stream");
  if (lang === "curl") {
    return [`curl${o.method === "GET" ? "" : " -X " + o.method}${sse ? " -N" : ""} ${url}`,
      key && !o.session ? `  -H "Authorization: Bearer ${key}"` : null,
      body ? `  -H "Content-Type: application/json"` : null,
      body ? `  -d '${body.replace(/\n/g, "\n  ")}'` : null].filter(Boolean).join(" \\\n");
  }
  if (lang === "js") {
    const h = [key && !o.session ? `    Authorization: "Bearer ${key}",` : null, body ? `    "Content-Type": "application/json",` : null].filter(Boolean);
    return `const res = await fetch("${url}", {\n  method: "${o.method}",${h.length ? `\n  headers: {\n${h.join("\n")}\n  },` : ""}${body ? `\n  body: JSON.stringify(${body.replace(/\n/g, "\n  ")}),` : ""}\n});\n${sse ? "// a text/event-stream: read res.body as it arrives\nconst reader = res.body.getReader();" : "const data = await res.json();"}`;
  }
  const u = new URL(url);
  return `${o.method} ${u.pathname}${u.search} HTTP/1.1\nHost: ${u.host}\n${key && !o.session ? `Authorization: Bearer ${key}\n` : ""}Accept: ${sse ? "text/event-stream" : "application/prs.hal-forms+json"}${body ? `\nContent-Type: application/json\n\n${body}` : ""}`;
}

  if (o.method === "DELETE") warn = "Browsers can't send DELETE to Monokulo yet: its CORS answer allows GET and POST only. Use the curl snippet, or this needs DELETE added on the server.";
  if (mine === "pk" && o.keys.includes("pk")) warn = warn || "A public key may be asked to solve a small proof of work first (429 challenge-required). The JS library does that; this console shows the 429.";

function liveHtml(o, st) {
