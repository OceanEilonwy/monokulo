# The audit's modules: features of the app, each a set of files across
# crates. `audit.py modules` gives every Rust file the first module whose
# `files` globs match it (fnmatch, so `*` crosses directories), and refuses
# to go on while any file matches none. `context` globs add files a
# reviewer should read alongside, without reviewing them there.
#
# priority: 1 = money, keys, privacy or the scanner (reviewed first),
# 2 = the app's other features, 3 = tooling and test support.

[[module]]
name = "engine-scanner"
priority = 1
description = "The engine's scanner: finding payments in blocks and the mempool, chain reorgs, settlement, scheduling and tuning of scan work."
focus = "Missed or double-counted payments, reorg handling, confirmation counting, overflow in piconero sums, races between mempool and block work, lock ordering, ScanTuning validation."
files = [
    "crates/engine/src/scanner.rs",
    "crates/engine/src/scanner_status.rs",
    "crates/engine/src/work/*",
    "crates/engine/src/store/work.rs",
    "crates/engine/src/threads.rs",
    "crates/engine/src/scaling.rs",
    "crates/engine/tests/verification/work/*",
    "crates/engine/tests/verification/scanner/*",
    "crates/engine/tests/verification/store/work_*",
    "crates/engine/tests/verification/lifecycle/*",
    "crates/engine/tests/verification/inputs/*",
    "crates/engine/tests/verification/resources/*",
]
context = ["crates/shared/src/xmr_amount.rs", "crates/shared/src/monero_tx.rs", "crates/shared/src/order_status.rs"]

[[module]]
name = "engine-daemon"
priority = 1
description = "How the engine talks to monerod: JSON-RPC, fallback between nodes, ZMQ/ZMTP notifications, proof-of-work checks."
focus = "Trusting node responses (malicious or lagging node), timeouts, fallback switching, parsing of untrusted input, ZMTP framing, PoW verification correctness."
files = [
    "crates/engine/src/daemon.rs",
    "crates/engine/src/daemon_rpc.rs",
    "crates/engine/src/daemon_fallback.rs",
    "crates/engine/src/node_events.rs",
    "crates/engine/src/zmtp.rs",
    "crates/engine/src/pow/*",
    "crates/engine/src/network.rs",
    "crates/engine/tests/daemon_rpc_replay.rs",
    "crates/engine/tests/verification/daemon/*",
    "crates/engine/tests/verification/notifications/*",
]

[[module]]
name = "engine-store"
priority = 1
description = "The engine's SQLite store: orders, order events, the dispatch queue, conflicts, migrations, backup and restore."
focus = "Transactions that should be atomic but aren't, migration safety on a live production DB, query correctness, status transitions, integer types for amounts and heights."
files = [
    "crates/engine/src/store/*",
    "crates/engine/tests/backup_restore.rs",
    "crates/engine/tests/verification/store/*",
]
context = ["crates/shared/src/sqlite.rs", "crates/shared/src/migrations.rs"]

[[module]]
name = "engine-proof"
priority = 1
description = "Payment proofs: anchoring and verifying that an order was paid."
