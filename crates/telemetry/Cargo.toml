[package]
name = "telemetry"
version = "0.1.0"
edition = "2021"
description = "Structured logging for monokulo, the engine and the key-custody server: one tracing subscriber, redacted output, level changes without a restart"

[features]
# Request spans for axum servers (`telemetry::http`).
axum = ["dep:axum"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["matched-path", "tokio"], optional = true }
live-settings = { path = "../live-settings" }
# Trace and span ids (OpenTelemetry's data model), so a request can be
# followed across monokulo, the engine, the plugin and the browser.
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace"] }
# OTLP export (`telemetry::otlp`): the protocol's messages, encoded with
# prost and POSTed with reqwest (OTLP/HTTP, protobuf).
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
prost = "0.14"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
parking_lot = "0.12.5"
# The local log store (`logs.db`).
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# Timestamps on JSON lines (RFC 3339, UTC).
time = { version = "0.3.55", features = ["formatting"] }
# The expiry timer for development mode.
tokio = { version = "1.53.1", features = ["time", "rt", "sync"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "registry"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["matched-path", "tokio", "http1"] }
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.53.1", features = ["time", "rt", "macros", "test-util", "net"] }
