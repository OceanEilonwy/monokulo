[package]
name = "key-custody-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# WBS 2.1.2: the client (`client.rs`) needs a real async runtime with Unix-socket
# support - `scanner` itself already depends on `tokio = { features =
# ["full"] }`, so pulling in anything narrower here would just be a second,
# slightly different feature set to keep in sync for no real benefit; "full" is
# what the rest of this workspace already standardizes on.
async-trait = "0.1.92"
hex = "0.4.3"
monero = "0.22.0"
serde = { version = "1.0.229", features = ["derive"] }
# WBS 2.1.1 kept this as a dev-dependency only, since nothing in src/lib.rs
# actually serialized anything for real yet - only that crate's own round-trip
# tests did. WBS 2.1.2 is exactly the "something actually sends bytes over a
# socket" step that comment anticipated: `protocol.rs`'s frame encoding and
# `client.rs` both serialize/deserialize the envelope types for real, so this is
# now a real dependency, not a test-only one.
serde_json = "1.0.151"
# For the real KeyCustody/WalletHandle/WalletMaterial/KeyCustodyError/MatchedOutput/
# SubaddressIndex types this crate's DTOs convert to/from, and the
# network_str/parse_network helpers `NetworkWire` reuses. A path dependency, not a
# reimplementation, exactly as the WBS's own framing for this crate says - but
# `shared`, not `scanner`, as of WBS 2.1.3: this crate's `client.rs`
# (`SocketKeyCustody`) is exactly what `scanner`'s own `main.rs` needs to
# depend on this crate *for*, and `scanner` depending on a crate that itself
# depends on `scanner` is a real Cargo dependency cycle - see
# `shared/src/key_custody.rs`'s module doc comment for the full account of why the
# trait and its domain types moved to `shared` for this step. The server side
# (`server.rs`, wrapping a real `scanner::key_custody::PlainKeyCustody`)
# moved to the new sibling `key-custody-server` crate, which still depends on
# `scanner` directly - there was no way around that, since `PlainKeyCustody`
# only exists there.
shared = { path = "../shared" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
zeroize = { version = "1.9.0", features = ["derive"] }
