[package]
name = "engine-protocol"
version.workspace = true
repository.workspace = true
edition = "2021"
description = "What the engine and monokulo exchange over the engine's admin API and /status: ids, networks, order statuses, scanner activity and the status report's parts"

[features]
# JSON Schemas for ids and order statuses, for monokulo's API (`monokulo::api`).
schemars = ["dep:schemars"]
# `CustodyBackend` as a choice setting, for the engine's settings.
live-settings = ["dep:live-settings"]
# The admin API's and `/status`'s bodies (`admin_api`), for the engine and
# monokulo's client; not needed by what only names ids or backends.
admin-api = ["dep:serde_json", "dep:service-runtime"]

[dependencies]
live-settings = { path = "../live-settings", optional = true }
monero = "0.22.0"
# Ids and network names are stored as TEXT (`ToSql`/`FromSql`).
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
# A key bundle, passed on as it is (`admin_api::KeyBundleResponse`).
serde_json = { version = "1.0.151", optional = true }
# The engine's resource report in `/status`.
service-runtime = { path = "../service-runtime", optional = true }
thiserror = "2.0.20"

[lints]
workspace = true
