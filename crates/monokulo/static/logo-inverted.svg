<circle cx="13.5" cy="10.5" r="2.25" fill="none" stroke="#f4f1ea" stroke-width="2.25"/>

<line x1="39.3" y1="39.3" x2="56" y2="56" stroke="#f4f1ea" stroke-width="6" stroke-linecap="round"/>

