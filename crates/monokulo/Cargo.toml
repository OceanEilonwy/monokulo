[package]
name = "monokulo"
version.workspace = true
repository.workspace = true
edition = "2021"

[features]
# `http::AppState::for_tests`, `db::Db::seed_test_admin`, `http::test_support`
# and the API reference's recording (`api::runtime::recording`), for other
# crates' tests and this crate's own integration tests and examples; with
# them `abuse::challenge::solve`, the browser's proof of work, and
# `tor_service::Tor::running_at`, a Tor handle with nothing running.
# Enabled only from [dev-dependencies] (resolver 2 keeps it out of every
# normal build), never in production.
test-support = ["abuse/test-support", "tor-service/test-support", "sqlite/test-support", "credentials/test-support", "service-runtime/test-support", "embedded-engine", "dep:jsonschema"]
default = ["embedded-engine", "tor"]
# The engine's own router as a transport for `EngineClient`: the engine
# runs inside monokulo's process.
# Without it the client only reaches an engine over HTTP.
embedded-engine = ["dep:engine", "dep:tower", "dep:http-body-util"]
# The embedded engine's `snp` key custody backend (the engine's `snp`
# feature), and in a test build the test engine's stand-in for it. Off by
# default; every test build turns it on (`--features monokulo/snp`).
snp = ["engine?/snp", "engine-test-support/snp"]
# Tor inside monokulo (`tor_service`, `tor.mode = inside`): Arti, the Rust
# Tor, serves the onion service from this process. Without it only an
# external tor can serve one.
tor = ["tor-service/arti"]

[dependencies]
engine = { path = "../engine", optional = true }
# The shared UI components (crates/ui): rendered here, translated for the POS.
ui = { path = "../ui" }
# `ServiceExt::oneshot` and body collection, to call the embedded engine's
# router in-process.
tower = { version = "0.5.3", features = ["util"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
bytes = "1.12.1"
zeroize = "1.9.0"
parking_lot = "0.12.5"
aes-gcm = "0.11.1"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-routing"] }
# The machine API (`api`): each resource is a file the macros turn into
# its route, auth check, HAL-FORMS links and forms and catalog entry
# (`linkme` gathers them); its schemas (`schemars`) are the OpenAPI
# document's and its forms', and its scalars check their values (`regex`).
api-macros = { path = "../api-macros" }
# reference.json, as the docs build reads it.
api-reference = { path = "../api-reference" }
linkme = "0.3.37"
schemars = "1.2.3"
regex = "1"
hex = "0.4.3"
maud = { version = "0.27.0", features = ["axum"] }
monero = "0.22.0"
# The checkout's QR code (`crate::qr`), drawn as SVG.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
reqwest-middleware = { version = "0.5.2", features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# What the engine sends, with JSON Schemas for ids and order statuses for
# the API reference (`api`).
engine-protocol = { path = "../engine-protocol", features = ["admin-api", "schemars"] }
# The engine page's state machine and history (`engine_relay`, `http::engine_page`).
engine-view = { path = "../engine-view" }
sqlite = { path = "../sqlite" }
credentials = { path = "../credentials" }
service-runtime = { path = "../service-runtime" }
rate-limit = { path = "../rate-limit" }
# XMR amounts and the exchange-rate providers orders are priced with.
pricing = { path = "../pricing" }
# Web Push to connected apps (`crate::push`): their subscriptions, checked
# where they're registered, and this instance's VAPID key.
push = { path = "../push" }
# Reads a verified domain's TXT records (`embed_domains::LiveDns`).
dns-client = { path = "../dns-client" }
# Constant-time comparison of a presented store secret key (`http::store_key`).
subtle = "2.6.1"
# Who a request is from, its limits, challenges and the onion listener;
# `http::abuse` is their HTTP side.
abuse = { path = "../abuse" }
# The machine API's cached responses' ETags (`api::runtime::hal`).
sha2 = "0.11.0"
# Tor for visitors: Tor inside monokulo (with the `tor` feature), the
# server both onion paths share, and onion address checks.
tor-service = { path = "../tor-service" }
rand = "0.10.2"
thiserror = "2.0.20"
time = "0.3.55"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body = "1.1.0"
tower-http = { version = "0.7.1", features = ["cors"] }
tokio = { version = "1.53.1", features = ["full"] }
# One cancellation token per credential (`revocation`).
tokio-util = "0.7.20"
url = "2.5.8"
live-settings = { path = "../live-settings" }
telemetry = { path = "../telemetry", features = ["axum"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4"] }
serde_urlencoded = "0.7"
# The time zone database is built in, so time zones work (and tests pass)
# on a host without tzdata installed.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
clap = "4.6.7"
# The key entry policy: parsing and comparing which engine images are
# trusted with merchants' keys (`settings::SnpEntryPolicy`).
key-custody = { path = "../key-custody", default-features = false }
# Every shortened identifier's text (`views::short_id`).
short-id = { path = "../short-id" }
# Checks each recorded answer against the OpenAPI document
# (`api::runtime::recording`), with `test-support` only.
jsonschema = { version = "0.33.0", default-features = false, optional = true }
# Every file the pages link, baked in and named by its content (`assets`).
static-assets = { path = "../static-assets" }

[build-dependencies]
# Not used by the build script's own code: it builds this crate for
# WebAssembly with a separate, offline `cargo build`, and naming it here makes
# Cargo fetch everything that build needs first.
key-custody = { path = "../key-custody", default-features = false, features = ["wasm"] }
wallet-setup = { path = "../wallet-setup", features = ["wasm"] }
# Reads the pages' build's manifest (`web/preloads.rs`).
serde_json = "1.0.151"

[dev-dependencies]
# Unpack the static files' baked compressed copies (`crate::assets` tests).
brotli = "7.0.0"
flate2 = "1.1.10"
# Every `/api/v1` response the tests see is checked against the OpenAPI
# document (`api::runtime::openapi`).
jsonschema = { version = "0.33.0", default-features = false }
# Turns on `test-support` for this crate's own integration tests and examples.
monokulo = { path = ".", features = ["test-support"] }
# Signs a webhook delivery the way a shop's receiver checks it
# (`webhooks` tests).
hmac = "0.13.0"
# A node or engine that can't be reached (`service_runtime::unreachable`).
service-runtime = { path = "../service-runtime", features = ["test-support"] }
# The test engine token.
credentials = { path = "../credentials", features = ["test-support"] }
# Proven blocks, to give an embedded engine's store a proof history
# (`http::admin_settings` tests).
engine-pow = { path = "../engine-pow" }
# The in-thread database pool (`db::Db` in tests).
sqlite = { path = "../sqlite", features = ["test-support"] }
engine-test-support = { path = "../engine-test-support" }
# Paused time (`test-util`): a test watching the engine page for a minute
# runs in an instant.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
http-body-util = "0.1.5"
engine = { path = "../engine" }
tower = { version = "0.5.3", features = ["util"] }
# Makes a wallet in the tests the way the "Create a new wallet" page does.
wallet-setup = { path = "../wallet-setup" }
# The real-Tor e2e test (`tests/e2e_tor.rs`) connects through tor's SocksPort,
# one set of SOCKS credentials per simulated visitor.
tokio-socks = "0.5"

[lints]
workspace = true
