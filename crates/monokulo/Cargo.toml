[package]
name = "monokulo"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
hex = "0.4.3"
maud = { version = "0.27.0", features = ["axum"] }
monero = "0.22.0"
# `http::checkout`'s QR code rendering (`docs/fx_refactor.md` Phase 2.1) -
# same version/feature set the scanner's own (soon-removed) equivalent uses.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
reqwest-middleware = { version = "0.5.2", features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared = { path = "../shared" }
# Constant-time comparison of a presented store secret key (`http::store_key`).
subtle = "2.6.1"
# Abuse protection (`crate::abuse`): HMAC-signed challenges, proof-of-work
# checks and a per-process random signing key.
hmac = "0.13.0"
sha2 = "0.11.0"
rand = "0.10.2"
thiserror = "2.0.20"
time = "0.3.55"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
hickory-resolver = "0.26.3"

[dev-dependencies]
scanner-test-support = { path = "../scanner-test-support" }
http-body-util = "0.1.5"
scanner = { path = "../scanner" }
tower = { version = "0.5.3", features = ["util"] }
# The real-Tor e2e test (`tests/e2e_tor.rs`) connects through tor's SocksPort,
# one set of SOCKS credentials per simulated visitor.
tokio-socks = "0.5"
