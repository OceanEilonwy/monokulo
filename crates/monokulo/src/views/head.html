<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
/* Manrope, self-hosted (`http::pay::manrope_*_woff2`) - not a Google Fonts
   `<link>`, deliberately: that CDN sees every visitor's IP on every page
   load, checkout included, which is the wrong tradeoff for a privacy-
   focused payment tool (same reasoning `client_library`'s own doc comment
   gives for shipping the embed JS from this binary instead of a CDN).
   Latin-only, matching this UI's own text. */
@font-face {
  font-family: "Manrope";
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url("/static/manrope-500.woff2") format("woff2");
}
@font-face {
  font-family: "Manrope";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("/static/manrope-700.woff2") format("woff2");
}
@font-face {
  font-family: "Manrope";
  font-style: normal;
  font-weight: 800;
  font-display: swap;
  src: url("/static/manrope-800.woff2") format("woff2");
}

/* Shared look for every monokulo page (registered as the "styles"
   partial - see templates.rs). Monero-rooted but no longer brutalist:
   black & orange identity, Manrope, light and accessible, corners and
   spacing nudged toward welcoming without losing the compact/utilitarian
   feel. Tokens (color, spacing, radius, shadow, type) are the single
   source of truth - every rule below reaches for one of these custom
   properties rather than a literal value, so the whole site retunes from
   here. Values were produced and contrast-audited (WCAG AA: 4.5:1 text,
   3:1 UI) in the interactive design-language tool, not picked by eye -
   see that artifact for the light/dark audit this palette passed.
   No third-party request of any kind, font included - see the
   `@font-face` block above's own doc comment for why that isn't the usual
   "no external dependency" default this note used to say a Google Fonts
   `<link>` was, but an intentional self-hosting call. */
:root {
  --ink: #111111;
  --paper: #f4f1ea;
  --paper-raised: #ffffff;
  --line: #111111;
  --accent: #ff6600;
  --accent-ink: #111111;
  --brand-orange: #ff6600;
  /* `--chrome-bg`/`--chrome-ink`: the nav bar, table headers and primary
     buttons deliberately invert (dark bar, light text) as this site's
     black & orange identity - previously that inversion literally
     reused `--ink`/`--paper`, which is correct in light mode (`--ink` is
     black) but backfires in dark mode, where `--ink` flips to a near-white
     text color: the "black" nav bar/table header/button silently became a
     solid near-white one - the exact "blinding chunk of white in a dark
     theme" bug this pair exists to fix. `--chrome-bg`/`--chrome-ink` are
     fixed (not redefined in the dark-mode blocks below) precisely so this
     chrome stays a dark bar with light text in both themes. */
  --chrome-bg: #111111;
  --chrome-ink: #f4f1ea;
  --error: #b00020;
  /* `--error-ink`/`--warning-ink`: unlike `--accent-ink` (always #111111 -
     `--accent` stays the same bright orange in both modes), `--error` and
     `--warning` FLIP lightness between modes (dark red/olive in light
     mode, light red/amber in dark mode) - so whatever reads as legible
     text on top of a solid error/warning surface (e.g. a pressed key)
     must flip with them, not stay fixed white. */
  --error-ink: #ffffff;
  --success: #1a7f37;
  --warning: #7d5e00;
  --warning-ink: #ffffff;
  --muted: #5a564c;
  --pos-frame: #e3ddcd;
  /* A fixed, mode-independent shadow tint (not `--ink`, which flips to
     near-white in dark mode - a shadow must stay dark regardless of the
     surface it's cast on). `r, g, b` (no `rgb()` wrapper) so callers can
     compose it with their own alpha: `rgba(var(--shadow-rgb), 0.28)`. */
  --shadow-rgb: 17, 17, 17;

  /* Semantic tints - derived from the tokens above via `color-mix`, never
     a separate hardcoded hex, so a status color and its soft background
     can never drift out of sync, and both retune automatically if the
     base token ever changes. Percentages were chosen so ink-on-tint always
     clears 4.5:1 (used for plain tag/status backgrounds) and so a colored
     label directly on its own error/warning tint also clears 4.5:1 (used
     by `.expiry-pill`) - `--tint-success` is NOT contrast-safe for
     success-colored text on top of it (mixing success into white doesn't
     move far enough for that specific pairing) and nothing here does that;
     if a future component wants success-colored text, put it on
     `--paper-raised` instead, not `--tint-success`. */
  --tint-success: color-mix(in srgb, var(--success) 14%, var(--paper-raised));
  --tint-error: color-mix(in srgb, var(--error) 14%, var(--paper-raised));
  --tint-warning: color-mix(in srgb, var(--warning) 14%, var(--paper-raised));
  --tint-neutral: color-mix(in srgb, var(--muted) 12%, var(--paper-raised));
  --tint-highlight: color-mix(in srgb, var(--brand-orange) 20%, var(--paper-raised));

  /* Shape scale - Monero classic, tuned: Manrope, 1x density, 10%
     roundedness, 0% elevation. `--space-*` and `--radius-*` are absolute
     px (not em) so component chrome (buttons, boxes, controls) keeps one
     consistent rhythm regardless of the text size inside it; typographic
     margins (heading spacing, paragraph rhythm) stay in em/rem on purpose
     - those scale with their own font-size, which is correct there and
     wouldn't be if forced onto this scale. At 0% elevation every shadow
     below resolves to a fully transparent, zero-offset shadow (no floor),
     so "flat" really means flat rather than a faint shadow nobody asked
     for - see the design tool's own audit notes for why that matters. */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --radius-sm: 5px;
  --radius-md: 9px;
  --radius-lg: 16px;
  --shadow-ambient-y: 0px;
  --shadow-ambient-blur: 0px;
  --shadow-ambient: rgba(17, 17, 17, 0);

  --font-ui: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

  color-scheme: light dark;
}
/* Dark - OS preference, unless the page's own toggle already said light.
   Every dark value here is its own contrast-audited pick, not an inverted
   formula (the light `--error`, for one, is only 2.2:1 on the dark
   surface - failing outright - so nothing here is derived from its light
   counterpart). Shape/type tokens are unchanged - only color differs
   between modes.
   Deliberately NOT near-black/near-white (an earlier pass used `--paper:
   #1b1815`/`--ink: #f1ece2`, close enough to true black/white that at
   night it read as harsh, and - combined with the `--chrome-bg`/`--ink`
   mixup fixed above - produced solid glare-white chunks): retuned to a
   softer, neutral VS Code "Dark+"-like scale (editor/panel grays, a
   muted mid-gray foreground instead of near-white) so both the base
   surface and body text sit closer to the middle of the brightness range
   a screen shown at night should stay in. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #d4d4d4;
    --paper: #1e1e1e;
    --paper-raised: #2a2a2a;
    --line: #454545;
    --accent: #ff6600;
    --accent-ink: #111111;
    --brand-orange: #ff6600;
    --error: #ff6b6b;
    --error-ink: #111111;
    --success: #4cc27a;
    --warning: #e0a83d;
    --warning-ink: #111111;
    --muted: #9d9d9d;
    --pos-frame: #262626;
  }
}
/* Dark - the page's own toggle (`data-theme="dark"` on `<html>`), wins
   over OS preference either way. No such toggle exists yet - this is
   here so adding one later is a one-line change, not a new stylesheet. */
:root[data-theme="dark"] {
  --ink: #d4d4d4;
  --paper: #1e1e1e;
  --paper-raised: #2a2a2a;
  --line: #454545;
  --accent: #ff6600;
  --accent-ink: #111111;
  --brand-orange: #ff6600;
  --error: #ff6b6b;
  --error-ink: #111111;
  --success: #4cc27a;
  --warning: #e0a83d;
  --warning-ink: #111111;
  --muted: #9d9d9d;
  --pos-frame: #262626;
}

* { box-sizing: border-box; }
/* Minimal reset for form controls - browsers (and this file's own later,
   more specific `button, .btn` rule) give buttons/inputs/etc. their own
   default margin/font, which silently leaks into any context that isn't
   "a standalone block-level control with space below it" - e.g. a
   <button> reused as an inline nav link (`.nav-link-button` in
   `_nav.html.hbs`) inheriting a form button's `margin-top` and sitting
   visibly out of line with its sibling <a> tags. Reset the baseline here;
   components that genuinely want spacing (the real `button, .btn` rule
   below) declare it themselves, deliberately, rather than relying on a
   default nothing else was meant to inherit. */
button, input, textarea, select { margin: 0; font: inherit; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
}
body { padding-bottom: 4rem; }
a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; }
a:hover { color: var(--accent); }
h1, h2, h3 { font-weight: 700; letter-spacing: -0.01em; margin: 1.4em 0 0.6em; }
h1 { font-size: 1.6rem; border-bottom: 3px solid var(--line); padding-bottom: 0.3em; }
h2 { font-size: 1.15rem; border-bottom: 1px solid var(--line); padding-bottom: 0.2em; }
p { margin: 0.6em 0; }
/* Code/addresses/txids stay monospace regardless of the UI font choice -
   a legibility need (character-width alignment, telling 0/O and 1/l/I
   apart), not a style preference `--font-ui` should override. */
code, pre {
  font-family: var(--font-mono);
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 0.1em 0.35em;
}
pre { padding: var(--space-md); overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 1.2rem; }
.error {
  border: 2px solid var(--error);
  border-radius: var(--radius-md);
  color: var(--error);
  padding: var(--space-sm) var(--space-md);
  font-weight: 700;
  margin: 1em 0;
}
.success {
  border: 2px solid var(--success);
  border-radius: var(--radius-md);
  color: var(--success);
  padding: var(--space-sm) var(--space-md);
  font-weight: 700;
  margin: 1em 0;
}
.hint { color: var(--muted); font-size: 0.9em; }
/* The one-time "just deleted" row an admin table shows right after a real
   delete (`admin_invites.html.hbs`) - struck through and faded so it reads
   as gone-but-still-visible-for-confirmation, not a live row. */
.row-deleted td { opacity: 0.45; text-decoration: line-through; }
.hero { display: flex; align-items: flex-start; gap: 1rem; margin-top: 1.2rem; }
.hero-logo { flex: none; margin-top: 0.3rem; }
.hero h1 { margin-top: 0; }
@media (max-width: 560px) {
  .hero { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
}
.box {
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-raised);
  padding: var(--space-xl);
  margin: 1.2rem 0;
  box-shadow: 0 var(--shadow-ambient-y) var(--shadow-ambient-blur) var(--shadow-ambient);
}
.box + .box { margin-top: 1.2rem; }
table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
th, td { border: 1px solid var(--line); padding: var(--space-xs) var(--space-sm); text-align: left; vertical-align: top; }
/* A code/pre value inside a table cell (an address, a txid) shouldn't carry
   its own box on top of the cell's own border - the cell border is enough. */
td code, td pre, th code, th pre { background: none; border: none; padding: 0; }
th { background: var(--chrome-bg); color: var(--chrome-ink); font-weight: 700; }
/* `color-mix` with `transparent`, not a flat `rgba(0,0,0,...)`: a literal
   black tint darkens a light surface but is imperceptible on a dark one.
   Mixing a sliver of `--ink` itself means the stripe darkens in light mode
   (ink is near-black) and lightens in dark mode (ink is near-white) from
   the same rule. */
tr:nth-child(even) td { background: color-mix(in srgb, var(--ink) 5%, transparent); }
/* Truncates long inline content (e.g. a public key in a list table) with an
   ellipsis, without letting it force its containing table wider than its
   own header row. Purely visual: CSS truncation never removes the full text
   from the DOM/accessibility tree, so the browser's own native find-in-page
   (see `tr:has(::target-text)` below) still matches against every character
   that's actually there, ellipsised or not. */
.ellipsis {
  display: inline-block;
  max-width: 16em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
}
/* Highlights the whole row containing a native browser find-in-page match
   (Ctrl+F / Cmd+F) - no JS. `::target-text` is the pseudo-element the
   browser itself paints over a find match; `:has()` lets a plain selector
   react to an arbitrary descendant existing, reaching up from the matched
   text to the row around it. `@supports selector(...)` makes this a no-op,
   not a parse error, in a browser that doesn't understand
   `:has(::target-text)` yet. */
@supports selector(:has(::target-text)) {
  tr:has(::target-text) { background: var(--tint-highlight); }
}
form label { display: block; margin: 0.9em 0 0.6em; font-weight: 700; }
form .field-help { display: block; font-weight: 400; color: var(--muted); margin-top: 0.15em; font-size: 0.88em; }
/* A small "?" affordance next to a checkbox/label needing a longer
   explanation than fits inline - the native `title` attribute supplies the
   actual tooltip text, so this needs no JS to be useful. */
.help-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.1em;
  height: 1.1em;
  margin-left: 0.35em;
  border: 1px solid var(--muted);
  border-radius: 50%;
  color: var(--muted);
  font-size: 0.78em;
  font-weight: 700;
  line-height: 1;
  cursor: help;
  vertical-align: middle;
  user-select: none;
}
/* `.setting-source` (admin settings page): a caption naming where a field's
   current value came from. Left inline, it lets a submit `button` that
   immediately follows the last field in a form (e.g. "Save scanner
   settings") ride up onto the same line as this caption instead of
   starting its own line below the form - block, like `.field-help` above,
   fixes that regardless of how much room is left on the line. */
.setting-source { display: block; margin-top: 0.15em; }
input[type=text], input[type=email], input[type=password], input[type=url], select, textarea {
  width: 100%;
  font-family: inherit;
  font-size: 1em;
  padding: var(--space-sm) var(--space-md);
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper-raised);
  color: var(--ink);
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--accent); outline-offset: 0; }
/* `margin-right`: two `.btn`/`button` elements written as separate Maud
   markup expressions (e.g. the landing page's "Sign up" + "Log in") render
   with no whitespace text node between them - unlike a hand-written .hbs
   template's literal newline/indentation, Maud never inserts one - so an
   explicit horizontal gap is the only thing keeping adjacent buttons from
   touching. */
button, .btn {
  display: inline-block;
  font-family: inherit;
  font-size: 1em;
  font-weight: 700;
  background: var(--chrome-bg);
  color: var(--chrome-ink);
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  padding: var(--space-sm) var(--space-lg);
  cursor: pointer;
  text-decoration: none;
  margin-top: 0.9em;
  margin-right: var(--space-md);
}
button:hover, .btn:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-secondary { background: var(--paper-raised); color: var(--ink); }
.btn-secondary:hover { background: var(--accent); color: var(--accent-ink); }
/* Store-detail "widget" launchers (POS terminal, create-order) - a row of
   tappable tiles above the Recent orders table, each opening its own
   full-screen tool page rather than an inline form on this page. */
.widget-links { display: flex; flex-wrap: wrap; gap: var(--space-md); margin: 1em 0 1.4em; }
.widget-link {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.7em;
  min-width: 11em;
  margin: 0;
  padding: var(--space-md) var(--space-lg);
  text-align: left;
}
.widget-link-icon { flex: none; display: flex; }
.widget-link-icon svg { width: 1.7em; height: 1.7em; }
.widget-link-text { display: flex; flex-direction: column; gap: 0.2em; }
.widget-link-title { font-weight: 700; }
.widget-link-hint { font-weight: 400; font-size: 0.82em; opacity: 0.85; }
/* Confirmation-thresholds table, Default row: the 0-conf checkbox sits on
   its own line below the confirmations count, rather than the whole
   "Zero-confirmation payments" section this used to be. */
.zero-conf-toggle { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3em; font-weight: 400; margin-top: 0.5em; }
/* The confirmations-required count never needs more than 720's own 3
   digits (`scanner::http::admin::MAX_CONFIRMATIONS_REQUIRED`) - overrides
   the site-wide `input[type=text] { width: 100% }` default, which would
   otherwise stretch it to the full cell. */
.thresholds-table .confirmations-input { width: 4.5em; }
/* A visible gap + rule between the existing rows and the add-a-threshold
   row, whose own last cell also carries this form's one Save button. */
.thresholds-table .new-threshold-row td { padding-top: 1.2em; border-top: 2px solid var(--line); }
.thresholds-table .new-threshold-row button { margin: 0; }
.tag {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 0.05em 0.5em;
  font-size: 0.8em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.tag-ok { background: var(--tint-success); }
.tag-error { background: var(--tint-error); }
.tag-unknown { background: var(--tint-neutral); }
.tag-syncing { background: var(--accent); color: var(--accent-ink); }
.tag-stalled { background: var(--tint-warning); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.rule { border: none; border-top: 2px dashed var(--line); margin: 1.6em 0; }
.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin: 1.2rem 0; }
@media (max-width: 640px) { .pick-grid { grid-template-columns: 1fr; } }
.pick-card {
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-raised);
  padding: var(--space-xl);
  box-shadow: 0 var(--shadow-ambient-y) var(--shadow-ambient-blur) var(--shadow-ambient);
}
.pick-card h3 { margin-top: 0; }
.steps { padding-left: 1.4em; }
.steps li { margin: 0.5em 0; }
/* Store overview page: the health/help disclosure and the "Settings" link
   sit on the same row, the latter pinned to the right - the settings page
   is reached "via a link next to the Help button" rather than a nav item. */
/* `.settings-link` comes first in both DOM order and visual order (flex
   row, no wrap) - `flex: none` keeps it a fixed-size box entirely
   independent of `.help-disclosure`'s own height, so it stays put exactly
   where it is whether that `<details>` is open or closed. */
/* A "store name › Settings" breadcrumb heading (settings page only) - the
   first segment is a real link back to the store page. */
.breadcrumb-header { display: flex; align-items: baseline; gap: 0.5em; flex-wrap: wrap; }
.breadcrumb-header a { color: inherit; }
.breadcrumb-sep { color: var(--muted); font-weight: 400; }
.store-header-row { display: flex; align-items: flex-start; gap: 1em; flex-wrap: nowrap; }
.store-header-row .settings-link { flex: none; margin-top: 0.3em; }
.store-header-row .help-disclosure { flex: 1 1 auto; min-width: 0; }
.help-disclosure { margin: 0.6em 0 1.2em; }
.help-disclosure summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1em;
  cursor: pointer;
  list-style: none;
  padding: 0.3em 0;
}
.help-disclosure summary::-webkit-details-marker { display: none; }
.help-disclosure summary .hint { text-decoration: underline; white-space: nowrap; }
.help-disclosure[open] summary .hint::after { content: " \25B4"; }
.help-disclosure:not([open]) summary .hint::after { content: " \25BE"; }
/* Nav bar - a semantic <nav>/<label>/checkbox structure rather than pure
   inline styles, so the small-screen hamburger below (a plain CSS checkbox
   toggle - no JS involved in showing/hiding the menu itself) has real
   selectors to work with. Above the breakpoint this all just renders as a
   normal flex row; the checkbox/label stay hidden and irrelevant. */
.site-nav { background: var(--chrome-bg); color: var(--chrome-ink); border-bottom: 3px solid var(--accent); }
.site-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 0.7rem;
  padding-bottom: 0.7rem;
  flex-wrap: wrap;
  position: relative;
}
.site-nav-brand { color: var(--chrome-ink); text-decoration: none; font-weight: 700; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 0.45em; }
.site-nav-logo { display: block; }
.site-nav-links { display: flex; align-items: center; flex-wrap: wrap; }
.site-nav-links a, .site-nav-links .nav-link-button {
  color: var(--chrome-ink);
  margin: 0 0 0 1.2em;
  background: none;
  border: none;
  font: inherit;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  text-decoration-thickness: 1px;
}
.site-nav-links .nav-logout-form, .site-nav-links .nav-theme-form { margin: 0; display: inline; }
.nav-status-link { text-decoration: none !important; }
.nav-status-text { text-decoration: underline; }
/* Visually hidden but still readable by assistive tech - used by the theme
   toggle below, whose visible content is icons/a thumb, not text. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
/* The theme control - a day/night slider, not the plain text button every
   other nav item is. Still just a `<button type="submit">` in a `<form>`
   (see `views::theme_toggle`'s own doc comment) - three real states
   (System/Light/Dark) don't fit a literal on/off switch, so the thumb
   parks left/center/right per `.theme-toggle-{state}` below, sun at the
   light end and moon at the dark end. */
.theme-toggle {
  margin: 0 0 0 1.2em;
  padding: 0;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--paper-raised);
  cursor: pointer;
  line-height: 0;
}
.theme-toggle:hover { border-color: var(--accent); }
.theme-toggle-track {
  position: relative;
  display: flex;
