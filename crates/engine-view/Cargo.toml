[package]
name = "engine-view"
version.workspace = true
repository.workspace = true
edition = "2021"
description = "The engine page's data: a pure state machine from the engine's scanner activity to what the page shows, and a network's history of it"

[dependencies]
engine-protocol = { path = "../engine-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
# The history reads the clock through tokio's `Instant`, so a test with
# paused time moves it on.
tokio = { version = "1.53.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util"] }
# The app's fixtures (`apps/engine/test/fixtures.json`) are written as JSON.
serde_json = "1.0.151"

[lints]
workspace = true
