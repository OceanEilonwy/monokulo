[package]
name = "e2e-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Real-stagenet end-to-end tests and the POS browser suite's backend: a real engine and a real monokulo driven together"

# Moved here from the engine crate (docs/engine_as_library.md, phase 2):
# these drive the engine and monokulo together, so they need both, and
# monokulo now depends on the engine (its `embedded-engine` feature). Kept
# in the engine they would make a dependency cycle.
#
# Everything is behind the `e2e` feature, every dependency included: built
# without it, this crate builds nothing, and the `test-support` features it
# turns on in the engine and monokulo can't reach a `cargo build --workspace`
# through feature unification.

[features]
e2e = [
    "dep:engine",
    "dep:monokulo",
    "dep:cli-wallet",
    "dep:shared",
    "dep:axum",
    "dep:http-body-util",
    "dep:monero",
    "dep:parking_lot",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tower",
    "dep:hex",
    "engine/test-support",
    "monokulo/test-support",
    "shared/test-support",
]

[dependencies]
engine = { path = "../engine", optional = true }
monokulo = { path = "../monokulo", optional = true }
# The fast, reliable stagenet test wallet the e2e tests and the harness use
# to sign and broadcast real payments (see its own crate doc comment).
cli-wallet = { path = "../cli-wallet", optional = true }
shared = { path = "../shared", optional = true }
# Defaults less `tower-log` (see crates/engine/Cargo.toml).
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tracing", "macros"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
monero = { version = "0.22.0", optional = true }
parking_lot = { version = "0.12.5", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
hex = { version = "0.4.3", optional = true }

# The real backend half of the POS screen's real stagenet and browser e2e
# suite (`e2e/pos-playwright/`, driven by Playwright, not `cargo test`): a
# real engine, a real monokulo, account and store provisioning, and the
# background scan loop, in one process (see src/main.rs). A `[[bin]]` rather
# than an ignored test so Playwright can start, find and stop it at a
# predictable `target/debug/e2e-harness`.
[[bin]]
name = "e2e-harness"
path = "src/main.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_stagenet"
path = "tests/e2e_stagenet.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_dashboard_stagenet"
path = "tests/e2e_dashboard_stagenet.rs"
required-features = ["e2e"]

[lints]
workspace = true
