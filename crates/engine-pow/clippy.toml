# A failing test should panic: unwrap, expect, indexing and panic are what
# tests use to say so. The restriction lints against them apply to the rest.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
# Time is read from a `clock::Clock` passed in, so a test can say what time
# it is (crates/clock). Monotonic time is `tokio::time::Instant`, which a
# paused tokio test controls. This file replaces the workspace's
# `clippy.toml` for this crate, so the same refusals are repeated here.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "read the time from a clock::Clock passed in (crates/clock)" },
    { path = "std::time::Instant::now", reason = "use tokio::time::Instant, which paused test time controls" },
]
