[package]
name = "credentials"
version.workspace = true
repository.workspace = true
edition = "2021"
description = "Secrets monokulo and the engine hand out and check: store keys and the engine token, account passwords and webhook signatures"

[features]
# The engine token every test engine and test client uses
# (`auth::TEST_ENGINE_TOKEN`). Enabled only from other crates'
# [dev-dependencies] and test features (resolver 2 keeps it out of every
# normal build), never in production.
test-support = []

[dependencies]
argon2 = "0.5"
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.2"
# argon2's password-hash re-export needs rand_core's `OsRng`, which is behind
# rand_core's own "getrandom" feature. Declared explicitly here (rather than
# relying on another workspace member's dependency graph enabling it via
# Cargo's feature unification during a workspace-wide build) so `cargo test
# -p credentials` builds correctly in isolation, not just as part of `--workspace`.
rand_core = { version = "0.6", features = ["getrandom"] }
# Token hashes are stored as TEXT (`ToSql`/`FromSql`).
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
subtle = "2.6.1"
# The IPv4 address inside an IPv6 one (`telemetry::redact::embedded_ipv4`),
# for the webhook URL check.
telemetry = { path = "../telemetry" }
# `password`: hashing runs off the async runtime's threads (`spawn_blocking`).
tokio = { version = "1.53.1", features = ["full"] }

[lints]
workspace = true
