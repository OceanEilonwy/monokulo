[package]
name = "scanner-test-support"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
# WBS 2.1.3: lets a spawned test engine be configured to use `SocketKeyCustody`
# instead of the default in-process `PlainKeyCustody` - see
# `TestEngineConfig::with_socket_key_custody`. A normal (not dev) dependency
# because `TestEngineConfig::spawn` itself (real library code, not `#[cfg(test)]`)
# needs to construct one; no cycle, since `key-custody-service` depends only on
# `shared`, never on `scanner` or this crate - see
# `shared/src/key_custody.rs`'s module doc comment.
key-custody-service = { path = "../key-custody-service" }
monero = "0.22.0"
scanner = { path = "../scanner" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
# Only this crate's own regression test (WBS 2.1.3's acceptance bar: order
# creation + chain scanning must behave identically through the socket-based
# `KeyCustody` path) needs to actually run a `KeyCustodyServer` - everything else
# in this crate only ever dials one via `key-custody-service`'s client.
key-custody-server = { path = "../key-custody-server" }
# For that same test's fixture transaction (`tests/fixtures/subaddress_tx.hex`,
# shared with `src/key_custody/plain.rs`'s, `src/scanner.rs`'s, and
# `key-custody-service`'s own test suites - not a fresh fixture invented here).
hex = "0.4.3"
