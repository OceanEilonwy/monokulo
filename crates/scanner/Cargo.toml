[package]
name = "scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
handlebars = "6.4.4"
hex = "0.4.3"
hmac = "0.13.0"
# Reads response bodies (`.collect().await.to_bytes()`) - both this crate's own
# `src/http/tests.rs` (a plain, always-run lib test, hence unconditional here
# rather than dev-only/feature-gated) and, later in this file, the `e2e`-gated
# `pos-e2e-server` binary's real signup/login/connect setup calls.
http-body-util = "0.1.5"
# WBS 2.1.3: `main.rs` needs `SocketKeyCustody` to wire the `[key_custody]
# backend = "socket"]` config option to a real out-of-process `KeyCustody`. This
# is the one direction of that split's dependency graph that's actually allowed -
# `key-custody-service` depends on `shared`, never on `scanner` (see
# `shared/src/key_custody.rs`'s module doc comment for why the trait itself moved
# there: `key-custody-service` depending on `scanner` while
# `scanner` depended on `key-custody-service` back is a real Cargo cycle,
# confirmed directly, not a style preference). The server side
# (`key-custody-server`, wrapping a real `PlainKeyCustody`) is deliberately not a
# dependency of this crate at all - nothing here constructs a `KeyCustodyServer`
# or runs the standalone binary; that stays a separate process this crate only
# ever dials as a client.
key-custody-service = { path = "../key-custody-service" }
monero = "0.22.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shared = { path = "../shared" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit", "cors"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = { version = "1.9.0", features = ["derive"] }

# e2e-feature-only: constructs, signs, and broadcasts a real Monero transaction
# directly against a daemon's plain RPC, so the e2e test (tests/e2e_stagenet.rs)
# and mock-woocommerce's own real-stagenet connect-flow test need nothing beyond
# the public stagenet node itself - no external wallet-rpc process. Optional +
# feature-gated (see `[features]` below) so a normal build never links this in.
# monero-wallet is the actively-maintained successor to the "monero-serai"
# transaction-construction library (real CLSAG + Bulletproofs+ implementation
# over curve25519-dalek, used by the Serai project); it pins rand_core 0.6 (the
# RngCore/CryptoRng traits its signing functions require), one major version
# behind this crate's own `rand = "0.10"` - hence the separate `rand_core`
# dependency below rather than reusing `rand`'s.
#
# monero-daemon-rpc (not monero-simple-request-rpc) supplies the RPC client type:
# its `HttpTransport` is a single-method trait `src/e2e_wallet.rs` implements
# directly over this crate's own `reqwest::Client`, rather than pulling in a
# second, unused TLS stack (`simple-request`/`hyper-rustls`/`ring`) purely to
# reach a plain http:// node - `monero-simple-request-rpc` was tried first and
# dropped for exactly this reason.
monero-wallet = { version = "0.2.0", optional = true }
monero-daemon-rpc = { version = "0.2.0", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
# Required directly: monero_ed25519::Scalar/Point implement no arithmetic
# operators of their own (only #[doc(hidden)] from/into bridges to this crate),
# so the basepoint-multiplication and key-image glue in src/e2e_wallet.rs has
# no way to avoid it. Not pinned to an exact patch - Cargo unifies semver-compatible
# versions with monero-wallet's own copy regardless, so pinning only risks a
# resolution failure if monero-wallet later requires a newer 4.x.
curve25519-dalek = { version = "4", default-features = false, features = ["precomputed-tables", "zeroize"], optional = true }

# e2e-feature-only, moved out of [dev-dependencies]: `[[bin]]` targets (unlike
# `tests/*.rs`) only ever see a package's normal [dependencies], never its
# [dev-dependencies] - see `src/bin/pos_e2e_server.rs`/`pos_e2e_send_payment.rs`'s
# own doc comments for why these two bins exist. `monokulo` depends only on
# `shared` (never on this crate), so this edge (`scanner` -> `monokulo`)
# creates no cycle; `monokulo`'s own [dev-dependencies] (which do pull in
# `scanner-test-support -> scanner`) are never built along it - Cargo only
# ever builds a path dependency's [dependencies], never its own
# [dev-dependencies], when it's depended on as a library by another crate.
# Still reaches `tests/e2e_dashboard_stagenet.rs` too - an integration test
# sees both its package's [dependencies] and [dev-dependencies].
monokulo = { path = "../monokulo", optional = true }
# The fast/reliable stagenet test wallet `src/bin/pos_e2e_server.rs`/
# `pos_e2e_send_payment.rs` now use instead of `e2e_wallet` directly - see
# `stagenet-test-wallet`'s own crate doc comment for why. `tests/e2e_stagenet.rs`/
# `tests/e2e_dashboard_stagenet.rs` are untouched, still on `e2e_wallet`
# directly - migrating them is a natural, low-risk follow-up (same
# interface shape) but out of scope for this change.
stagenet-test-wallet = { path = "../stagenet-test-wallet", optional = true }

[features]
# Real-spend-wallet support for the e2e test(s) and the two POS e2e helper
# binaries below. Never enabled by default - keeping the crypto/transaction-
# construction dependencies (and the extra `monokulo` needed to drive a whole
# hosted stack) out of the tree for a normal `cargo build`/`cargo test
# --workspace` is the point.
e2e = ["dep:monero-wallet", "dep:monero-daemon-rpc", "dep:rand_core", "dep:curve25519-dalek", "dep:monokulo", "dep:stagenet-test-wallet"]

[[test]]
name = "e2e_stagenet"
path = "tests/e2e_stagenet.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_dashboard_stagenet"
path = "tests/e2e_dashboard_stagenet.rs"
required-features = ["e2e"]

# The two halves of the POS screen's own real stagenet+browser e2e suite
# (`e2e/pos-playwright/`, driven by Playwright, not `cargo test`) - see that
# directory's own README for how they're actually run together. Real `[[bin]]`
# targets rather than more `#[ignore]`d `#[tokio::test]`s (like the two above)
# specifically so an external process (Playwright, over Node's
# `child_process`) can spawn/discover/kill each one directly by a predictable
# `target/debug/<name>` path, rather than needing to locate `cargo test`'s own
# hash-suffixed test binary or manage a `cargo test` process tree.
[[bin]]
name = "pos-e2e-server"
path = "src/bin/pos_e2e_server.rs"
required-features = ["e2e"]

[[bin]]
name = "pos-e2e-send-payment"
path = "src/bin/pos_e2e_send_payment.rs"
required-features = ["e2e"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
