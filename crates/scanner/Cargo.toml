[package]
name = "scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
handlebars = "6.4.4"
hex = "0.4.3"
hmac = "0.13.0"
# Reads response bodies (`.collect().await.to_bytes()`) - both this crate's own
# `src/http/tests.rs` (a plain, always-run lib test, hence unconditional here
# rather than dev-only/feature-gated) and, later in this file, the `e2e`-gated
# `e2e-harness` binary's real signup/login/connect setup calls.
http-body-util = "0.1.5"
# WBS 2.1.3: `main.rs` needs `SocketKeyCustody` to wire the `[key_custody]
# backend = "socket"]` config option to a real out-of-process `KeyCustody`. This
# is the one direction of that split's dependency graph that's actually allowed -
# `key-custody-service` depends on `shared`, never on `scanner` (see
# `shared/src/key_custody.rs`'s module doc comment for why the trait itself moved
# there: `key-custody-service` depending on `scanner` while
# `scanner` depended on `key-custody-service` back is a real Cargo cycle,
# confirmed directly, not a style preference). The server side
# (`key-custody-server`, wrapping a real `PlainKeyCustody`) is deliberately not a
# dependency of this crate at all - nothing here constructs a `KeyCustodyServer`
# or runs the standalone binary; that stays a separate process this crate only
# ever dials as a client.
key-custody-service = { path = "../key-custody-service" }
monero = "0.22.0"
# `RpcDaemonClient::get_blocks_range`'s real `get_blocks.bin` batching (see
# `daemon_rpc.rs`'s own doc comment) - a small, standalone epee-binary-protocol
# decoder, not the whole `monero-daemon-rpc` client this workspace already uses
# in `cli-wallet` (that crate's own `Transaction`/`Block` types come from
# `monero-oxide`, a different Monero crate family from the `monero` 0.22.0
# (monero-rs) types this crate decodes everything else into - reusing its
# client would mean converting between two independent type systems for every
# call). `monero-epee` decodes the wire format only; this file still turns the
# resulting raw transaction blobs into `monero::Transaction` the same way
# every other daemon call already does (`monero::consensus::encode::deserialize`).
monero-epee = "0.2.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shared = { path = "../shared" }
thiserror = "2.0.20"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = { version = "1.9.0", features = ["derive"] }

# e2e-feature-only, moved out of [dev-dependencies]: a `[[bin]]` target (unlike
# `tests/*.rs`) only ever sees a package's normal [dependencies], never its
# [dev-dependencies] - see `src/bin/e2e_harness.rs`'s own doc comment for why
# it's a `[[bin]]` at all. `monokulo` depends only on `shared` (never on this
# crate), so this edge (`scanner` -> `monokulo`) creates no cycle; `monokulo`'s
# own [dev-dependencies] (which do pull in `scanner-test-support -> scanner`)
# are never built along it - Cargo only ever builds a path dependency's
# [dependencies], never its own [dev-dependencies], when it's depended on as a
# library by another crate. Still reaches `tests/e2e_dashboard_stagenet.rs`
# too - an integration test sees both its package's [dependencies] and
# [dev-dependencies].
monokulo = { path = "../monokulo", optional = true }
# The fast/reliable stagenet test wallet every real e2e test/binary in this
# crate uses to sign and broadcast real payments - see `cli-wallet`'s
# own crate doc comment for why it's a separate, narrower wallet from a
# general-purpose one. This crate no longer needs the real transaction-
# construction dependencies (`monero-wallet`/`monero-daemon-rpc`/`rand_core`/
# `curve25519-dalek`) directly at all - they moved to `cli-wallet`'s
# own Cargo.toml along with the wallet code that used them.
cli-wallet = { path = "../cli-wallet", optional = true }

[features]
# Real-spend-wallet support for the e2e tests and the POS e2e harness binary
# below. Never enabled by default - keeping `cli-wallet`'s own real
# transaction-construction dependencies (and the extra `monokulo` needed to
# drive a whole hosted stack) out of the tree for a normal `cargo build`/
# `cargo test --workspace` is the point.
e2e = ["dep:monokulo", "dep:cli-wallet"]

[[test]]
name = "e2e_stagenet"
path = "tests/e2e_stagenet.rs"
required-features = ["e2e"]

[[test]]
name = "e2e_dashboard_stagenet"
path = "tests/e2e_dashboard_stagenet.rs"
required-features = ["e2e"]

# The real backend half of the POS screen's own real stagenet+browser e2e
# suite (`e2e/pos-playwright/`, driven by Playwright, not `cargo test`) -
# see that directory's own README for how it's actually run, and
# `src/bin/e2e_harness.rs`'s own module doc comment for everything this one
# process is actually responsible for (it's not just a wallet bridge - a
# real engine, a real monokulo, account/store provisioning, and the
# background scan loop all live here too). A real `[[bin]]` rather than
# another `#[ignore]`d `#[tokio::test]` (like the two above) specifically so
# an external process (Playwright, over Node's `child_process`) can
# spawn/discover/kill it directly by a predictable `target/debug/<name>`
# path, rather than needing to locate `cargo test`'s own hash-suffixed test
# binary or manage a `cargo test` process tree.
[[bin]]
name = "e2e-harness"
path = "src/bin/e2e_harness.rs"
required-features = ["e2e"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
