[package]
name = "mock-woocommerce"
version.workspace = true
repository.workspace = true
edition = "2021"

[dependencies]
parking_lot = "0.12.5"
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "cookies", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The webhook receiver verifies `X-Monokulo-Signature` with
# `credentials::webhook_sign::verify_signature`, the same code monokulo signs with.
credentials = { path = "../credentials" }
# The clock the signature timestamps are checked against.
service-runtime = { path = "../service-runtime" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

# The tests start a real, network-bound engine (engine-test-support) and a
# real monokulo (its `http::AppState`/`build_router`) to connect to.
[dev-dependencies]
engine = { path = "../engine" }
monokulo = { path = "../monokulo", features = ["test-support"] }
engine-test-support = { path = "../engine-test-support" }
# The ids the real-stagenet tests look the connection and order up by.
engine-protocol = { path = "../engine-protocol" }
monero = "0.22.0"
# The real-stagenet tests hex-encode the sent transaction's hash.
hex = "0.4.3"
# The real-stagenet tests' wallet: the fast, no-scanning, cached-decoys
# wallet that sends the real payment.
cli-wallet = { path = "../cli-wallet" }

[features]
# Builds the real-stagenet tests, which need a live stagenet node and funded
# test wallets. Never on by default.
e2e = []

# A real stagenet connect flow, order, payment, scan and signed webhook.
[[test]]
name = "e2e_stagenet_connect_flow"
path = "tests/e2e_stagenet_connect_flow.rs"
required-features = ["e2e"]

# A real order against a real stagenet store resolves and enforces a
# non-default confirmations_required from a custom threshold.
[[test]]
name = "e2e_stagenet_confirmation_threshold"
path = "tests/e2e_stagenet_confirmation_threshold.rs"
required-features = ["e2e"]

[lints]
workspace = true
