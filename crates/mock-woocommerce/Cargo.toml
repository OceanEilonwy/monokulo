[package]
name = "mock-woocommerce"
version = "0.1.0"
edition = "2021"

[dependencies]
# Kept from WBS 0.1 - not directly used by this task's own code, but left in
# place rather than ripped out; a later WBS task (1.4.3, order creation) is
# expected to want it.
scanner = { path = "../scanner" }
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "cookies", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The real webhook receiver route (WBS 1.4.4) verifies `X-MoneroPay-Signature`
# via `shared::webhook_sign::verify_signature` - this is Rust calling Rust, so
# there is no reason to reimplement HMAC verification here the way a future PHP
# plugin (WBS 1.5.4) will have to. Plain library dependency, no circularity:
# `shared` does not depend on `mock-woocommerce`.
shared = { path = "../shared" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

# Test-only: lets mock-woocommerce's own integration tests start a real,
# network-bound scanner instance (scanner-test-support) and a
# real, network-bound monokulo instance (monokulo's own
# http::AppState/build_router, constructed directly here since no shared
# monokulo-test-support crate exists yet - see this crate's own test
# harness in src/lib.rs). Dev-dependencies only - never linked into a normal
# build.
[dev-dependencies]
monokulo = { path = "../monokulo" }
scanner-test-support = { path = "../scanner-test-support" }
monero = "0.22.0"
# WBS 1.4.5's real stagenet connect-flow test only (hex-encodes the sent
# transaction's hash for logging/persisting to e2e/stagenet-wallets.json) -
# same version scanner itself already pins.
hex = "0.4.3"

[features]
# Mirrors scanner's own `e2e` feature exactly (see the root Cargo.toml's
# `[features]` for the full reasoning) - turning this on pulls in the real
# transaction-construction dependencies transitively through scanner, so
# WBS 1.4.5's real stagenet connect-flow test (tests/e2e_stagenet_connect_flow.rs)
# can use `scanner::e2e_wallet::StagenetSpendWallet`. Never enabled by
# default - a plain `cargo test --workspace`/`cargo test -p mock-woocommerce` must
# not link this in.
e2e = ["scanner/e2e"]

[[test]]
name = "e2e_stagenet_connect_flow"
path = "tests/e2e_stagenet_connect_flow.rs"
required-features = ["e2e"]

# Confirmation Thresholds feature (WBS): a real order against a real
# stagenet-connected store resolves and enforces a non-default
# confirmations_required from a custom threshold - see that file's own doc
# comment.
[[test]]
name = "e2e_stagenet_confirmation_threshold"
path = "tests/e2e_stagenet_confirmation_threshold.rs"
required-features = ["e2e"]
