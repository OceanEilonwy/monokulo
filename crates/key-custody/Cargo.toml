[package]
name = "key-custody"
version.workspace = true
repository.workspace = true
edition = "2021"

# Where stores' private view keys live: the `KeyCustody` boundary, the
# backends behind it and the router that holds them, and the transport that
# gets keys to a backend encrypted. See src/lib.rs.
[lib]
# `cdylib` for the browser's WebAssembly module (feature `wasm`).
crate-type = ["rlib", "cdylib"]

[features]
default = ["backends", "snp"]
# The boundary and the `plain` backend (and the router).
backends = [
    "dep:async-trait",
    "dep:monero",
    "dep:parking_lot",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
]
# The `snp` backend: sealing with the security processor's derived key,
# `/dev/sev-guest` and AMD's key distribution service. The engine turns it
# on only with its own `snp` feature.
snp = [
    "backends",
    "dep:aes-gcm",
    "dep:hmac",
    "dep:reqwest",
    "snp-attest/guest",
    "snp-attest/kds",
]
# The browser's exports (`src/wasm.rs`), built without `backends` for
# `wasm32-unknown-unknown`.
wasm = ["dep:short-id"]

[dependencies]
# Transport: what `key-custody-cli` and the browser need too.
getrandom = "0.4"
hex = "0.4.3"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "aes", "getrandom"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
snp-attest = { path = "../snp-attest", default-features = false }
# The measurement shortened for the browser, as the site shortens ids.
short-id = { path = "../short-id", optional = true }
thiserror = "2.0.20"
zeroize = { version = "1.9.0", features = ["derive"] }

# Backends.
aes-gcm = { version = "0.11.1", optional = true }
async-trait = { version = "0.1.92", optional = true }
hmac = { version = "0.13.0", optional = true }
monero = { version = "0.22.0", optional = true }
parking_lot = { version = "0.12.5", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync", "time"], optional = true }
tracing = { version = "0.1.44", optional = true }
uuid = { version = "1.26.0", features = ["v4"], optional = true }

[dev-dependencies]
# Generated custody histories; the strategies drive the real backends.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
futures-util = "0.3"
snp-attest = { path = "../snp-attest", default-features = false, features = ["test-support"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
# Captures log events in tests that assert a failure was reported.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }

[lints]
workspace = true
