[package]
name = "ui"
version.workspace = true
repository.workspace = true
edition = "2021"
publish = false

# The shared UI components, written once, with their CSS and behaviour:
# one package, this crate and the npm package @monokulo/ui (package.json,
# web/, solid/). Monokulo's views and the pages site render the components
# through maud; `cargo xtask ui` translates the same definitions into the
# Solid components the POS imports (solid/) and the stylebook's examples.

[dependencies]
maud = "0.27.0"
serde_json = "1"
ui-macros = { path = "../ui-macros" }
# The stylesheets, baked with their compressed copies (`assets`).
static-assets = { path = "../static-assets" }

[lints]
workspace = true
