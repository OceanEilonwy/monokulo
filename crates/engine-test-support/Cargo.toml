[package]
name = "engine-test-support"
version.workspace = true
repository.workspace = true
edition = "2021"

[dependencies]
telemetry = { path = "../telemetry" }
live-settings = { path = "../live-settings" }
parking_lot = "0.12.5"
async-trait = "0.1.92"
# Defaults less `tower-log` (see crates/engine/Cargo.toml).
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tracing", "macros"] }
# The snp backend on a stand-in security processor (`with_snp_backend`).
snp-attest = { path = "../snp-attest", features = ["test-support"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
monero = "0.22.0"
engine = { path = "../engine", features = ["test-support", "snp"] }
shared = { path = "../shared" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
# The id of a transaction a stand-in node holds.
hex = "0.4.3"
# Optional test logging (`init_test_logging`, MONOKULO_TEST_LOG).
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }

[lints]
workspace = true
