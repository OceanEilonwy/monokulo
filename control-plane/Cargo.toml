[package]
name = "control-plane"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
handlebars = "6.4.4"
hex = "0.4.3"
# `http::checkout`'s QR code rendering (`docs/fx_refactor.md` Phase 2.1) -
# same version/feature set the engine's own (soon-removed) equivalent uses.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
reqwest-middleware = { version = "0.5.2", features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared = { path = "../shared" }
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
engine-test-support = { path = "../engine-test-support" }
http-body-util = "0.1.5"
monero = "0.22.0"
tower = { version = "0.5.3", features = ["util"] }
