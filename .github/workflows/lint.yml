name: lint

# Formatting, clippy (every warning an error), the checks that keep test
# code out of what ships, and the OpenAPI document written as a plugin or
# app writes it. Called by checks.yml (pull requests) and
# release.yml (main, version tags).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy, every feature
        # Clippy's lints are denied in Cargo.toml; -D warnings adds the
        # compiler's own. Every feature, so the e2e and fuzzing targets
        # (built only with them) are checked too.
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy, engine without its optional features
        # The code an engine built without zmq or snp has in their place
        # (refusing settings that need them), which no test build compiles.
        run: cargo clippy -p engine --all-targets --locked --no-default-features -- -D warnings
      - name: Clippy, engine-pow as production builds it
        # Its library alone, without the test-support stand-in hasher and
        # test chains: every test build turns them on, through the
        # engine's dev-dependency.
        run: cargo clippy -p engine-pow --lib --locked -- -D warnings
      - name: Clippy, engine-daemon as production builds it
        # Its library alone, without the test-support scripted node: every
        # test build turns it on, through the engine's dev-dependency.
        run: cargo clippy -p engine-daemon --lib --locked -- -D warnings
      - name: Clippy, push on stable, as the Monokular Bell builds it
        # The Bell (another repository, on stable Rust) takes the push crate
        # as a git dependency, so nothing nightly-only may reach it: this
        # repository's own builds, all on nightly, wouldn't notice. Its
        # library alone too, without the test-support decryption that test
        # builds of the crates using it turn on.
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          cargo +stable clippy -p push --all-targets --locked -- -D warnings
          cargo +stable clippy -p push --lib --locked -- -D warnings
      - name: Fuzz workspace's lock file is current
        # fuzz/ is its own workspace, so the clippy run above never sees
        # its Cargo.lock; the nightly fuzz job builds it with --locked.
        run: cargo metadata --format-version 1 --locked --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Check test-support only adds code
        # A feature that only tests turn on may add helpers, never change
        # what shipped code does: test builds (the browser suites' real
        # binaries among them) must run what merchants run. Replacing
        # behaviour needs a `cfg(not(... "test-support" ...))` for the
        # production side, so there must be none.
        run: |
          if grep -rnE --include='*.rs' 'not\([^)]*"test-support"' crates xtask fuzz; then
            echo '::error::test-support may only add code; the lines above replace shipped behaviour under it.'
            exit 1
          fi

  openapi:
    name: openapi document
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev
          save: 'false'
      - name: Write the OpenAPI document with recorded examples
        run: cargo xtask api openapi --out target/openapi.json
