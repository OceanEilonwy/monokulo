# The OpenWrt packages: monokulo (the engine inside it) and its LuCI page in
# one signed .apk, and a signed apk repository holding it, for each OpenWrt
# release and CPU architecture in the build matrix below (today one: 25.12 on
# the GL.iNet Flint 2, mediatek/filogic, aarch64_cortex-a53). The build is
# scripts/build-openwrt.sh; the landing page with install instructions is
# built by pages.yml.
#
# release.yml runs it on main and version tags, after every test passed; a
# pull request runs it only when it changes the package itself. Each matrix
# entry builds and uploads as artifacts
#   monokulo-openwrt-<release>-<arch>   the .apk, the repository index
#                                       (packages.adb), the public key
#                                       (monokulo.pem) and SHA256SUMS
#   openwrt-repo-<release>-<arch>       the signed apk repository (the .apk
#                                       and packages.adb)
# On main, release.yml's Pages job publishes that run's openwrt-repo-* artifacts
# (pages.yml, which lays out the site); routers use it as their package
# repository (Settings > Pages > Source: GitHub Actions).
#
# Needs the repository secret APK_SIGNING_KEY: the private key matching
# openwrt/keys/monokulo.pem (the same key signs kringle). Pull requests from
# forks (no secret access) still build, with a throwaway key, but nothing
# they build is deployed.

name: openwrt package

on:
  pull_request:
    paths:
      - 'openwrt/**'
      - 'scripts/build-openwrt.sh'
      - '.github/workflows/openwrt.yml'
  workflow_call:
  workflow_dispatch:

# A newer push to the same pull request replaces its run still going.
concurrency:
  group: openwrt-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # One build per OpenWrt release and CPU architecture. A release or
    # architecture is supported by adding an entry here: the site lists
    # every openwrt-repo-* artifact, and its dropdown offers each one.
    name: build the openwrt package (${{ matrix.release }}, ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The GL.iNet Flint 2 (mediatek/filogic).
          - release: '25.12'
            arch: aarch64_cortex-a53
            sdk_image: openwrt/sdk:mediatek-filogic-25.12.5
            rust_target: aarch64-unknown-linux-musl
            toolchain_prefix: aarch64-openwrt-linux-musl
    env:
      SDK_IMAGE: ${{ matrix.sdk_image }}
      OPENWRT_ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
      TOOLCHAIN_PREFIX: ${{ matrix.toolchain_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The package's release number is the commit count.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: openwrt-${{ matrix.release }}-${{ matrix.arch }}
      - name: Build the package and repository
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          SDK_VOLUME: "" # fresh runner every time, no point keeping SDK state
        run: |
          if [ -z "$APK_SIGNING_KEY" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::Set the APK_SIGNING_KEY secret; routers won't trust a package signed with a throwaway key."
            exit 1
          fi
          scripts/build-openwrt.sh
      - name: Summary
        env:
          SIGNED: ${{ secrets.APK_SIGNING_KEY != '' }}
        run: |
          {
            echo "## OpenWrt package (${{ matrix.release }}, ${{ matrix.arch }})"
            echo
            echo "| File | Size |"
            echo "| --- | ---: |"
            for f in dist/*.apk dist/packages.adb dist/monokulo.pem; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            if [ "$SIGNED" = true ]; then
              echo "Signed with the key in \`openwrt/keys/monokulo.pem\`."
            else
              echo "Signed with a **throwaway key**: for testing only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: monokulo-openwrt-${{ matrix.release }}-${{ matrix.arch }}
          path: |
            dist/*.apk
            dist/packages.adb
            dist/monokulo.pem
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: openwrt-repo-${{ matrix.release }}-${{ matrix.arch }}
          path: dist/repo/
          if-no-files-found: error
          # Every Pages deploy republishes the newest from a Release run on
          # main that passed, so it must outlast the gap between them.
          retention-days: 90
