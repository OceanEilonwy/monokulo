# The GitHub Pages site:
#   /           the landing page (`cargo xtask pages landing`; xtask/src/pages/landing/)
#               and the signed apk repository (the OpenWrt workflow's
#               openwrt-repo artifact)
#   /testing/   the coverage report (`cargo xtask pages build`): tests,
#               coverage, screenshots, property tests, fuzzing, scale and the
#               live-network tests
#   /docs/      the guides for adding Monokulo to a site (`cargo xtask
#               pages docs`, from xtask/src/pages/docs/), and the Geomart sample shop
#   /stylebook/ the ui components' stylebook (`npm run build -w @monokulo/stylebook`,
#               apps/stylebook), from this checkout
#
# The site is in parts, each made by one workflow on main, which deploys the
# whole site when it finishes (Pages serves a single deployment):
#   release     release.yml, once every test passed: the landing page and
#               apk repository, tests, coverage, screenshots and the one-CPU
#               stress run, all from that run, on the commit it tested
#   properties  the engine property exploration, every 6 hours
#   fuzz        the engine fuzz exploration, every 6 hours
#   scale       the weekly engine scale measurements
#   live        the daily live-network tests (live-network.yml)
# The calling workflow names its part: that part comes from its own run, and
# every other part from that part's newest run on main, which is what the
# live site already shows. Each page names the run and commit it is from.
#
# A manual run (Actions > pages > Run workflow) rebuilds the site from every
# part's newest run on main. If the release part's artifacts have expired
# (90 days without a release run on main), the build stops rather than take
# the package repository offline: run the release workflow on main.

name: pages

on:
  workflow_call:
    inputs:
      part:
        description: The part this run made - release, properties, fuzz, scale or live
        required: true
        type: string
      conclusion:
        description: How the part's run went (success or failure), shown beside it
        type: string
        default: success
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: build and deploy the site
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One build and deployment at a time, in the order they started: a newer
    # one waits rather than cancelling one already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # Builds only xtask, which the Rust tests job's cache holds; the npm
      # dependencies are for the ui islands script the site's pages load.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev
          save: 'false'
      # The artifacts land under target/, which the checkout ignores.
      - name: Download each part's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ inputs.part }}
          CONCLUSION: ${{ inputs.conclusion }}
        run: |
          args=(target/pages)
          if test -n "$PART"; then args+=(--current "$PART" --conclusion "$CONCLUSION"); fi
          cargo xtask pages fetch "${args[@]}"
      # The install page for the apk repository the artifact holds.
      - name: Build the landing page beside the apk repository
        run: cargo xtask pages landing --site target/pages/site --github-url "https://github.com/$GITHUB_REPOSITORY"
      - name: Build the coverage report beside the landing page
        run: |
          args=(--out target/pages/site/testing --sources target/pages/sources.json --github-url "https://github.com/$GITHUB_REPOSITORY")
          for source in coverage properties fuzz scale live; do
            if test -d "target/pages/$source"; then args+=("--$source" "target/pages/$source"); fi
          done
          cargo xtask pages build "${args[@]}"
      # The guides for adding Monokulo to a site, from xtask/src/pages/docs/ in this
      # checkout, with the Geomart sample shop under /docs/geomart/.
      - name: Build the docs beside the landing page
        run: cargo xtask pages docs --out target/pages/site/docs
      # Every ui component, in both themes, from apps/stylebook in this
      # checkout. Its asset links are relative (base './'), and its typeface
      # is the site's shared assets/ copy, which the landing page wrote.
      - name: Build the stylebook beside the landing page
        env:
          STYLEBOOK_SITE_ASSETS: ${{ github.workspace }}/target/pages/site/assets
        run: npm run build -w @monokulo/stylebook -- --outDir "$GITHUB_WORKSPACE/target/pages/site/stylebook" --emptyOutDir
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages/site/
      - id: deployment
        uses: actions/deploy-pages@v5
