# The GitHub Pages site:
#   /           the landing page and the signed apk repository (the OpenWrt
#               package's site artifact)
#   /quality/   the quality report (`cargo xtask pages build`): tests,
#               coverage, screenshots, property tests, fuzzing, scale and the
#               live-network tests
#   /docs/      the guides for adding Monokulo to a site (`cargo xtask
#               pages docs`, from docs/site/), and the Geomart sample shop
#
# The site is in parts, each made by one workflow on main, which deploys the
# whole site when it finishes (Pages serves a single deployment):
#   release     release.yml, once every test passed: the landing page and
#               apk repository, tests, coverage, screenshots and the one-CPU
#               stress run, all from that run, on the commit it tested
#   properties  the nightly engine property exploration
#   fuzz        the nightly engine fuzz exploration
#   scale       the weekly engine scale measurements
#   live        the daily live-network tests (live-network.yml)
# The calling workflow names its part: that part comes from its own run, and
# every other part from that part's newest run on main, which is what the
# live site already shows. Each page names the run and commit it is from.
#
# A manual run (Actions > Pages > Run workflow) rebuilds the site from every
# part's newest run on main. If the release part's artifacts have expired
# (90 days without a release run on main), the build stops rather than take
# the package repository offline: run the Release workflow on main.

name: Pages

on:
  workflow_call:
    inputs:
      part:
        description: The part this run made - release, properties, fuzz, scale or live
        required: true
        type: string
      conclusion:
        description: How the part's run went (success or failure), shown beside it
        type: string
        default: success
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build and deploy the site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One build and deployment at a time, in the order they started: a newer
    # one waits rather than cancelling one already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          pos-app: 'false'
      # The artifacts land under target/, which the checkout ignores.
      - name: Download each part's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ inputs.part }}
          CONCLUSION: ${{ inputs.conclusion }}
        run: |
          args=(target/pages)
          if test -n "$PART"; then args+=(--current "$PART" --conclusion "$CONCLUSION"); fi
          cargo xtask pages fetch "${args[@]}"
      - name: Build the quality report beside the landing page
        run: |
          args=(--out target/pages/site/quality --sources target/pages/sources.json --repo-url "https://github.com/$GITHUB_REPOSITORY")
          for source in coverage properties fuzz scale live; do
            if test -d "target/pages/$source"; then args+=("--$source" "target/pages/$source"); fi
          done
          cargo xtask pages build "${args[@]}"
      # The guides for adding Monokulo to a site, from docs/site/ in this
      # checkout, with the Geomart sample shop under /docs/geomart/.
      - name: Build the docs beside the landing page
        run: cargo xtask pages docs --out target/pages/site/docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages/site/
      - id: deployment
        uses: actions/deploy-pages@v5
