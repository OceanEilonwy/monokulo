name: Engine fuzz exploration

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing seconds per target (excluding build)
        type: choice
        options: ['60', '300', '900']
        default: '300'

permissions:
  contents: read

jobs:
  tooling:
    uses: ./.github/workflows/engine-verification-tooling.yml

  fuzz:
    needs: tooling
    name: fuzz ${{ matrix.target }} (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [scheduler, resources, inputs, queue, mempool, status, history, notifications, portfolio]
        features: ['']
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-02
      ENGINE_FUZZ_SEED: ${{ github.run_id }}
      FUZZ_SECONDS: ${{ inputs.seconds || '' }}
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-02
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          key: fuzz-${{ matrix.features }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore the saved corpus
        # From the ci/fuzz branch, which save-corpus adds every run's finds to.
        run: .github/scripts/restore-fuzz-corpus.sh "$FUZZ_TARGET"
      - name: Record replay settings
        run: |
          echo "Target: $FUZZ_TARGET; features: ${FUZZ_FEATURES:-default}; seed: $ENGINE_FUZZ_SEED; budget: ${FUZZ_SECONDS:-target-default}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Explore
        run: cargo xtask engine fuzz "$FUZZ_TARGET" "$FUZZ_SECONDS" "$FUZZ_FEATURES"
      - name: Preserve corpus, failures and seeds
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-fuzz-${{ matrix.target }}-${{ matrix.features || 'default' }}-${{ github.run_id }}
          path: |
            fuzz/corpus/
            fuzz/artifacts/
            fuzz/seeds/
            target/engine-exploration/
          if-no-files-found: ignore

  interleavings:
    name: exhaustive serialized effect orders (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ['']
    steps:
      - uses: actions/checkout@v7
      # A plain test build, unlike the fuzz targets' instrumented release
      # one, so it starts from the Rust tests job's cache (platform.yml):
      # building into the main workspace's target directory reuses the
      # dependencies that job built.
      - uses: ./.github/actions/setup-rust
        with:
          components: rust-src
          shared-key: dev
          save: 'false'
          pos-app: 'false'
      - name: Enumerate serialized completion orders
        env:
          FUZZ_FEATURES: ${{ matrix.features }}
        run: cargo test --manifest-path fuzz/Cargo.toml --target-dir target --locked --features "$FUZZ_FEATURES" --test interleavings

  save-corpus:
    # One job writes ci/fuzz, so the nine targets don't race each other.
    name: Save the corpus to ci/fuzz
    needs: fuzz
    if: always() && github.ref == 'refs/heads/main' && needs.fuzz.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-fuzz-*
          path: ${{ runner.temp }}/fuzz-artifacts
      - run: .github/scripts/save-fuzz-corpus.sh "$RUNNER_TEMP/fuzz-artifacts"

  crash-seeds:
    # A crash is a bug; a draft PR carries its reproducer to main as a seed.
    name: Propose crashing inputs as seeds
    needs: fuzz
    if: always() && github.ref == 'refs/heads/main' && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-fuzz-*
          path: ${{ runner.temp }}/fuzz-artifacts
      - run: .github/scripts/propose-fuzz-crashes.sh "$RUNNER_TEMP/fuzz-artifacts"
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    # This run's fuzz page, with every other part of the site as it is
    # live (pages.yml). On main only; a run that didn't finish shows nothing
    # new.
    name: Pages
    needs: fuzz
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success", "failure"]'), needs.fuzz.result)
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      part: fuzz
      conclusion: ${{ needs.fuzz.result }}
