name: Checks

# What a pull request must pass: lint, and every Linux test suite, without
# coverage (release.yml collects it on main, and tests macOS and Windows).
# A manual run (Actions > Checks > Run workflow) can test any branch on
# other platforms, or with coverage.
#
# Required checks: lint / rustfmt and clippy, and tests (linux) / Summary.

on:
  # Every PR, including documentation changes: path-filtered workflows would
  # leave required checks pending forever.
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: The platforms to test on, a JSON list of linux, macos and windows
        type: string
        default: '["linux"]'
      coverage:
        description: Collect coverage on Linux and check the report, as main does
        type: boolean
        default: false

# A newer push to the same pull request replaces its run still going.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    uses: ./.github/workflows/lint.yml

  # One entry per platform asked for (Linux for a pull request), so a
  # pull request's checks list only what runs.
  tests:
    name: tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms || '["linux"]') }}
    uses: ./.github/workflows/tests.yml
    with:
      platform: ${{ matrix.platform }}
      coverage: ${{ inputs.coverage == true && matrix.platform == 'linux' }}
