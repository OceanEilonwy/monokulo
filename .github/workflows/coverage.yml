name: Coverage and UI evidence

on:
  push:
    paths:
      - 'crates/**'
      - 'plugins/woocommerce/**'
      - 'e2e/**'
      - 'scripts/coverage*'
      - 'xtask/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'plugins/woocommerce/**'
      - 'e2e/**'
      - 'scripts/coverage*'
      - 'xtask/**'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/pos-playwright/package-lock.json
      - name: Install browser and POS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          npm ci --prefix e2e/pos-playwright
          npm install --prefix crates/monokulo/pos-ui --no-audit --no-fund
          cd e2e/pos-playwright
          npx playwright install --with-deps chromium
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          # Matches the wp-env test container (`phpVersion` in
          # plugins/woocommerce/.wp-env*.json) and composer.json's platform
          # pin, so the lock file always suits the PHP the tests run on.
          php-version: '8.5'
          tools: composer:v2
      - name: Install WooCommerce test dependencies
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=5000
        run: |
          composer install --working-dir=plugins/woocommerce --no-interaction --prefer-dist
          npm install --global @wordpress/env@latest
          cd plugins/woocommerce
          wp-env start --config=.wp-env.coverage.json
      - name: Collect deterministic coverage
        id: collect
        continue-on-error: true
        run: cargo xtask coverage all
      - name: Print component summary
        if: always()
        run: python3 scripts/coverage-job-summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload offline coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: target/coverage/
          # When setup fails before collection there is nothing to upload;
          # the failed setup step is the error to read, and the last step
          # still fails the job.
          if-no-files-found: warn
      - name: Fail on collector or test failure
        if: always()
        run: test '${{ steps.collect.outcome }}' = 'success'
