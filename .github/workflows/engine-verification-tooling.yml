name: Engine verification tooling

on:
  pull_request:
    paths:
      - 'xtask/src/exploration.rs'
      - '.github/workflows/engine-*.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The latest nightly, as rust-toolchain.toml names it, for xtask.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Check evidence validation and campaign lifecycle
        run: cargo test -p xtask --locked exploration
