name: engine verification tooling

on:
  workflow_call:

permissions:
  contents: read

jobs:
  evidence-tests:
    name: Campaign evidence tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Builds only xtask, which the Rust tests job's cache holds.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev
          save: 'false'
          pos-app: 'false'
      - name: Check evidence validation and campaign lifecycle
        run: cargo test -p xtask --locked exploration
