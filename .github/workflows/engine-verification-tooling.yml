name: Engine verification tooling

on:
  workflow_call:

permissions:
  contents: read

jobs:
  evidence-tests:
    name: Campaign evidence tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          pos-app: 'false'
      - name: Check evidence validation and campaign lifecycle
        run: cargo test -p xtask --locked exploration
