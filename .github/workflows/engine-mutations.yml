name: Engine test-strength checks

on:
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per selected generated property
        type: choice
        options: ['16', '32', '64']
        default: '32'

permissions:
  contents: read

jobs:
  mutations:
    name: named defects and boundaries (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: [default]
    env:
      ENGINE_MUTATION_FEATURES: ${{ matrix.features }}
      ENGINE_MUTATION_CASES: ${{ inputs.cases || '32' }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/engine-mutations/build
          key: mutations-${{ matrix.features }}
      - name: Check runner rejects invalid outcomes
        run: cargo test -p xtask --locked mutations
      - name: Prove intended defect assertions and required boundary observations
        run: cargo xtask engine mutations --features "$ENGINE_MUTATION_FEATURES" --cases "$ENGINE_MUTATION_CASES"
      - name: Preserve baseline, mutation and boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-mutations-${{ matrix.features }}-${{ github.run_id }}
          path: |
            target/engine-mutations/report.json
            target/engine-mutations/*.log
          if-no-files-found: ignore
