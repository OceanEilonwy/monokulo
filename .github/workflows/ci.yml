name: CI

# Stages, each a set of jobs that run side by side:
#   lint      rustfmt (the defaults) and clippy, every warning an error
#   tests     Linux on each PR update; macOS and Windows after approval
#             (all three on main, version tags and manual runs)
#   coverage  each coverage collector in a job of its own (Linux only), then
#             one report job that joins their outputs into the artifact
#   publish   monokulo zips for Linux, macOS and Windows, key-custody-cli for
#             every computer merchants use, and the Docker image (main and
#             version tags), once lint, tests and coverage passed. A version
#             tag also makes a GitHub release (with build provenance for the
#             CLI) and pushes the image to ghcr.io; main updates the
#             latest-main prerelease. A version tag must name the
#             workspace's version: monokulo links the CLI release by it.
# lint, tests and coverage start together: none needs another's build.
# Every test and coverage job writes a summary table and lists its failures.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'crates/**'
      - 'plugins/woocommerce/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - '.config/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
  # Required checks must be created for every PR, including documentation
  # changes; path-filtered workflows would leave those checks pending forever.
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request replaces its run still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Debug and test builds keep file and line numbers for backtraces but
  # none of the rest of the debug info, which CI never reads: our own crates
  # (which the Rust cache does not keep) compile and link faster.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/monokulo/pos-ui/package-lock.json
      - name: Install POS app dependencies
        # monokulo's build script builds the POS app from them.
        run: npm ci --prefix crates/monokulo/pos-ui --no-audit --no-fund
      # The latest nightly, as rust-toolchain.toml names it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          # monokulo's build script builds key custody's browser module.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        # Clippy's lints are denied in Cargo.toml; -D warnings adds the
        # compiler's own. Every feature, so the e2e targets (built only with
        # `e2e`) are checked too.
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test xtask
        # The workspace tests leave xtask out; its own cover the quality
        # report the Pages workflow builds from main's artifacts.
        run: cargo test -p xtask --locked
      - name: Clippy, engine without SEV-SNP
        # --all-features above builds the snp backend in; this is the
        # default build, where it is left out.
        run: cargo clippy -p engine --all-targets --locked -- -D warnings

  tests:
    uses: ./.github/workflows/rust-tests.yml
    with:
      # Iterate on Linux; the approval workflow supplies the other platforms.
      # Main, version tags and manual runs retain the complete release matrix.
      platforms: ${{ github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]' }}

  coverage-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/monokulo/pos-ui/package-lock.json
      - name: Install POS app dependencies
        run: npm ci --prefix crates/monokulo/pos-ui --no-audit --no-fund
      # The latest nightly and collector, as scripts/coverage-rust-tools.sh
      # installs locally, but prebuilt.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, llvm-tools-preview
          # monokulo's build script builds key custody's browser module.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Collect Rust coverage
        id: collect
        continue-on-error: true
        env:
          COVERAGE_TOOLS_PREINSTALLED: '1'
        run: cargo xtask coverage rust
      - name: Summarize
        if: always()
        run: |
          python3 scripts/test-summary.py 'Rust coverage tests' \
            rust=target/coverage/rust/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust-${{ github.sha }}
          # raw.json was only read to write rust.json and rust-crates.json.
          path: |
            target/coverage/
            !target/coverage/rust/raw.json
          if-no-files-found: warn
      - name: Fail on collector or test failure
        if: always()
        run: test '${{ steps.collect.outcome }}' = success
      - name: Preserve property test regressions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions-coverage-${{ github.sha }}
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore

  coverage-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            e2e/browser/package-lock.json
            crates/monokulo/pos-ui/package-lock.json
      - name: Install browser and POS dependencies
        run: |
          npm ci --prefix e2e/browser --no-audit --no-fund
          npm ci --prefix crates/monokulo/pos-ui --no-audit --no-fund
      - name: Cache Playwright's Chromium
        id: chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/browser/package-lock.json') }}
      - name: Install Chromium
        working-directory: e2e/browser
        run: |
          if test '${{ steps.chromium.outputs.cache-hit }}' = true; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      # The latest nightly, as rust-toolchain.toml names it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          # monokulo's build script builds key custody's browser module.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Collect browser coverage
        id: collect
        continue-on-error: true
        run: cargo xtask coverage browser
      - name: Summarize
        if: always()
        run: |
          python3 scripts/test-summary.py 'Browser coverage tests' \
            fixture=target/coverage/browser/junit-fixture.xml \
            real-binaries=target/coverage/browser/junit-real-binaries.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-browser-${{ github.sha }}
          # raw/ holds the per-test frame coverage collect-browser-report.js
          # already merged into the report.
          path: |
            target/coverage/
            !target/coverage/browser/raw
          if-no-files-found: warn
      - name: Fail on collector or test failure
        if: always()
        run: test '${{ steps.collect.outcome }}' = success

  coverage-woocommerce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          # Matches the wp-env test container (`phpVersion` in
          # plugins/woocommerce/.wp-env*.json) and composer.json's platform
          # pin, so the lock file always suits the PHP the tests run on.
          php-version: '8.5'
          tools: composer:v2
      - name: Install WooCommerce test dependencies
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=5000
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ripgrep
          composer install --working-dir=plugins/woocommerce --no-interaction --prefer-dist
          npm install --global @wordpress/env@latest
          cd plugins/woocommerce
          wp-env start --config=.wp-env.coverage.json
      - name: Collect WooCommerce coverage
        id: collect
        continue-on-error: true
        run: cargo xtask coverage woocommerce
      - name: Summarize
        if: always()
        run: |
          python3 scripts/test-summary.py 'WooCommerce coverage tests' \
            woocommerce=target/coverage/woocommerce/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WooCommerce coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-woocommerce-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: warn
      - name: Fail on collector or test failure
        if: always()
        run: test '${{ steps.collect.outcome }}' = success

  coverage-stress:
    # The engine's one-CPU scanner capacity sweep and fault recovery
    # (docs/engine_stress.md). Its report joins the coverage artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The latest nightly, as rust-toolchain.toml names it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          # monokulo's build script builds key custody's browser module.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Measure engine scanner progress on one CPU
        id: stress
        continue-on-error: true
        run: cargo xtask stress ci
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-stress-${{ github.sha }}
          # From target/coverage/, so the files keep their stress/ folder
          # when the coverage job merges the artifacts.
          path: |
            target/coverage/
            !target/coverage/stress/*.db*
          if-no-files-found: warn
      - name: Fail on a failed point or fault
        if: always()
        run: test '${{ steps.stress.outcome }}' = success

  coverage:
    # One artifact and index from the collectors, validated as
    # `cargo xtask coverage all` validates a local run.
    needs: [coverage-rust, coverage-browser, coverage-woocommerce, coverage-stress]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*-${{ github.sha }}
          path: target/coverage
          merge-multiple: true
      - name: Combine and validate the coverage report
        id: report
        continue-on-error: true
        run: cargo xtask coverage report
      - name: Summarize
        if: always()
        run: |
          python3 scripts/coverage-job-summary.py >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/test-summary.py 'Coverage tests' \
            rust=target/coverage/rust/junit.xml \
            browser-fixture=target/coverage/browser/junit-fixture.xml \
            browser-real-binaries=target/coverage/browser/junit-real-binaries.xml \
            woocommerce=target/coverage/woocommerce/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload offline coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: warn
      - name: Fail on collector, test or validation failure
        if: always()
        run: test '${{ steps.report.outcome }}' = success

  publish:
    # monokulo (the engine inside it: one executable) for every computer a
    # merchant might run it on, as monokulo-{version}-{target}.zip with its
    # SHA-256. Runs on main and version tags (the release jobs below put the
    # files on the repository's Releases page) and on a manual run of any
    # branch (Actions > CI > Run workflow), which keeps them as the run's
    # artifacts only.
    name: publish (${{ matrix.target }})
    needs: [lint, tests, coverage]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc, so the binaries run on older distributions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Built on Intel, not cross-built on Apple silicon: RandomX's CMake
          # picks its JIT sources from the machine it builds on.
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          # Needs the Microsoft Visual C++ runtime (vcruntime140.dll), which
          # RandomX links and nearly every Windows machine has.
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/monokulo/pos-ui/package-lock.json
      - name: Install POS app dependencies
        run: npm ci --prefix crates/monokulo/pos-ui --no-audit --no-fund
      # The latest nightly, as rust-toolchain.toml names it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          # monokulo's build script builds key custody's browser module.
          targets: ${{ matrix.target }}, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.target }}
      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # The workspace version (no Python on every runner).
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME doesn't match the workspace version $version"; exit 1; }
      - name: Build monokulo
        env:
          # Which key-custody-cli release monokulo's key entry links.
          MONOKULO_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          MONOKULO_GIT_COMMIT: ${{ github.sha }}
        # With the engine's `zmq` feature, as the Docker image and the
        # OpenWrt package are built.
        run: cargo build --release --locked -p monokulo --bin monokulo --features engine/zmq --target ${{ matrix.target }}
      - name: Check it runs
        shell: bash
        run: target/${{ matrix.target }}/release/monokulo --version
      - name: Package
        id: package
        shell: bash
        run: |
          # A version tag's files are named for it; main's keep one name, so
          # the latest-main release's links never change.
          if test "$GITHUB_REF_TYPE" = tag; then version="${GITHUB_REF_NAME#v}"
          elif test "$GITHUB_REF" = refs/heads/main; then version=main
          else version="dev-${GITHUB_SHA::7}"; fi
          name="monokulo-${version}-${{ matrix.target }}"
          bin=monokulo
          if test "$RUNNER_OS" = Windows; then bin=monokulo.exe; fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" README.md docs/RUNNING.md docs/CONFIGURATION.md "dist/$name/"
          cd dist
          # zip keeps the executable bit, for unzip and macOS's Archive Utility.
          if test "$RUNNER_OS" = Windows; then 7z a "$name.zip" "$name" > /dev/null; else zip -qr "$name.zip" "$name"; fi
          if command -v sha256sum > /dev/null; then sha256sum "$name.zip" > "$name.zip.sha256"; else shasum -a 256 "$name.zip" > "$name.zip.sha256"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "## monokulo (${{ matrix.target }})"
            echo
            echo "| File | Size |"
            echo "| --- | ---: |"
            echo "| \`$bin\` | $(du -h "$name/$bin" | cut -f1) |"
            echo "| \`$name.zip\` | $(du -h "$name.zip" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-cli:
    # key-custody-cli, for every computer a merchant might run it on: the
    # files monokulo's key entry forms link
    # (key-custody-cli-{version}-{target}.tar.gz, .zip on Windows), each with
    # its SHA-256 and, on a version tag, GitHub build provenance
    # (`gh attestation verify`).
    name: publish-cli (${{ matrix.target }})
    needs: [lint, tests, coverage]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      # The latest nightly, as rust-toolchain.toml names it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build key-custody-cli
        run: cargo build --release --locked -p key-custody-cli --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if test "$GITHUB_REF_TYPE" != tag; then
            # The workspace version (no Python on every runner).
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          fi
          name="key-custody-cli-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=key-custody-cli
          if test "${{ runner.os }}" = Windows; then bin=key-custody-cli.exe; fi
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cd dist
          if test "${{ runner.os }}" = Windows; then
            7z a "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          echo "file=dist/$file" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  docker:
    # The production image (Dockerfile): built on main, and on a version tag
    # also pushed to ghcr.io/<owner>/monokulo as that version and latest.
    needs: [lint, tests, coverage]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/monokulo
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Which key-custody-cli release monokulo's key entry links.
          build-args: |
            MONOKULO_RELEASE_TAG=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
            MONOKULO_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # A version tag's binaries as a GitHub release, for merchants to download
    # (the repository's Releases page, and releases/latest).
    needs: [publish, publish-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: monokulo-*
          path: dist
          merge-multiple: true
      # Never removed once released: every monokulo of this version links
      # these files.
      - uses: actions/download-artifact@v8
        with:
          pattern: key-custody-cli-*
          path: dist
          merge-multiple: true
      - name: Write the download notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true

  release-main:
    # main's latest binaries as one prerelease, latest-main, brought up to
    # date on every push to main: the same file names every time, so its
    # download links never change. A prerelease, so releases/latest stays
    # the newest version tag.
    needs: [publish, publish-cli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One update at a time; a newer push waits for the one before it.
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: latest-main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: monokulo-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: key-custody-cli-*
          path: dist
          merge-multiple: true
      - name: Update the latest-main release
        run: |
          title="main (${GITHUB_SHA::7})"
          {
            scripts/release-notes.sh "$TAG" main
            echo
            echo "Built from $GITHUB_SHA, the newest commit on main that passed CI. For a released version, see the [latest release](https://github.com/$GITHUB_REPOSITORY/releases/latest)."
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Move the tag to this commit, replace the files in place, and
            # drop any this build no longer makes (an older key-custody-cli
            # version's).
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$TAG" dist/* --clobber
            gh release view "$TAG" --json assets -q '.assets[].name' | while read -r asset; do
              test -e "dist/$asset" || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --prerelease
          fi
          echo "Updated [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) to ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
