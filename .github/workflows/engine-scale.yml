name: Engine scale measurements
on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurements:
    # Capacity and latency depend on hardware. They are recorded for review;
    # the scale tests (tests.yml's Engine scale tests) are the
    # machine-independent merge check.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Record one-CPU capacity, latency and fault recovery
        run: cargo xtask stress scale
      - name: Preserve measurements and hardware metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-scale-measurements-${{ github.run_id }}
          path: target/coverage/stress-scale/
