name: Engine scale measurements
on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurements:
    # Capacity and latency depend on hardware. They are recorded for review;
    # the scale tests (tests.yml's Engine scale tests) are the
    # machine-independent merge check.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Record one-CPU capacity, latency and fault recovery
        run: cargo xtask stress scale
      - name: Preserve measurements and hardware metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-scale-measurements-${{ github.run_id }}
          path: target/coverage/stress-scale/

  pages:
    # This run's scale page, with every other part of the site as it is
    # live (pages.yml). On main only; a run that didn't finish shows nothing
    # new.
    name: Pages
    needs: measurements
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success", "failure"]'), needs.measurements.result)
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      part: scale
      conclusion: ${{ needs.measurements.result }}
