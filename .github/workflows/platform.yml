name: platform

# One platform's build and test suites, called by checks.yml (pull requests) and
# release.yml (main, version tags), each suite a job of its own: the Rust
# tests on every platform, the browser, engine progress and scale suites on
# Linux. With `coverage` (Linux only), each but scale runs through its
# coverage collector (`cargo xtask coverage <suite>`) and uploads what it
# collected.
# Summary then passes only when every suite did, and with coverage joins
# what they collected into one artifact and checks it, as
# `cargo xtask coverage all` does locally: one check to require per
# platform. Every job writes a summary table and lists its failures.
#
# Test builds have every feature a build can ship: the engine's default zmq
# and, through monokulo/snp, the snp key custody backend.

on:
  workflow_call:
    inputs:
      platform:
        description: linux, macos or windows
        required: true
        type: string
      coverage:
        description: Collect coverage and check the report (Linux only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Job names are fixed text: GitHub lists a skipped job (a Linux-only suite
  # on macOS or Windows) under its name unevaluated. The caller's job name
  # says which run it is: linux, macos, windows, coverage.
  #
  # The Rust cache: the job that builds the whole workspace's tests (rust
  # build on Linux, rust tests elsewhere) saves the cache; with coverage,
  # the Linux suites, which build less of it, restore that one and save
  # nothing, so the repository keeps one Linux cache instead of one a
  # suite. Cargo resolves a dependency's features per build, so they still
  # compile the few crates a narrower build resolves differently. A
  # coverage run's Rust tests are instrumented, so they keep a cache of
  # their own; its browser and progress suites build what the plain
  # run's do and restore the dev cache like them. rust-cache.yml builds
  # the Linux one again on each new nightly.

  # Linux without coverage builds the workspace once, here, for the suites
  # that used to build it each for itself: the Rust tests, browser, engine
  # progress and scale jobs each compiled engine (792, 418, 174 and
  # 205 s of a pull request's run). It archives the tests for the rust
  # tests and engine scale jobs, as Windows does for its partition jobs,
  # and passes on the binaries the browser and engine progress tests run,
  # which this build makes too (Cargo builds a package's binaries for its
  # integration tests, and examples to check they compile), and xtask. The
  # binaries come from the tests' feature resolution rather than
  # the narrower builds those suites made (real-stack.js BUILD_ARGS, -p
  # engine): a few dependencies have more features turned on (reqwest's
  # blocking client, for one), but the workspace's own crates have the same
  # ones.
  build:
    name: rust build
    if: inputs.platform == 'linux' && !inputs.coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Everything the suites need, apart from the runs, as the rust tests job builds it on the other
      # platforms. The scale tests' archive holds only the engine library's
      # tests, a fraction of the whole one to download and extract. The
      # binaries go in a tar file of their own, which keeps them executable
      # (an artifact doesn't).
      - name: Build the tests
        run: |
          cargo nextest archive --workspace --locked --features monokulo/snp \
            --archive-file target/rust-tests.tar.zst
          cargo nextest archive --workspace --locked --features monokulo/snp \
            -E 'package(engine) & kind(lib)' --archive-file target/engine-tests.tar.zst
          cargo build -p xtask --locked
          tar --zstd -cf target/rust-binaries.tar.zst -C target \
            debug/monokulo debug/monokulo-engine debug/fake-monerod debug/examples/coverage_fixture \
            debug/stress_fixture debug/xtask
          ls -l target/*.tar.zst
          if test -n "${RUSTC_WRAPPER:-}"; then sccache --show-stats; fi
      # Each an artifact of its own, so a job downloads only what it runs.
      # Already compressed, and only this run's jobs read them.
      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: rust-binaries-linux-${{ github.sha }}
          path: target/rust-binaries.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Upload the engine library's tests
        uses: actions/upload-artifact@v7
        with:
          name: engine-tests-linux-${{ github.sha }}
          path: target/engine-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Upload the tests
        uses: actions/upload-artifact@v7
        with:
          name: rust-tests-linux-${{ github.sha }}
          path: target/rust-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  # Linux's doctests (without coverage), in a job of their own beside the
  # rust build job: the jobs that need that build wait for all of it, and
  # run after it they took 374 s, as they build the libraries again with
  # the features their narrower set of packages resolves. Here that build
  # runs at the same time as the other.
  doctests:
    name: rust doctests
    if: inputs.platform == 'linux' && !inputs.coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev
          save: 'false'
      # As the rust tests job runs them on the other platforms, but with
      # xtask, as the rust build job builds it: xtask has no library, so no
      # doctests, but without it a few dependencies resolve fewer features
      # (crc32fast, regex) and build again rather than come from the cache.
      - name: Run the doctests
        run: cargo test --workspace --locked --doc --features monokulo/snp

  rust:
    name: rust tests
    # On Linux without coverage, after the rust build job, whose tests it
    # runs; skipped, it leaves this job to build its own. Without the
    # archive, its download fails.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ format('{0}-latest', inputs.platform == 'linux' && 'ubuntu' || inputs.platform) }}
    # Enough for a cold cache on every platform: Windows took 58 minutes and
    # macOS 31 (22 of them building). A limit that stops a cold run while it
    # saves its cache leaves every later run cold too.
    timeout-minutes: 90
    env:
      PREBUILT: ${{ inputs.platform == 'linux' && !inputs.coverage }}
    steps:
      - uses: actions/checkout@v7
      # The engine's property tests make, reopen and delete thousands of
      # SQLite files in the temporary folder, which on Windows runners is on
      # C:, the slow system disk; the checkout and target are on D:, the
      # runner's local disk. With TMP and TEMP in the runner's own temporary
      # folder on D: (emptied after every job), nextest took 440 to 800 s
      # instead of 1,500 to 3,000 on the same machines. Defender doesn't
      # scan files on these runners, so a Dev Drive for target and TMP did no
      # better, built no faster, and its System Volume Information folder
      # stopped the Rust cache saving.
      - name: Keep temporary files on drive D
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      # The engine's backup_restore tests drive deploy/backup/*.sh, which
      # need the sqlite3 CLI. macOS ships it; Windows doesn't run them.
      - name: Install sqlite3
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if test '${{ runner.os }}' = Linux; then
            sudo apt-get update -q
            sudo apt-get install -y sqlite3
          elif ! command -v sqlite3 >/dev/null; then
            brew install sqlite
            echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"
          fi
          sqlite3 -version
      - uses: ./.github/actions/setup-rust
        with:
          components: ${{ inputs.coverage && 'llvm-tools-preview' || '' }}
          # An instrumented build shares nothing with a plain one.
          cache-key: ${{ inputs.coverage && 'coverage' || '' }}
          shared-key: ${{ !inputs.coverage && 'dev' || '' }}
          # With the rust build job's tests, the toolchain they were built
          # with; nothing is compiled here. The npm dependencies all the
          # same: xtask's pages tests build the ui islands.
          cache: ${{ env.PREBUILT != 'true' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ inputs.coverage && 'cargo-llvm-cov,cargo-nextest' || 'cargo-nextest' }}
      - uses: actions/download-artifact@v8
        if: env.PREBUILT == 'true'
        with:
          # The tests and the binaries, not the engine library's tests.
          pattern: rust-*-linux-${{ github.sha }}
          merge-multiple: true
          path: target-ci
      # xtask, for Summarize.
      - name: Unpack the binaries
        if: env.PREBUILT == 'true'
        run: |
          mkdir -p target
          tar --zstd -xf target-ci/rust-binaries.tar.zst -C target
          echo XTASK=target/debug/xtask >> "$GITHUB_ENV"
      # Everything the tests need compiled, apart from the run, so the build
      # and the tests have times of their own in the log. A coverage run
      # builds instrumented tests in `cargo xtask coverage rust` instead, and
      # Linux's come from the rust build job. The doctests name the same
      # packages as the tests, so Cargo resolves the same features and finds
      # the libraries they link built here; and xtask, for Summarize. On
      # Windows the tests are archived for the rust tests partition jobs,
      # which run a third of them each.
      - name: Build the tests
        if: ${{ !inputs.coverage && env.PREBUILT != 'true' }}
        shell: bash
        run: |
          if test '${{ runner.os }}' = Windows; then
            cargo nextest archive --workspace --locked --features monokulo/snp --exclude xtask \
              --archive-file target/rust-tests.tar.zst
          else
            cargo nextest run --no-run --workspace --locked --profile ci --features monokulo/snp --exclude xtask
          fi
          cargo build -p xtask --locked
          if test -n "${RUSTC_WRAPPER:-}"; then sccache --show-stats; fi
      # With the xtask that summarizes them: Windows takes nearly five
      # minutes to build it.
      - name: Upload the tests for the partition jobs
        if: runner.os == 'Windows' && !inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: rust-tests-windows-${{ github.sha }}
          path: |
            target/rust-tests.tar.zst
            target/debug/xtask.exe
          if-no-files-found: error
          # Already compressed, and only the partition jobs read it.
          compression-level: 0
          retention-days: 1
          overwrite: true
      # A coverage run's instrumented tests, built as the next step runs
      # them, so it times only the tests (it took 695 s with the build).
      - name: Build the instrumented tests
        if: ${{ inputs.coverage }}
        run: cargo xtask coverage build-rust
      - name: Run the tests
        id: tests
        # Windows runs them in the rust tests partition jobs.
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        env:
          COVERAGE_TOOLS_PREINSTALLED: '1'
          COVERAGE_RUST_PREBUILT: '1'
        run: |
          if ${{ inputs.coverage }}; then
            cargo xtask coverage rust
          elif ${{ env.PREBUILT }}; then
            # Extracted into this checkout's target folder, as the partition
            # jobs extract theirs. On Linux, xtask's own tests too: the
            # tooling CI and the Pages build run on Linux.
            cargo nextest run --archive-file target-ci/rust-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
              --profile ci
          else
            cargo nextest run --workspace --locked --profile ci --features monokulo/snp --exclude xtask
          fi
      # A coverage run leaves them to the plain Linux job beside it: it has
      # no plain build for them, and building one took 450 to 721 s. The
      # rust doctests job runs Linux's.
      - name: Run the doctests
        id: doctests
        if: ${{ !inputs.coverage && env.PREBUILT != 'true' }}
        continue-on-error: true
        # nextest does not run doctests. xtask has none; naming it made the
        # step build it again (171 s against 110 on Linux).
        run: cargo test --workspace --locked --exclude xtask --doc --features monokulo/snp
      # On a pull request, a test over its time limit that xtask/src/slow.rs
      # doesn't list fails here (--fail-slow), after the summary says which.
      - name: Summarize
        if: always()
        shell: bash
        run: |
          slow=0
          if test '${{ runner.os }}' != Windows; then
            ${XTASK:-cargo xtask} test-summary ${{ github.event_name == 'pull_request' && !inputs.coverage && '--fail-slow' || '' }} 'Rust tests (${{ runner.os }})' \
              rust=${{ inputs.coverage && 'target/coverage/rust/junit.xml' || 'target/nextest/ci/junit.xml' }} >> "$GITHUB_STEP_SUMMARY" || slow=$?
          fi
          # The rust doctests job runs Linux's.
          if test '${{ env.PREBUILT }}' != true; then
            echo "Doctests: ${{ steps.doctests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$slow"
      - name: Upload Rust coverage
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust-${{ github.sha }}
          # raw.json was only read to write rust.json and rust-crates.json.
          path: |
            target/coverage/
            !target/coverage/rust/raw.json
          if-no-files-found: warn
      - name: Fail on test failure
        if: always()
        shell: bash
        run: |
          test '${{ steps.tests.outcome }}' = success || test '${{ runner.os }}' = Windows
          test '${{ steps.doctests.outcome }}' != failure
      - name: Preserve property test regressions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions-${{ runner.os }}${{ inputs.coverage && '-coverage' || '' }}-${{ github.sha }}
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore

  # Windows runs the tests about three times slower than Linux, over ten
  # minutes in one step: the rust tests job builds and archives them once,
  # and each of these runs a third of every test binary's tests from it.
  rust-partitions:
    name: rust tests partition
    needs: rust
    # After a failed doctest too; without an archive the download fails.
    if: ${{ !cancelled() && inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # As in the rust tests job.
      - name: Keep temporary files on drive D
        shell: pwsh
        run: |
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      # The toolchain the tests were built with; nothing is compiled here.
      - uses: ./.github/actions/setup-rust
        with:
          cache: 'false'
          pos-app: 'false'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v8
        with:
          name: rust-tests-windows-${{ github.sha }}
          path: target-ci
      # Extracted into this checkout's target folder, the path the tests
      # were built in, so the paths compiled into them (CARGO_BIN_EXE_*,
      # CARGO_MANIFEST_DIR) hold.
      - name: Run the tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          cargo nextest run --archive-file target-ci/rust-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
            --profile ci --partition count:${{ matrix.part }}/3
      - name: Summarize
        if: always()
        shell: bash
        run: |
          target-ci/debug/xtask.exe test-summary 'Rust tests (Windows, part ${{ matrix.part }} of 3)' \
            rust=target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on test failure
        if: always()
        shell: bash
        run: test '${{ steps.tests.outcome }}' = success
      - name: Preserve property test regressions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions-Windows-part${{ matrix.part }}-${{ github.sha }}
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore

  browser:
    name: browser tests
    # Without coverage, it runs the binaries the rust build job built; with
    # it, the instrumented ones `cargo xtask coverage browser` builds.
    needs: build
    if: ${{ !cancelled() && inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Only coverage builds Rust here (the plain run downloads the rust
      # build job's binaries). It instruments only the pages' scripts, so
      # its Rust build is the plain run's and restores the dev cache.
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.coverage }}
          shared-key: dev
          save: 'false'
          npm-lockfiles: |
            e2e/browser/package-lock.json
            package-lock.json
      - name: Install the browser tests' dependencies
        run: npm ci --prefix e2e/browser --no-audit --no-fund
      # Chromium runs every browser test (coverage-browser.config.js). The
      # key names the browser, so a cache saved with others isn't restored.
      # Its system libraries aren't cached: they are installed either way.
      # Only main saves it, as with the Rust cache: a pull request that
      # missed it saved a 270 MB copy of its own that no other run reads.
      - name: Restore Playwright's browsers
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/browser/package-lock.json') }}
      - name: Install Chromium
        working-directory: e2e/browser
        run: |
          if test '${{ steps.browsers.outputs.cache-hit }}' = true; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Save Playwright's browsers
        if: steps.browsers.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.coverage }}
        with:
          name: rust-binaries-linux-${{ github.sha }}
          path: target-ci
      # Every binary the tests run, and xtask, for Summarize. The tests
      # don't build them again (E2E_PREBUILT_BINARIES, real-stack.js):
      # Cargo, which goes by modification times, would find them stale.
      - name: Unpack the binaries
        if: ${{ !inputs.coverage }}
        run: |
          mkdir -p target
          tar --zstd -xf target-ci/rust-binaries.tar.zst -C target
          echo XTASK=target/debug/xtask >> "$GITHUB_ENV"
          echo E2E_PREBUILT_BINARIES=1 >> "$GITHUB_ENV"
      # With coverage, every binary the tests run, with the one command the
      # run's global setup and the fixture specs repeat (real-stack.js
      # BUILD_ARGS), so theirs find nothing to do and the test step times
      # only the tests; and xtask, which runs the coverage collector and
      # Summarize.
      - name: Build the binaries
        if: ${{ inputs.coverage }}
        run: |
          node -e "require('./e2e/browser/real-stack').buildBinaries()"
          cargo build -p xtask --locked
      - name: Run tests
        id: tests
        continue-on-error: true
        # The fixture tests and the real-binaries tests, as one Playwright
        # run (coverage-browser.config.js); the collector adds
        # instrumentation and the screenshot gallery.
        run: |
          if ${{ inputs.coverage }}; then
            cargo xtask coverage browser
          else
            cd e2e/browser && ./node_modules/.bin/playwright test -c coverage-browser.config.js
          fi
      # As the rust tests job's: a pull request fails on a slow test.
      - name: Summarize
        if: always()
        run: |
          ${XTASK:-cargo xtask} test-summary ${{ github.event_name == 'pull_request' && !inputs.coverage && '--fail-slow' || '' }} 'Browser tests' \
            browser=target/coverage/browser/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser coverage
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-browser-${{ github.sha }}
          # raw/ holds the per-test frame coverage collect-browser-report.js
          # already merged into the report.
          path: |
            target/coverage/
            !target/coverage/browser/raw
          if-no-files-found: warn
      - name: Upload the Playwright report
        # Run tests continues on error, so failure() stays false here.
        if: always() && steps.tests.outcome == 'failure' && !inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests-${{ github.sha }}
          path: target/coverage/browser/playwright-report/
          if-no-files-found: ignore
      - name: Fail on test failure
        if: always()
        run: test '${{ steps.tests.outcome }}' = success

  stress:
    # The engine's one-CPU scanner capacity sweep and fault recovery. With
    # coverage, its report joins the coverage artifact.
    name: engine progress tests
    # Without coverage, it runs the fixture the rust build job built, with
    # the workspace unoptimised as every CI build has it (setup-rust). The
    # dependencies, optimised either way, are most of what it measures: so
    # built, on a runner here its ticks took 49, 60 and 80 ms at 32, 64 and
    # 128 tenants, its slowest HTTP answer 4.5 ms and its latest timer
    # 3.5 ms, far inside the 250 and 100 ms it passes or fails on
    # (xtask/stress/scenario_v3.json).
    needs: build
    if: ${{ !cancelled() && inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Only coverage builds Rust here (the plain run downloads the rust
      # build job's binaries); its run is the plain run, so it restores
      # the dev cache.
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.coverage }}
          shared-key: dev
          save: 'false'
          pos-app: 'false'
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.coverage }}
        with:
          name: rust-binaries-linux-${{ github.sha }}
          path: target-ci
      # The fixture, and xtask to run it; neither is built again
      # (STRESS_FIXTURE_PREBUILT, xtask/src/stress.rs).
      - name: Unpack the binaries
        if: ${{ !inputs.coverage }}
        run: |
          mkdir -p target
          tar --zstd -xf target-ci/rust-binaries.tar.zst -C target debug/stress_fixture debug/xtask
          echo XTASK=target/debug/xtask >> "$GITHUB_ENV"
          echo STRESS_FIXTURE_PREBUILT=1 >> "$GITHUB_ENV"
      - name: Measure engine scanner progress on one CPU
        id: stress
        continue-on-error: true
        run: ${XTASK:-cargo xtask} stress ci
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.coverage && 'coverage-stress' || 'stress' }}-${{ github.sha }}
          # From target/coverage/, so the files keep their stress/ folder
          # when the report job merges the artifacts.
          path: |
            target/coverage/
            !target/coverage/stress/*.db*
          if-no-files-found: warn
      - name: Fail on a failed point or fault
        if: always()
        run: test '${{ steps.stress.outcome }}' = success

  scale:
    # Every scale scenario, the ignored large fixtures included, one test at
    # a time (`cargo xtask engine scale`), at 32 cases and a seed per run.
    name: engine scale tests
    # Instrumenting it would add nothing: Coverage runs on main after the
    # plain Linux run already ran it. The engine's tests come from the rust
    # build job.
    needs: build
    if: ${{ !cancelled() && inputs.platform == 'linux' && !inputs.coverage }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROPTEST_CASES: '32'
      PROPTEST_RNG_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      # The toolchain the tests were built with; nothing is compiled here.
      - uses: ./.github/actions/setup-rust
        with:
          cache: 'false'
          pos-app: 'false'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v8
        with:
          name: engine-tests-linux-${{ github.sha }}
          path: target-ci
      - uses: actions/download-artifact@v8
        with:
          name: rust-binaries-linux-${{ github.sha }}
          path: target-ci
      - name: Unpack xtask
        run: |
          mkdir -p target
          tar --zstd -xf target-ci/rust-binaries.tar.zst -C target debug/xtask
      # From the engine library's archive, which the rust build job built
      # with the workspace's features, as the rust tests run them.
      - name: Run the scale scenarios
        env:
          ENGINE_SCALE_ARCHIVE: target-ci/engine-tests.tar.zst
        run: target/debug/xtask engine scale
      - name: Preserve replay settings, failures and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-scale-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/engine-scale/
            crates/engine/proptest-regressions/

  summary:
    # Passes only when every suite did (a suite this platform doesn't run is
    # skipped). With coverage, also the one artifact and index from the
    # collectors, checked as `cargo xtask coverage all` checks a local run.
    name: summary
    needs: [build, doctests, rust, rust-partitions, browser, stress, scale]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        if: inputs.coverage
      # Builds only xtask, which the Rust tests job's cache holds.
      - uses: ./.github/actions/setup-rust
        if: inputs.coverage
        with:
          shared-key: dev
          save: 'false'
          pos-app: 'false'
      - uses: actions/download-artifact@v8
        if: inputs.coverage
        with:
          pattern: coverage-*-${{ github.sha }}
          path: target/coverage
          merge-multiple: true
      - name: Combine and check the coverage report
        id: report
        if: inputs.coverage
        continue-on-error: true
        run: cargo xtask coverage report
      - name: Summarize the coverage
        if: always() && inputs.coverage
        run: |
          cargo xtask coverage summary >> "$GITHUB_STEP_SUMMARY"
          cargo xtask test-summary 'Coverage tests' \
            rust=target/coverage/rust/junit.xml \
            browser=target/coverage/browser/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage report
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: warn
      - name: Fail unless every suite passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          REPORT: ${{ steps.report.outcome }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          for name in $failed; do echo "::error::$name did not pass"; done
          # Skipped without coverage.
          if test "$REPORT" = failure; then echo '::error::the coverage report did not pass'; exit 1; fi
          test -z "$failed"
