name: platform

# One platform's build and test suites, called by checks.yml (pull requests) and
# release.yml (main, version tags), each suite a job of its own: the Rust
# tests on every platform, the browser, engine progress and scale suites on
# Linux. With `coverage` (Linux only), each but scale runs through its
# coverage collector (`cargo xtask coverage <suite>`) and uploads what it
# collected.
# Summary then passes only when every suite did, and with coverage joins
# what they collected into one artifact and checks it, as
# `cargo xtask coverage all` does locally: one check to require per
# platform. Every job writes a summary table and lists its failures.
#
# Test builds have every feature a build can ship: the engine's default zmq
# and, through monokulo/snp, the snp key custody backend.

on:
  workflow_call:
    inputs:
      platform:
        description: linux, macos or windows
        required: true
        type: string
      coverage:
        description: Collect coverage and check the report (Linux only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Job names are fixed text: GitHub lists a skipped job (a Linux-only suite
  # on macOS or Windows) under its name unevaluated. The caller's job name
  # says which run it is: linux, macos, windows, coverage.
  #
  # The Rust cache: the Rust tests job builds the whole workspace's tests
  # (its Build the tests step) and saves the cache; the Linux suites that
  # build less of it (browser, engine progress, scale) restore
  # that one and save nothing, so the repository keeps one Linux cache
  # instead of one a suite. Cargo resolves a dependency's features per
  # build, so they still compile the few crates a narrower build resolves
  # differently. A coverage run keeps a cache a suite, as its builds differ.
  # rust-cache.yml builds the Linux one again on each new nightly.
  rust:
    name: rust tests
    runs-on: ${{ format('{0}-latest', inputs.platform == 'linux' && 'ubuntu' || inputs.platform) }}
    # Enough for a cold cache on every platform: Windows took 58 minutes and
    # macOS 31 (22 of them building). A limit that stops a cold run while it
    # saves its cache leaves every later run cold too.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The engine's property tests make, reopen and delete thousands of
      # SQLite files in the temporary folder, which on Windows runners is on
      # C:, the slow system disk; the checkout and target are on D:, the
      # runner's local disk. With TMP and TEMP in the runner's own temporary
      # folder on D: (emptied after every job), nextest took 440 to 800 s
      # instead of 1,500 to 3,000 on the same machines. Defender doesn't
      # scan files on these runners, so a Dev Drive for target and TMP did no
      # better, built no faster, and its System Volume Information folder
      # stopped the Rust cache saving.
      - name: Keep temporary files on drive D
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      # The engine's backup_restore tests drive deploy/backup/*.sh, which
      # need the sqlite3 CLI. macOS ships it; Windows doesn't run them.
      - name: Install sqlite3
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if test '${{ runner.os }}' = Linux; then
            sudo apt-get update -q
            sudo apt-get install -y sqlite3
          elif ! command -v sqlite3 >/dev/null; then
            brew install sqlite
            echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"
          fi
          sqlite3 -version
      - uses: ./.github/actions/setup-rust
        with:
          components: ${{ inputs.coverage && 'llvm-tools-preview' || '' }}
          # An instrumented build shares nothing with a plain one.
          cache-key: ${{ inputs.coverage && 'coverage' || '' }}
          shared-key: ${{ !inputs.coverage && 'dev' || '' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ inputs.coverage && 'cargo-llvm-cov,cargo-nextest' || 'cargo-nextest' }}
      # Everything the tests need compiled, apart from the run, so the build
      # and the tests have times of their own in the log. A coverage run
      # builds instrumented tests in `cargo xtask coverage rust` instead.
      # The doctests name the same packages as the tests, so Cargo resolves
      # the same features and finds the libraries they link built here; and
      # xtask, for Summarize. On Windows the tests are archived for the rust
      # tests partition jobs, which run a third of them each.
      - name: Build the tests
        if: ${{ !inputs.coverage }}
        shell: bash
        run: |
          if test '${{ runner.os }}' = Windows; then
            cargo nextest archive --workspace --locked --features monokulo/snp --exclude xtask \
              --archive-file target/rust-tests.tar.zst
          else
            cargo nextest run --no-run --workspace --locked --profile ci --features monokulo/snp \
              ${{ inputs.platform != 'linux' && '--exclude xtask' || '' }}
          fi
          cargo build -p xtask --locked
          if test -n "${RUSTC_WRAPPER:-}"; then sccache --show-stats; fi
      # With the xtask that summarizes them: Windows takes nearly five
      # minutes to build it.
      - name: Upload the tests for the partition jobs
        if: runner.os == 'Windows' && !inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: rust-tests-windows-${{ github.sha }}
          path: |
            target/rust-tests.tar.zst
            target/debug/xtask.exe
          if-no-files-found: error
          # Already compressed, and only the partition jobs read it.
          compression-level: 0
          retention-days: 1
          overwrite: true
      # A coverage run's instrumented tests, built as the next step runs
      # them, so it times only the tests (it took 695 s with the build).
      - name: Build the instrumented tests
        if: ${{ inputs.coverage }}
        run: cargo xtask coverage build-rust
      - name: Run the tests
        id: tests
        # Windows runs them in the rust tests partition jobs.
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        env:
          COVERAGE_TOOLS_PREINSTALLED: '1'
          COVERAGE_RUST_PREBUILT: '1'
        run: |
          if ${{ inputs.coverage }}; then
            cargo xtask coverage rust
          else
            # On Linux, xtask's own tests too: the tooling CI and the Pages
            # build run on Linux.
            cargo nextest run --workspace --locked --profile ci --features monokulo/snp \
              ${{ inputs.platform != 'linux' && '--exclude xtask' || '' }}
          fi
      # A coverage run leaves them to the plain Linux job beside it: it has
      # no plain build for them, and building one took 450 to 721 s.
      - name: Run the doctests
        id: doctests
        if: ${{ !inputs.coverage }}
        continue-on-error: true
        # nextest does not run doctests. xtask has none; naming it made the
        # step build it again (171 s against 110 on Linux).
        run: cargo test --workspace --locked --exclude xtask --doc --features monokulo/snp
      # On a pull request, a test over its time limit that xtask/src/slow.rs
      # doesn't list fails here (--fail-slow), after the summary says which.
      - name: Summarize
        if: always()
        shell: bash
        run: |
          slow=0
          if test '${{ runner.os }}' != Windows; then
            cargo xtask test-summary ${{ github.event_name == 'pull_request' && !inputs.coverage && '--fail-slow' || '' }} 'Rust tests (${{ runner.os }})' \
              rust=${{ inputs.coverage && 'target/coverage/rust/junit.xml' || 'target/nextest/ci/junit.xml' }} >> "$GITHUB_STEP_SUMMARY" || slow=$?
          fi
          echo "Doctests: ${{ steps.doctests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          exit "$slow"
      - name: Upload Rust coverage
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust-${{ github.sha }}
          # raw.json was only read to write rust.json and rust-crates.json.
          path: |
            target/coverage/
            !target/coverage/rust/raw.json
          if-no-files-found: warn
      - name: Fail on test failure
        if: always()
        shell: bash
        run: |
          test '${{ steps.tests.outcome }}' = success || test '${{ runner.os }}' = Windows
          test '${{ steps.doctests.outcome }}' != failure
      - name: Preserve property test regressions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions-${{ runner.os }}${{ inputs.coverage && '-coverage' || '' }}-${{ github.sha }}
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore

  # Windows runs the tests about three times slower than Linux, over ten
  # minutes in one step: the rust tests job builds and archives them once,
  # and each of these runs a third of every test binary's tests from it.
  rust-partitions:
    name: rust tests partition
    needs: rust
    # After a failed doctest too; without an archive the download fails.
    if: ${{ !cancelled() && inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # As in the rust tests job.
      - name: Keep temporary files on drive D
        shell: pwsh
        run: |
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      # The toolchain the tests were built with; nothing is compiled here.
      - uses: ./.github/actions/setup-rust
        with:
          cache: 'false'
          pos-app: 'false'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v8
        with:
          name: rust-tests-windows-${{ github.sha }}
          path: target-ci
      # Extracted into this checkout's target folder, the path the tests
      # were built in, so the paths compiled into them (CARGO_BIN_EXE_*,
      # CARGO_MANIFEST_DIR) hold.
      - name: Run the tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          cargo nextest run --archive-file target-ci/rust-tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
            --profile ci --partition count:${{ matrix.part }}/3
      - name: Summarize
        if: always()
        shell: bash
        run: |
          target-ci/debug/xtask.exe test-summary 'Rust tests (Windows, part ${{ matrix.part }} of 3)' \
            rust=target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on test failure
        if: always()
        shell: bash
        run: test '${{ steps.tests.outcome }}' = success
      - name: Preserve property test regressions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions-Windows-part${{ matrix.part }}-${{ github.sha }}
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore

  browser:
    name: browser tests
    if: inputs.platform == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ inputs.coverage && 'coverage' || '' }}
          shared-key: ${{ !inputs.coverage && 'dev' || '' }}
          save: ${{ inputs.coverage }}
          npm-lockfiles: |
            e2e/browser/package-lock.json
            package-lock.json
      - name: Install the browser tests' dependencies
        run: npm ci --prefix e2e/browser --no-audit --no-fund
      # Chromium runs every browser test (coverage-browser.config.js). The
      # key names the browser, so a cache saved with others isn't restored.
      # Its system libraries aren't cached: they are installed either way.
      - name: Cache Playwright's browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/browser/package-lock.json') }}
      - name: Install Chromium
        working-directory: e2e/browser
        run: |
          if test '${{ steps.browsers.outputs.cache-hit }}' = true; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      # Every binary the tests run, with the one command the run's global
      # setup and the fixture specs repeat (real-stack.js BUILD_ARGS), so
      # theirs find nothing to do and the test step times only the tests;
      # and xtask, which runs the coverage collector and Summarize.
      - name: Build the binaries
        run: |
          node -e "require('./e2e/browser/real-stack').buildBinaries()"
          cargo build -p xtask --locked
      - name: Run tests
        id: tests
        continue-on-error: true
        # The fixture tests and the real-binaries tests, as one Playwright
        # run (coverage-browser.config.js); the collector adds
        # instrumentation and the screenshot gallery.
        run: |
          if ${{ inputs.coverage }}; then
            cargo xtask coverage browser
          else
            cd e2e/browser && ./node_modules/.bin/playwright test -c coverage-browser.config.js
          fi
      # As the rust tests job's: a pull request fails on a slow test.
      - name: Summarize
        if: always()
        run: |
          cargo xtask test-summary ${{ github.event_name == 'pull_request' && !inputs.coverage && '--fail-slow' || '' }} 'Browser tests' \
            browser=target/coverage/browser/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser coverage
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-browser-${{ github.sha }}
          # raw/ holds the per-test frame coverage collect-browser-report.js
          # already merged into the report.
          path: |
            target/coverage/
            !target/coverage/browser/raw
          if-no-files-found: warn
      - name: Upload the Playwright report
        # Run tests continues on error, so failure() stays false here.
        if: always() && steps.tests.outcome == 'failure' && !inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests-${{ github.sha }}
          path: target/coverage/browser/playwright-report/
          if-no-files-found: ignore
      - name: Fail on test failure
        if: always()
        run: test '${{ steps.tests.outcome }}' = success

  stress:
    # The engine's one-CPU scanner capacity sweep and fault recovery. With
    # coverage, its report joins the coverage artifact.
    name: engine progress tests
    if: inputs.platform == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ inputs.coverage && 'coverage' || '' }}
          shared-key: ${{ !inputs.coverage && 'dev' || '' }}
          save: ${{ inputs.coverage }}
          pos-app: 'false'
      - name: Measure engine scanner progress on one CPU
        id: stress
        continue-on-error: true
        run: cargo xtask stress ci
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.coverage && 'coverage-stress' || 'stress' }}-${{ github.sha }}
          # From target/coverage/, so the files keep their stress/ folder
          # when the report job merges the artifacts.
          path: |
            target/coverage/
            !target/coverage/stress/*.db*
          if-no-files-found: warn
      - name: Fail on a failed point or fault
        if: always()
        run: test '${{ steps.stress.outcome }}' = success

  scale:
    # Every scale scenario, the ignored large fixtures included, one test at
    # a time (`cargo xtask engine scale`), at 32 cases and a seed per run.
    name: engine scale tests
    # Instrumenting it would add nothing: Coverage runs on main after the
    # plain Linux run already ran it.
    if: inputs.platform == 'linux' && !inputs.coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROPTEST_CASES: '32'
      PROPTEST_RNG_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev
          save: 'false'
          pos-app: 'false'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # What `cargo xtask engine scale` runs, built as it builds it, so the
      # step after it times only the scenarios.
      - name: Build the scale tests
        run: |
          cargo build -p xtask --locked
          cargo nextest run --no-run -p engine --lib --locked --profile ci
      - name: Run the scale scenarios
        run: cargo xtask engine scale
      - name: Preserve replay settings, failures and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-scale-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/engine-scale/
            crates/engine/proptest-regressions/

  summary:
    # Passes only when every suite did (a suite this platform doesn't run is
    # skipped). With coverage, also the one artifact and index from the
    # collectors, checked as `cargo xtask coverage all` checks a local run.
    name: summary
    needs: [rust, rust-partitions, browser, stress, scale]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        if: inputs.coverage
      # Builds only xtask, which the Rust tests job's cache holds.
      - uses: ./.github/actions/setup-rust
        if: inputs.coverage
        with:
          shared-key: dev
          save: 'false'
          pos-app: 'false'
      - uses: actions/download-artifact@v8
        if: inputs.coverage
        with:
          pattern: coverage-*-${{ github.sha }}
          path: target/coverage
          merge-multiple: true
      - name: Combine and check the coverage report
        id: report
        if: inputs.coverage
        continue-on-error: true
        run: cargo xtask coverage report
      - name: Summarize the coverage
        if: always() && inputs.coverage
        run: |
          cargo xtask coverage summary >> "$GITHUB_STEP_SUMMARY"
          cargo xtask test-summary 'Coverage tests' \
            rust=target/coverage/rust/junit.xml \
            browser=target/coverage/browser/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage report
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: warn
      - name: Fail unless every suite passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          REPORT: ${{ steps.report.outcome }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          for name in $failed; do echo "::error::$name did not pass"; done
          # Skipped without coverage.
          if test "$REPORT" = failure; then echo '::error::the coverage report did not pass'; exit 1; fi
          test -z "$failed"
