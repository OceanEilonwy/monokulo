name: engine property exploration

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      cases:
        description: Generated cases per property (saved regressions run as well)
        type: choice
        options: ['128', '256', '512', '1024']
        default: '512'
      proof_cases:
        description: Cases per real verifier property (CPU and memory intensive)
        type: choice
        options: ['16', '32', '64', '128']
        default: '32'

permissions:
  contents: read

jobs:
  tooling:
    uses: ./.github/workflows/engine-verification-tooling.yml

  properties:
    needs: tooling
    name: properties (features=${{ matrix.features || 'default' }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        features: ['']
    env:
      PROPTEST_CASES: ${{ inputs.cases || '512' }}
      ENGINE_PROOF_CASES: ${{ inputs.proof_cases || '32' }}
      # A different reproducible seed for each scheduled/manual run.
      PROPTEST_RNG_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      # The Rust tests job's toolchain, profile and cache (platform.yml): the
      # properties are engine and key-custody unit tests, which that job
      # builds too. Restore only; a cache of this job's own was the first to
      # go when the repository passed GitHub's 10 GB.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev
          save: 'false'
          pos-app: 'false'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Explore engine properties and summarize what they reached
        # Records the toolchain, runs the properties, then always writes
        # target/engine-exploration/properties/report.json.
        run: cargo xtask engine properties '${{ matrix.features || 'default' }}'
      - name: Preserve counterexamples and test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-properties-${{ matrix.features || 'default' }}-${{ github.run_id }}
          path: |
            crates/engine/proptest-regressions/
            target/nextest/ci/junit.xml
            target/engine-exploration/
          if-no-files-found: ignore

  regressions:
    # A counterexample is a bug; a draft PR from ci/proptest carries its
    # regression line to main.
    name: propose counterexamples as regressions
    needs: properties
    if: always() && github.ref == 'refs/heads/main' && needs.properties.result == 'failure'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-properties-*
          path: ${{ runner.temp }}/property-artifacts
      - run: .github/scripts/propose-proptest-regressions.sh "$RUNNER_TEMP/property-artifacts"
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    # This run's properties page, with every other part of the site as it is
    # live (pages.yml). On main only; a run that didn't finish shows nothing
    # new.
    name: pages
    needs: properties
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success", "failure"]'), needs.properties.result)
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      part: properties
      conclusion: ${{ needs.properties.result }}
