name: Set up Rust
description: >
  The latest nightly, as rust-toolchain.toml names it, with the WebAssembly
  target monokulo's build script builds key custody's browser module for;
  the Rust cache; and the POS app's npm dependencies, which monokulo's build
  script builds the POS app from.

inputs:
  targets:
    description: More targets, comma separated
    default: ''
  components:
    description: More toolchain components, comma separated
    default: ''
  cache-key:
    description: >
      Separates this job's Rust cache from others the same job id makes;
      ignored with a shared-key
    default: ''
  shared-key:
    description: >
      Jobs that pass the same shared-key use one Rust cache on a runner type,
      whatever their job ids and cache-keys; empty keeps this job's own
    default: ''
  cache:
    description: >
      Restore (and on main save) the Rust cache. Release builds turn it off:
      they run rarely and in the release profile, which no other job builds,
      so their caches only pushed the ones other jobs restore out of the
      repository's 10 GB
    default: 'true'
  save:
    description: >
      Save the Rust cache when the job ends (on main only). A job that
      shares a cache with another sets this to false and only restores it
    default: 'true'
  pos-app:
    description: Install the POS app's npm dependencies (only builds of monokulo need them)
    default: 'true'
  npm-lockfiles:
    description: The lock files setup-node's npm cache is keyed on
    default: crates/monokulo/pos-ui/package-lock.json

runs:
  using: composite
  steps:
    - if: inputs.pos-app == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ${{ inputs.npm-lockfiles }}
    - if: inputs.pos-app == 'true'
      name: Install POS app dependencies
      shell: bash
      run: npm ci --prefix crates/monokulo/pos-ui --no-audit --no-fund
    # Nothing in CI is debugged, so dev and test builds optimise the
    # workspace's own crates as Cargo.toml does the dependencies, and keep
    # file and line numbers for backtraces but none of the rest of the debug
    # info, which CI never reads (a smaller cache, and our own crates, which
    # the Rust cache does not keep, compile and link faster). Set before the
    # Rust cache, whose key considers CARGO_* variables; so is the terminal
    # colour, so every job that shares a cache has the same key. Coverage
    # (cargo xtask coverage rust) sets the optimisation back to 0 for its own
    # build.
    - name: Set the dev profile for CI
      shell: bash
      run: |
        echo CARGO_PROFILE_DEV_OPT_LEVEL=3 >> "$GITHUB_ENV"
        echo CARGO_PROFILE_DEV_DEBUG=line-tables-only >> "$GITHUB_ENV"
        echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: ${{ inputs.components }}
        targets: wasm32-unknown-unknown${{ inputs.targets != '' && format(', {0}', inputs.targets) || '' }}
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.shared-key }}
        # A job that fails its tests still built the dependencies.
        cache-on-failure: true
        # Only main saves. Every pull request used to save its own copy of
        # each job's cache (about 3 GB of Linux caches a pull request), which
        # took the repository past GitHub's 10 GB limit, and the least
        # recently used caches go first: main's Windows and macOS ones, which
        # only a main push touches, so Windows rebuilt every dependency.
        # Pull requests still restore main's.
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.save == 'true' }}
