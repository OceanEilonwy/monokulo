# cargo-nextest runs every test binary's tests side by side, each test in a
# process of its own (plain `cargo test` finishes one binary before starting
# the next). The `ci` profile is what CI and `cargo xtask coverage rust` use:
# it runs everything rather than stopping at the first failure, and writes a
# JUnit report that `cargo xtask test-summary` turns into the job summary.
[profile.ci]
slow-timeout = { period = "120s", terminate-after = 10 }
fail-fast = false
# No retries: a test that fails once fails the run. A retry would let a
# test that fails every other run keep CI green; a flaky test is a bug to
# fix, not a result to average.
retries = 0
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# Process-level watchdogs also catch blocking loops that Tokio cannot cancel.
[profile.default]
slow-timeout = { period = "120s", terminate-after = 10 }

# Proof-of-work tests hash real blocks with RandomX, each process holding up
# to two 256 MiB light-mode caches (pow::hasher::MAX_KEYS) on a thread that
# competes with their real 30ms RPC timeouts. Sixteen at a time keeps that to
# about 8 GiB; a 4-thread CI runner never reaches the cap.
[test-groups.proof-workers]
max-threads = 16

# Overrides apply to every profile: nextest reads the default profile's after
# the selected profile's own. Each setting comes from the first override that
# matches the test and sets it.
[[profile.default.overrides]]
filter = 'test(/^proof::/) | test(real_verifier_and_scanner)'
test-group = 'proof-workers'
slow-timeout = { period = "300s", terminate-after = 12 }

# The slowest tests start first (nextest otherwise starts binaries and tests
# in name order), so a run does not end waiting on a 20-30s property that
# started last. Only the order changes; every test still runs.
[[profile.default.overrides]]
filter = 'test(/^work::tests::properties::money::(nodes|expansions)::/) | test(/^proof::tests::properties::/) | test(/every_recorded_ringct_variant/) | test(/^work::tests::every_sql_failure_while_a_payment_confirms/) | test(/^work::mempool::properties::scale::/)'
priority = 100

[[profile.default.overrides]]
filter = 'test(/properties/) | test(/every_sql_failure/) | test(/scale/)'
priority = 50
