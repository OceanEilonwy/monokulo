# Monokulo with Docker Compose: one container from the image the Dockerfile
# builds, with the engine running inside monokulo (engine.mode = "embedded",
# the default; docs/engine_as_library.md).
#
# Put the one secret in a .env file beside this one (never commit it):
#
#   MONOKULO_ENCRYPTION_KEY=<openssl rand -hex 32>   # encrypts monokulo's data at rest; keep it
#
# Where monokulo listens and where its database is are given as options
# below, so the admin page shows them locked. The engine's database goes
# beside it (/var/lib/monokulo/engine.db). Everything else is kept in the
# options file (/var/lib/monokulo/monokulo.toml, in the volume), the
# engine's settings under its [engine.*] tables; the admin page saves to it.
# Edit it by hand and press Reload options file there.
#
# Then `docker compose up -d` and open http://localhost:8081 to create the
# admin account. Monero nodes and everything else are set on its admin page.
#
# To run the engine as a container of its own instead (engine.mode =
# "remote"), see the commented services at the end.

services:
  monokulo:
    build: .
    image: monokulo
    command:
      - monokulo
      - --options=/var/lib/monokulo/monokulo.toml
      - --server-bind=0.0.0.0:8081
      - --database-path=/var/lib/monokulo/monokulo.db
    environment:
      MONOKULO_ENCRYPTION_KEY: ${MONOKULO_ENCRYPTION_KEY:?set MONOKULO_ENCRYPTION_KEY in .env}
    ports:
      - "8081:8081"
    volumes:
      - monokulo-data:/var/lib/monokulo
    restart: unless-stopped

# The engine in a container of its own: replace the service above with these
# two, and add ENGINE_TOKEN=<openssl rand -hex 32> to .env. The engine
# answers no request without the token; the engine gets it as ENGINE_TOKEN
# and monokulo, which sends it with every request, as MONOKULO_ENGINE_TOKEN.
# Only monokulo is published; the engine's admin API stays on the compose
# network. Its settings live in its own options file
