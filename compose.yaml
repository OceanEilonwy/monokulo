# Monokulo with Docker Compose: the engine and monokulo as two containers from
# the image the Dockerfile builds. Only monokulo is published; the engine's
# admin API stays on the compose network.
#
# Put the two secrets in a .env file beside this one (never commit it):
#
#   MONOKULO_ENCRYPTION_KEY=<openssl rand -hex 32>   # encrypts monokulo's data at rest; keep it
#   ENGINE_TOKEN=<openssl rand -hex 32>              # the engine token
#
# The engine token is required: the engine answers no request without
# it, and neither container starts without it (at least 32 characters). The
# engine gets it as ENGINE_TOKEN and monokulo, which sends it with every
# request to the engine, as MONOKULO_ENGINE_TOKEN. Monokulo's engine
# address and token come only from here: its admin page shows them locked. To
# change the token, edit .env and recreate both containers.
#
# Then `docker compose up -d` and open http://localhost:8081 to create the
# admin account. Monero nodes and everything else are set on its admin page.

services:
  engine:
    build: .
    image: monokulo
    command: ["monokulo-engine"]
    environment:
      ENGINE_TOKEN: ${ENGINE_TOKEN:?set ENGINE_TOKEN in .env}
    volumes:
      - engine-data:/var/lib/monokulo
    restart: unless-stopped

  monokulo:
    image: monokulo
    depends_on: [engine]
    environment:
      MONOKULO_ENCRYPTION_KEY: ${MONOKULO_ENCRYPTION_KEY:?set MONOKULO_ENCRYPTION_KEY in .env}
      MONOKULO_ENGINE_URL: http://engine:8443
      MONOKULO_ENGINE_TOKEN: ${ENGINE_TOKEN:?set ENGINE_TOKEN in .env}
    ports:
      - "8081:8081"
    volumes:
      - monokulo-data:/var/lib/monokulo
    restart: unless-stopped

volumes:
  engine-data:
  monokulo-data:
