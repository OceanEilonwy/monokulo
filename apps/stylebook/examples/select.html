<form class="mk-stack" action="#select" method="get">
<div class="mk-field"><label for="currency">Currency</label><mk-select><select class="mk-input" name="currency" id="currency"><option value="AUD">Australian dollar</option><option value="EUR">Euro</option><option value="XMR">Monero</option></select></mk-select></div>
<div class="mk-actions"><button class="mk-btn" type="reset">Reset</button><button class="mk-btn" type="submit">Submit normally</button><button class="mk-btn" type="button" id="drive-select" hidden>Change with JavaScript</button></div>
<p>Last change: <output id="selected-currency" aria-live="polite">AUD</output></p>
</form>
