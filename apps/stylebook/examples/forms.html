<div class="mk-grid">
<div class="mk-field"><label for="normal">Store name</label><input class="mk-input" id="normal" placeholder="Your store" aria-describedby="normal-help"><p class="mk-hint" id="normal-help">Shown to customers on the payment page.</p></div>
<div class="mk-field"><label for="invalid">Email</label><input class="mk-input" id="invalid" type="email" value="incomplete" aria-invalid="true" aria-describedby="email-error"><p class="mk-error" id="email-error">Enter a complete email address.</p></div>
<div class="mk-field"><label for="readonly">Read only</label><input class="mk-input" id="readonly" value="Store 123" readonly></div>
<div class="mk-field"><label for="disabled">Unavailable</label><input class="mk-input" id="disabled" value="Managed by your administrator" disabled></div>
<div class="mk-field"><label for="notes">Notes</label><textarea class="mk-input" id="notes" rows="3"></textarea></div>
<fieldset class="mk-fieldset mk-stack"><legend>Notifications</legend><label class="mk-check"><input type="checkbox" name="email-updates" checked>Email updates</label><label class="mk-check"><input type="radio" name="frequency" checked>Every payment</label><label class="mk-check"><input type="radio" name="frequency">Daily summary</label></fieldset>
</div>
